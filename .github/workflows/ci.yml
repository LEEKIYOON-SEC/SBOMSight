name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 테스트 (Python + JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 의존성 설치
        run: python -m pip install -r requirements-dev.txt

      - name: Python 테스트
        run: python -m pytest

      # 이그레스 가드와 매칭 엔진은 Python·JavaScript 두 벌로 구현되어 있다.
      # 한쪽만 돌리면 두 구현이 갈라진 것을 잡지 못한다.
      - name: 이그레스 가드 적합성 (JS)
        run: |
          HASH="$(python -c "import sys; sys.path.insert(0,'.'); from core.policy import load; print(load('policy/egress-policy.json').sha256)")"
          node tests/js/sanitizer.test.mjs "$HASH"

      - name: 파리티 (JS ↔ Python)
        run: |
          python scripts/gen_parity_fixture.py
          node tests/js/parity.test.mjs
          # 커밋된 기대값이 현재 구현과 어긋나지 않는지 확인한다.
          git diff --exit-code tests/fixtures/parity-expected.json \
            || (echo "::error::파리티 기대값이 낡았습니다. scripts/gen_parity_fixture.py 를 다시 돌리고 커밋하세요." && exit 1)
