name: Pages 배포

# Pages는 **전시장**이다. 여기서 스캔하지 않는다.
#
# 실제 판정은 담당자 PC에서 진짜 Syft/Grype로 이루어지고, 그 결과를
# `python -m core.cli export --out results` 로 내보내 리포에 커밋한다.
# 이 워크플로는 그 기록과 프론트엔드를 묶어 올릴 뿐이다.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'results/**'
      - 'policy/**'
      - 'rules/**'
      - 'scripts/build_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 배포물 조립 + 배포
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 배포물 조립
        run: python scripts/build_pages.py --out dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
