## SBOMSight 기본 설정
##
## 여기 적힌 값은 개발 기본값이다. 실제 운영 값(비밀번호·인증서 암호)은
## application-prod.yml 이나 환경변수로 덮어쓴다 — 저장소에 두지 않는다.

server:
  # 금융권 지침상 http 로는 열지 않는다. 443 고정.
  port: ${SBOMSIGHT_PORT:8443}
  ssl:
    enabled: true
    # 자체 서명으로 시작하고, 정식 인증서를 받으면 이 파일만 바꿔 끼운다.
    # 형식이 PKCS12 라 사내 CA 가 내주는 .pfx 를 그대로 쓸 수 있다.
    key-store: ${SBOMSIGHT_KEYSTORE:file:./config/keystore.p12}
    key-store-type: PKCS12
    key-store-password: ${SBOMSIGHT_KEYSTORE_PASSWORD:changeit}
    key-alias: ${SBOMSIGHT_KEY_ALIAS:sbomsight}
    # 구형 프로토콜은 열지 않는다. 점검에서 가장 먼저 지적되는 항목이다.
    enabled-protocols: TLSv1.3,TLSv1.2
  servlet:
    session:
      # 놀고 있으면 끊는다. 마지막 요청으로부터 잰다 — 쓰고 있는 동안에는
      # 요청이 계속 나가므로 밀려나지 않는다. 톰캣이 직접 관리한다.
      timeout: ${SBOMSIGHT_SESSION_TIMEOUT:10m}
      cookie:
        http-only: true
        secure: true
        same-site: lax
        name: SBOMSIGHT_SESSION
  tomcat:
    # SBOM 은 수백 MB 가 예사다. 업로드는 파일로 흘려보낸다.
    max-swallow-size: -1
  compression:
    # 화면의 바탕 CSS(Tabler)가 694KB 다. 압축하면 90KB 안팎으로 나간다.
    # 이미 압축된 글꼴(woff2)은 목록에 넣지 않는다 — 다시 압축해도 줄지 않고
    # CPU 만 쓴다.
    enabled: true
    mime-types: text/html,text/css,text/plain,application/javascript,application/json
    min-response-size: 2KB

spring:
  application:
    name: SBOMSight

  datasource:
    # MariaDB Connector/J 를 쓴다. MariaDB 와 MySQL 8 둘 다 이 주소로 붙는다.
    #   sslMode=disable            같은 PC 안이라 TLS 를 걸지 않는다. 밖에 두면 바꾼다.
    #   rewriteBatchedStatements   grype 한 번에 수만 건이 들어온다. 묶어 보낸다.
    #   allowPublicKeyRetrieval    MySQL 8 의 caching_sha2_password 때문이다. 아래 참조.
    # 문자셋은 드라이버 기본이 utf8mb4 라 따로 적지 않는다.
    #
    # **allowPublicKeyRetrieval 을 빼면 DB 서버가 재부팅된 다음부터 기동이 막힌다.**
    # MySQL 8 은 한 번 인증한 계정을 메모리에 캐시해 두고 그동안은 간단한 경로로
    # 받아 주는데, 그 캐시는 서버가 다시 뜨면 비워진다. 그 뒤 첫 접속은 전체 인증을
    # 해야 하고, 전체 인증은 TLS 이거나 서버의 RSA 공개키가 있어야 한다. 둘 다 없으면
    # 드라이버가 "RSA public key is not available client side" 로 멈춘다 — DB 는
    # 멀쩡하고 비밀번호도 맞는데 아침에 안 뜨는, 가장 알아보기 어려운 모양이 된다.
    # 실제로 실 PC 에서 그렇게 하루를 잃었다. DB 를 다른 PC 에 두면 이 옵션 대신
    # sslMode=trust 로 붙는다 — 암호화된 연결 위에서는 공개키가 필요 없다.
    url: ${SBOMSIGHT_DB_URL:jdbc:mariadb://127.0.0.1:13306/sbomsight?sslMode=disable&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true}
    username: ${SBOMSIGHT_DB_USER:sbomsight}
    password: ${SBOMSIGHT_DB_PASSWORD:devpass}
    hikari:
      # grype 한 번에 수만 건이 들어온다. 배치 저장이 커넥션을 오래 쥔다.
      maximum-pool-size: 10
      connection-timeout: 10000

  jpa:
    hibernate:
      # 스키마는 Flyway 만 건드린다. 운영 DB 를 자동으로 고치게 두지 않는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${SBOMSIGHT_MAX_UPLOAD:10GB}
      max-request-size: ${SBOMSIGHT_MAX_UPLOAD:10GB}
      # 메모리에 올리지 않고 바로 디스크로 흘린다.
      file-size-threshold: 1MB

  thymeleaf:
    cache: true

sbomsight:
  # SBOM 원본과 grype 결과를 보관하는 곳. gzip 으로 저장한다.
  data-dir: ${SBOMSIGHT_DATA_DIR:./data}
  grype-path: ${SBOMSIGHT_GRYPE:grype}
  syft-path: ${SBOMSIGHT_SYFT:syft}
  # grype 한 번이 오래 걸릴 수 있다. 넉넉히 두고, 넘으면 실패로 남긴다.
  grype-timeout-minutes: ${SBOMSIGHT_GRYPE_TIMEOUT:60}
  # 최초 관리자. 계정이 하나도 없을 때만 만들어진다.
  bootstrap-admin: ${SBOMSIGHT_ADMIN:admin}
  # 접속 허용 IP·CIDR (쉼표·줄바꿈 구분). **부트스트랩 값이다** — 웹의
  # `설정 → 접근 IP` 에서 한 번이라도 저장하면 그때부터 DB 값이 쓰인다.
  # 비어 있으면 IP 제한 없음이며, 로그인은 여전히 필요하다.
  allowed-ips: ${SBOMSIGHT_ALLOWED_IPS:}
  # 연속 로그인 실패 이 횟수에 이르면 계정을 잠근다. 0 이면 잠그지 않는다.
  max-login-failures: ${SBOMSIGHT_MAX_LOGIN_FAILURES:5}
  # 잠금이 스스로 풀리기까지(분). 0 이면 관리자가 풀어 줄 때까지 잠긴다.
  # 영구 잠금이 점검 기준에는 더 맞지만, 이름만 알면 누구든 남의 계정을
  # 잠글 수 있고 새벽에 본인이 잠기면 손쓸 데가 없다.
  lock-minutes: ${SBOMSIGHT_LOCK_MINUTES:30}
  # 비밀번호를 이 기간 이상 안 바꾸면 다음 로그인에서 변경을 강제한다.
  password-max-age-days: ${SBOMSIGHT_PASSWORD_MAX_AGE_DAYS:90}

logging:
  level:
    kr.sbomsight: INFO
