<!doctype html>
<!--/*
  탐지 표 — **한 벌만 둔다.**

  `/vulns` 와 자산 상세의 취약점 탭이 같은 것을 쓴다. 두 벌을 두면 한쪽만
  고치는 날이 오고, 그때부터 같은 데이터가 화면마다 다르게 보인다.

  쪽 넘김은 여기서 그리지 않는다 — 주소가 화면마다 다르므로 부르는 쪽이 한다.
*/-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--/*
  ─── 표 머리를 눌러 정렬한다 ───────────────────────────────────────────

  앞서는 표 위에 정렬 단추 묶음이 따로 있었고 **방향이 없었다** — 낮은
  것부터 보고 싶으면 방법이 없었다. 같은 일을 하는 자리를 두 곳에 두지
  않는다. 자산 목록이 이미 표 머리로 돌고 있으므로 여기도 같게 한다.

  **칸마다 처음 눌렀을 때의 방향이 다르다.** 숫자·심각도는 큰 것부터,
  이름은 사전 순부터다. 그 방향을 여기서 정하고 서버는 `dir` 을
  곧이곧대로 읽는다 — 서버가 다시 뒤집으면 찍힌 화살표와 실제 순서가
  어긋난다.

  기본값(`dir=desc`)은 주소에 적지 않는다. `null` 을 주면 그 값이 빠진다.
*/-->
<div th:fragment="items(rows, showAsset, analyses, actions, links, sort, dir)"
     class="table-responsive">
  <table class="table table-vcenter card-table">
    <thead>
    <tr>
      <th class="tight" th:if="${showAsset}">자산</th>
      <th class="tight sortable">
        <a th:href="@{${links.copy().with('dir', sort == 'cve' and dir == 'asc' ? null : 'asc').sort('cve')}}">취약점
          <span class="sortmark" th:if="${sort == 'cve'}"
                th:text="${dir == 'asc'} ? '↑' : '↓'">↑</span></a></th>
      <th class="tight sortable">
        <a th:href="@{${links.copy().with('dir', sort == 'severity' and dir == 'desc' ? 'asc' : null).sort('severity')}}">심각도
          <span class="sortmark" th:if="${sort == 'severity'}"
                th:text="${dir == 'asc'} ? '↑' : '↓'">↓</span></a></th>
      <th class="num tight sortable">
        <a th:href="@{${links.copy().with('dir', sort == 'cvss' and dir == 'desc' ? 'asc' : null).sort('cvss')}}">CVSS
          <span class="sortmark" th:if="${sort == 'cvss'}"
                th:text="${dir == 'asc'} ? '↑' : '↓'">↓</span></a></th>
      <!--/*
        **`grype 신호` 가 아니라 `실제 악용` 이다.** 이 칸에 들어가는 것은
        KEV(CISA 의 실제 악용 목록)뿐이고, 화면의 다른 자리는 이미 그 말을
        쓰고 있다(거르개 `실제 악용 전체`, 딱지 `실제 악용 확인`). 한 가지를
        두 말로 부르지 않는다. 약어(KEV)는 칸 이름 대신 `title` 에 둔다 —
        줄여서 뜻이 흐려지면 줄이지 않는다.

        **악용 확률보다 앞에 둔다.** 확률은 예측이고 이것은 확인된 사실이다.
      */-->
      <!--/*
        **머리글만 줄바꿈을 허용한다**(`tight` 를 떼되 칸의 값에는 남긴다).
        `조치` 칸을 넣으면서 표가 1280px 에서 68px 넘쳤다 — 넘친 만큼
        오른쪽 끝이 잘리는데, 그 자리가 이번에 넣은 `조치` 다. 두 글자
        머리가 두 줄로 접히면 그만큼이 빈다. 값(`확인` · `12.34%`)은
        여전히 한 줄이다.
      */-->
      <th title="CISA KEV — 실제 악용이 확인된 취약점">실제 악용</th>
      <th class="num sortable">
        <a th:href="@{${links.copy().with('dir', sort == 'epss' and dir == 'desc' ? 'asc' : null).sort('epss')}}">악용 확률
          <span class="sortmark" th:if="${sort == 'epss'}"
                th:text="${dir == 'asc'} ? '↑' : '↓'">↓</span></a></th>
      <!--/*
        글자가 들어가는 두 칸은 `tight`(줄바꿈 금지)를 주지 않는다. 전부
        `tight` 면 표가 칸보다 120px 넓어지고, 그만큼 오른쪽의 `검토 결과`
        칸이 **통째로 화면 밖으로 밀린다** — 이 화면에서 가장 많이 누르는
        `작성` 이 안 보이는 셈이었다. 띄워서 재 보고 찾았다.
      */-->
      <th class="sortable">
        <a th:href="@{${links.copy().with('dir', sort == 'package' and dir == 'asc' ? null : 'asc').sort('package')}}">패키지
          <span class="sortmark" th:if="${sort == 'package'}"
                th:text="${dir == 'asc'} ? '↑' : '↓'">↑</span></a></th>
      <th>현재 → 목표</th>
      <!--/*
        grype 이 낸 것(실제 악용·심각도·확률)과 우리가 적은 것(검토 결과)은
        다른 칸에 둔다. 한 칸에 섞으면 누가 말한 것인지 구분되지 않는다.
      */-->
      <th>검토 결과</th>
      <!--/*
        **검토와 조치는 같은 일의 앞뒤다.** 앞서는 검토 결과를 적고 나서
        그것을 조치로 올리려면 보고서를 새로 만들어 3장까지 내려가야 했다.

        조치는 `(자산, 패키지)` 하나에 하나이고 검토 결과는 `(자산, CVE,
        패키지)` 하나에 하나다 — 그래서 같은 패키지의 여러 줄이 <b>같은
        조치 하나</b>를 가리킨다. 숨기지 않는다: 이미 열려 있으면
        `조치 등록` 이 아니라 `조치 보기` 다.
      */-->
      <th class="tight">조치</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="f : ${rows}">
      <td class="tight" th:if="${showAsset}">
        <a th:href="@{'/assets/' + ${f.scan.asset.id}}" style="font-weight:600"
           th:text="${f.scan.asset.name}">web-01</a>
        <div class="faint" style="font-size:12px">
          <i class="zrail" th:style="'background:' + (${#strings.isEmpty(f.scan.asset.zone.color)}
                                     ? '#6f7e8d' : ${f.scan.asset.zone.color})"
             style="height:9px"></i>
          <span th:text="${f.scan.asset.zone.name}">DMZ</span></div>
      </td>

      <!--/*
        결재·보고는 CVE 번호로 돈다. grype 이 GHSA 를 주 식별자로 낸 경우에도
        함께 준 CVE 를 앞에 놓고, grype 의 번호는 아래에 남긴다.

        번호를 누르면 CVE 상세로 간다 — 앞서는 눌러도 갈 곳이 없었다.
      */-->
      <td class="tight mono">
        <a th:href="@{'/vulns/' + ${f.displayId}}" th:text="${f.displayId}">CVE-0000-0000</a>
        <div class="faint" th:if="${!#strings.isEmpty(f.secondaryId)}"
             th:text="${f.secondaryId}">GHSA-…</div>
      </td>

      <td class="tight">
        <span class="sev" th:classappend="${#strings.toLowerCase(f.severity)}">
          <i></i>
          <span th:switch="${#strings.toLowerCase(f.severity)}">
            <th:block th:case="'critical'">심각</th:block>
            <th:block th:case="'high'">높음</th:block>
            <th:block th:case="'medium'">보통</th:block>
            <th:block th:case="'low'">낮음</th:block>
            <th:block th:case="*" th:text="${#strings.isEmpty(f.severity)} ? '미확인' : ${f.severity}">미확인</th:block>
          </span>
        </span>
      </td>

      <!--/* 값이 없으면 0 이 아니라 — 로 둔다. 없는 것을 낮은 것으로 보이게
           하면 화면이 거짓말을 한다. */-->
      <td class="num tight" th:text="${f.cvssScore != null} ? ${f.cvssScore} : '—'">—</td>
      <!--/*
        grype 이 준 것. 우리가 더하거나 빼지 않는다.

        **매칭 방식(`exact-direct-match`)은 CVE 상세로 내렸다.** 줄마다 같은
        값이 찍혀 아무것도 말해 주지 않으면서 칸을 먹었다. 값은 그대로 있다.
      */-->
      <td class="tight">
        <span th:if="${f.kev != null && f.kev}" class="tag kev">확인</span>
        <span th:if="${f.kevRansomware != null && f.kevRansomware}" class="tag kev">랜섬웨어</span>
        <span class="faint"
              th:if="${(f.kev == null or !f.kev) and (f.kevRansomware == null or !f.kevRansomware)}">—</span>
      </td>
      <td class="num tight"
          th:text="${f.epss != null} ? ${#numbers.formatDecimal(f.epss * 100, 1, 2)} + '%' : '—'">—</td>

      <td>
        <span th:text="${f.packageName}">openssl</span>
        <div class="faint" th:text="${f.packageType}">rpm</div>
        <!--/* 경로는 grype 이 줄 때만 나온다. 빈 칸을 만들어 두면 "경로가 없는
             패키지" 처럼 읽힌다 — 실제로는 SBOM 이 안 담은 것이다. */-->
        <div class="faint path" th:if="${!#strings.isEmpty(f.installPath)}"
             th:text="${f.installPath}" th:title="${f.installPath}">/opt/…</div>
      </td>

      <td class="mono">
        <span th:text="${f.packageVersion}">1.0.0</span> →
        <b th:if="${f.fixAvailable}" th:text="${f.fixedVersion}">2.0.0</b>
        <span th:if="${f.noFix}" class="tag nofix">수정 버전 없음</span>
        <span th:if="${!f.fixAvailable && !f.noFix}" class="faint">확인 필요</span>
      </td>

      <!--/*
        우리가 적은 것. **건수를 줄이지 않는다** — 표시만 붙는다. 줄이면
        보고서가 실제보다 안전해 보이는 숫자를 말하게 된다.

        적기 단추는 모든 행에 둔다. 앞서는 수정 버전이 없는 행에만 있었는데,
        `해당 없음` 과 `오탐` 은 수정 버전이 있든 없든 적을 수 있어야 한다 —
        오히려 오탐은 수정 버전이 있는 행에서 더 자주 나온다.
      */-->
      <!--/*
        키를 **화면에 찍는 번호**로 잡는다. grype 이 GHSA 를 주 식별자로 낸
        건은 f.cve 가 `GHSA-…` 이고 사람이 읽는 것은 함께 온 CVE 번호다.
        결재도 보고도 CVE 번호로 도는데 우리만 GHSA 로 묶어 두면, 같은 건을
        적어 놓고도 목록에서는 "아직 안 적음" 으로 보인다 — 실제로 그랬다.

        옛 주 식별자로 적힌 것(위험 수용에서 옮겨 온 행)도 찾아야 하므로
        두 번호를 모두 본다. grype 의 DB 가 바뀌어 주 식별자가 GHSA 에서
        CVE 로 옮겨 가도 적어 둔 것이 조용히 떨어져 나가지 않는다.
      */-->
      <td th:with="key=${f.scan.asset.id + '|' + f.displayId + '|' + f.packageName},
                   alt=${f.scan.asset.id + '|' + f.cve + '|' + f.packageName},
                   a=${analyses.containsKey(key)} ? ${analyses.get(key)} : ${analyses.get(alt)}">
        <th:block th:if="${a != null and !a.untouched}">
          <span class="sev" th:classappend="${a.state.name() == 'EXPLOITABLE'} ? 'high'
                            : (${a.open} ? 'medium' : 'low')"><i></i>
            <span th:text="${a.state.label()}">해당 없음</span></span>
          <span th:if="${a.response != null}" class="tag"
                th:text="${a.response.label()}">위험 수용</span>
          <div class="faint" th:if="${a.justification != null}"
               th:text="${a.justification.label()}">취약한 코드가 들어 있지 않음</div>
          <div class="faint" th:if="${a.reviewOverdue}"
               th:text="'재검토일 ' + ${a.reviewBy} + ' 지남'">재검토일 지남</div>
        </th:block>

        <a sec:authorize="hasRole('ADMIN')" class="analysis-link" href="#"
           th:text="${a != null and !a.untouched} ? '수정' : '작성'"
           th:attr="data-asset=${f.scan.asset.id}, data-cve=${f.displayId},
                    data-pkg=${f.packageName}, data-label=${f.displayId},
                    data-state=${a != null} ? ${a.state.name()} : 'NOT_SET',
                    data-justification=${a != null and a.justification != null}
                                       ? ${a.justification.name()} : '',
                    data-response=${a != null and a.response != null}
                                  ? ${a.response.name()} : '',
                    data-review=${a != null and a.reviewBy != null} ? ${a.reviewBy} : '',
                    data-note=${a != null} ? ${a.note} : '',
                    data-control=${a != null} ? ${a.otherControl} : '',
                    data-doc=${a != null} ? ${a.approvalDoc} : '',
                    data-exists=${a != null and !a.untouched}">작성</a>
      </td>

      <td class="tight" th:with="r=${actions.get(f.scan.asset.id + '|' + f.packageName)}">
        <a th:if="${r != null}" th:href="@{'/actions/' + ${r.id}}"
           th:title="${r.packageName} + ' 조치 · ' + ${r.status.label()}"
           th:text="${r.status.label()}">대기</a>
        <!--/*
          **옆 칸의 `작성` 과 같은 모양이다.** 단추로 두면 칸이 96px 를 먹고,
          그만큼 표가 1280px 를 넘어 이 칸이 통째로 화면 밖으로 밀린다 —
          이 칸에 넣은 이유가 없어진다. 같은 표에서 같은 성격의 조작(우리가
          적는 것)이 두 모양으로 놀지 않는 편이 낫기도 하다.

          모양만 링크이고 <b>POST 하는 submit</b> 이다. 링크로 두면 주소만
          알면 눌리지 않고도 조치가 열린다.
        */-->
        <form th:if="${r == null}" method="post" sec:authorize="hasRole('ADMIN')"
              th:action="@{'/assets/' + ${f.scan.asset.id} + '/remediations'}">
          <input type="hidden" name="packageName" th:value="${f.packageName}">
          <button type="submit" class="linkbtn">조치 등록</button>
        </form>
        <span class="faint" th:if="${r == null}" sec:authorize="!hasRole('ADMIN')">미등록</span>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
