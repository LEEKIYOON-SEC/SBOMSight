<!doctype html>
<!--/*
  화면마다 다시 쓰던 조각들. 여기 하나만 고치면 전부 따라온다.

  왜 필요했나 — 같은 것이 화면마다 다른 모양이었다. 제목 줄이 어떤 화면은
  `.crumb` + `.page-head`, 어떤 화면은 `.page-head` 만, 빈 화면은 글자만 있고
  단추가 없었다. 그래서 화면 사이를 오갈 때마다 눈이 다시 자리를 찾아야 했다.

  **모양은 Tabler(MIT) 의 것을 쓴다.** `.page-header` · `.nav-tabs` · `.empty`
  는 그쪽 클래스이고, 여기서는 그것을 어떤 순서로 놓을지만 정한다.

  타임리프 기본 기능만 쓴다. 식을 여러 줄로 나눠 쓰지 않는다 — 컴파일에
  걸리지 않고 그 화면을 열 때 500 으로 터진다.
*/-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/*
  ─── 페이지 머리 ──────────────────────────────────────────────────────
  상위 라벨 → 제목 → 부제(값) → 오른쪽 단추 묶음. 이 순서를 바꾸지 않는다.

    <div th:replace="~{fragments/ui :: pagehead('자산', ${count} + '대', ~{::actions}, ~{})}"></div>
    <div th:fragment="actions">…단추들…</div>

  넘길 것이 없으면 `~{}` 를 준다.
*/-->
<div th:fragment="pagehead(title, subtitle, actions, pretitle)" class="page-header d-print-none">
  <div class="container-xl">
    <div class="row g-2 align-items-center">
      <div class="col">
        <div class="page-pretitle" th:replace="${pretitle}"></div>
        <h2 class="page-title" th:text="${title}">제목</h2>
        <!--/* 제목 옆 한 줄. 무엇을 언제 봤는지 알려 주는 값이지 설명문이 아니다. */-->
        <div class="page-subtitle text-secondary mt-1"
             th:if="${subtitle != null and !#strings.isEmpty(subtitle)}"
             th:text="${subtitle}">—</div>
      </div>
      <div class="col-auto ms-auto">
        <div class="btn-list" th:replace="${actions}"></div>
      </div>
    </div>
  </div>
</div>


<!--/*
  ─── 탭 한 칸 ─────────────────────────────────────────────────────────
  탭 줄은 부르는 쪽이 <ul class="nav nav-tabs"> 로 감싸고 이 조각을 늘어놓는다.

    <ul class="nav nav-tabs">
      <li th:replace="~{fragments/ui :: tab('/settings', '계정', ${n}, ${active} == 'accounts')}"></li>
    </ul>

  숫자는 0 이면 안 쓴다 — 들어가기 전에 알아야 하는 값만 붙인다.
  탭 선택은 주소에 남는다. 자바스크립트로 감췄다 보였다 하지 않는다 —
  그러면 새로고침했을 때 첫 탭으로 돌아간다.
*/-->
<li th:fragment="tab(href, label, count, current)" class="nav-item">
  <a class="nav-link" th:href="${href}" th:classappend="${current} ? 'active' : ''">
    <span th:text="${label}">탭</span>
    <span class="badge bg-secondary-lt ms-1" th:if="${count != null and count > 0}"
          th:text="${count}">0</span>
  </a>
</li>


<!--/*
  ─── 해당 없음·오탐 포함 ──────────────────────────────────────────────
  탐지 목록은 검토 결과가 **해당 없음 · 오탐**인 건을 기본에서 뺀다 — 볼
  일이 끝났다(rework-plan §4.5 · operations.md). 켜면 함께 보인다. 거르기가
  아니라 보기를 넓히는 것이라 체크박스다(자산 목록의 `운영 종료 자산 포함`
  과 같은 자리).

  **이름은 상태 이름 그대로 적는다.** 문서의 `검토 끝난 것도 보기` 를 쓰지
  않는다 — 위험 수용(해당됨 · 조치 안 함)도 검토가 끝난 것처럼 읽히는데,
  그것은 빠지지 않고 목록에 남는다. 빠지는 것은 정확히 이 두 상태다.

  **빠진 건수를 붙인다** `(n건)`. 빠진 것이 있다는 사실을 목록이 말하지
  않으면 숫자가 조용히 줄어든 목록이 된다.

    <div th:replace="~{fragments/ui :: reviewedout(${includeDone}, ${reviewedOut})}"></div>
*/-->
<label th:fragment="reviewedout(includeDone, count)" class="form-check form-check-inline mb-0">
  <input class="form-check-input" type="checkbox" name="includeDone" value="true"
         th:checked="${includeDone}" data-autosubmit>
  <span class="form-check-label"
        th:text="'해당 없음·오탐 포함' + (${count != null and count > 0} ? ' (' + ${count} + '건)' : '')">해당 없음·오탐 포함</span>
</label>


<!--/*
  ─── 빈 화면 ──────────────────────────────────────────────────────────
  제목 · 한 줄 · 단추 하나. 설명을 두 줄 넘기지 않는다.

    <div th:replace="~{fragments/ui :: empty('뽑을 보고서가 없습니다',
         '자산을 등록하고 그 자산에서 추출한 SBOM 을 업로드', '/', '자산 보기')}"></div>

  단추가 없으면 href 에 null 을 준다 — 그러면 단추 자리가 아예 안 그려진다.
  **href 는 GET 으로 열리는 주소여야 한다.** 자산 목록은 `/` 다 — `/assets` 는
  등록(POST)만 받아 405 를 낸다(PageRenderTest 가 템플릿의 링크를 전부 연다).
*/-->
<div th:fragment="empty(title, message, href, label)" class="empty">
  <p class="empty-title" th:text="${title}">아무것도 없습니다</p>
  <p class="empty-subtitle text-secondary"
     th:if="${message != null and !#strings.isEmpty(message)}" th:text="${message}">—</p>
  <div class="empty-action" th:if="${href != null}">
    <a class="btn btn-dark" th:href="${href}" th:text="${label}">하기</a>
  </div>
</div>


<!--/*
  ─── 건수 줄 ──────────────────────────────────────────────────────────
  목록 위 한 줄. 몇인지, 한 쪽에 몇씩 낼지. **목록이 있는 화면은 전부 이것을
  쓴다** — 두 벌을 두면 한쪽만 고치는 날이 오고, 그때부터 같은 목록이 화면마다
  다르게 센다.

  `1–100번째` 는 뺐다. 지금 몇 쪽인지는 아래 쪽 넘김이 말하고, 위아래 두
  곳이 같은 것을 다르게 세면 읽는 사람이 둘을 맞춰 봐야 한다.

    <div th:replace="~{fragments/ui :: countline(${page}, ${links}, '건')}"></div>

  마지막이 **단위**다. 세는 것이 화면마다 다르다 — 탐지는 `건`, CVE별은
  `가지`, 패키지는 `개`, 자산은 `대`.

  쪽 크기는 주소에 남는다. 기본값(100)은 적지 않는다.
*/-->
<div th:fragment="countline(page, links, unit)"
     class="card-body py-2 border-bottom d-flex align-items-center gap-2 flex-wrap">
  <b class="num" th:text="${#numbers.formatInteger(page.totalElements, 0, 'COMMA')}">0</b>
  <!--/*
    **단위를 받는다.** `건` 을 박아 두면 CVE별 화면 머리가 `3,102건` 이 되는데
    그것은 탐지 건수가 아니라 취약점 **가지** 수다. 한 가지가 자산 열 대에
    있으면 탐지는 열 건이다 — 세는 단위를 말하지 않으면 두 수가 같은 것으로
    읽힌다.
  */-->
  <span class="text-secondary" th:text="${unit}">건</span>
  <span style="flex:1"></span>
  <span class="faint" style="font-size:13px">페이지 사이즈</span>
  <span class="btn-group" th:with="fallback=${T(kr.sbomsight.service.Paging).PAGE_SIZE}">
    <a class="btn btn-sm" th:each="n : ${T(kr.sbomsight.service.Paging).PAGE_SIZES}"
       th:href="@{${links.change('size', n == fallback ? null : n)}}"
       th:classappend="${page.size == n} ? 'active' : ''" th:text="${n}">100</a>
  </span>
</div>


<!--/*
  ─── 페이지 넘김 ──────────────────────────────────────────────────────
  이전 · 다음만 두면 12페이지를 보려고 다음을 열한 번 누른다. **칸에 페이지
  번호를 적으면 그 페이지로 간다.**

    <div th:replace="~{fragments/ui :: pager(${page}, ${links})}"></div>

  form 은 지금의 범위·거르개·정렬을 숨은 칸으로 그대로 실어 보낸다
  (`links.fields()`). 손으로 적으면 거르개를 하나 더할 때 잊는다.

  칸의 이름이 `page` 가 아니라 `jump` 인 이유 — 주소의 `page` 는 0부터
  세고(스프링의 셈), 사람이 읽는 페이지는 1부터다. 같은 이름으로 두면 한
  칸 어긋난 페이지로 간다. 서버가 환산해 `page` 로 되돌린다.
*/-->
<div th:fragment="pager(page, links)"
     class="card-footer d-flex justify-content-center align-items-center gap-2 flex-wrap"
     th:if="${page.totalPages > 1}">
  <a class="btn btn-sm" th:if="${page.hasPrevious()}"
     th:href="@{${links.page(page.number - 1)}}">이전</a>

  <form method="get" th:action="@{${links.path()}}" class="d-flex align-items-center gap-2">
    <input type="hidden" th:each="e : ${links.fields()}" th:name="${e.key}" th:value="${e.value}">
    <input class="form-control form-control-sm num" type="number" name="jump" min="1"
           th:max="${page.totalPages}" style="width:4.5rem" autocomplete="off"
           aria-label="페이지 번호" th:value="${page.number + 1}">
    <span class="text-secondary num" th:text="'/ ' + ${page.totalPages} + ' 페이지'">/ 1 페이지</span>
    <button class="btn btn-sm" type="submit">이동</button>
  </form>

  <a class="btn btn-sm" th:if="${page.hasNext()}"
     th:href="@{${links.page(page.number + 1)}}">다음</a>
</div>


<!--/*
  ─── 묶은 줄의 검토 진행 ──────────────────────────────────────────────
  CVE별·패키지별 한 줄은 **자산 여러 대·건 여러 개를 묶은 줄**이라 검토 결과
  하나를 그 줄에 붙일 수 없다 — 검토 결과는 (자산, CVE, 패키지) 하나에
  하나씩 붙는다. 붙이는 대신 센다.

    <div th:replace="~{fragments/ui :: reviewmark(${r})}"></div>

  수는 **거르개를 건 뒤**의 것이라 같은 화면의 탐지 수와 어긋나지 않는다.
  0 을 `0/7` 로 적지 않는다 — `미검토` 라고 말한다. 0 은 세어 본 결과처럼
  보이지만 아무도 보지 않았다는 뜻이다.
*/-->
<span th:fragment="reviewmark(r)" th:remove="tag">
  <span th:if="${r == null or r.none()}" class="faint">미검토</span>
  <span th:if="${r != null and r.all()}" class="tag" th:text="'전부 ' + ${r.total} + '건'">전부 7건</span>
  <span th:if="${r != null and !r.none() and !r.all()}"
        th:text="${r.done} + ' / ' + ${r.total} + '건'">2 / 7건</span>
</span>


<!--/*
  ─── 수정 버전 ────────────────────────────────────────────────────────
  **하나로 고르지 않는다** (FixVersions). 하나면 그 버전, 여럿이면
  `수정 버전 N가지` 와 그 목록. 조치 화면 · 보고서 · CSV 가 같은 규칙이다 —
  앞서 같은 curl 조치의 목표가 조치 화면은 deb10u4, 보고서는 deb10u9 였다.

    <span th:text="${a.currentVersion}">1.0</span> →
    <th:block th:replace="~{fragments/ui :: fixversions(${a.fixVersions}, '확인 필요')}"></th:block>

  목록은 글자 순이다 — 마지막 것이 가장 높은 버전이라는 뜻이 아니다.
  버전 하나는 쪼개지지 않고(`.ver` · `.fixlist > span`), 줄은 버전 사이에서
  바뀐다. 이 칸의 열 머리에 `tight`(폭 1%)를 주지 않는다 — 주면 칸이 버전
  하나 폭으로 줄어 목록이 한 줄에 하나씩 선다(조치 목록에서 그렇게 떴다).
  `empty` 는 목록이 비었을 때 적을 말 — 조치 대상인데 수정 버전이 없으면
  `확인 필요`, 목록 표의 빈 칸은 `—`.
*/-->
<span th:fragment="fixversions(versions, empty)" th:remove="tag">
  <b class="ver" th:if="${versions.size() == 1}" th:text="${versions[0]}">3.0.7</b>
  <b class="ver" th:if="${versions.size() > 1}" th:text="'수정 버전 ' + ${versions.size()} + '가지'">수정 버전 3가지</b>
  <div class="fixlist" th:if="${versions.size() > 1}"><th:block
       th:each="v, st : ${versions}"><span th:text="${v}">3.0.5</span><th:block
       th:unless="${st.last}"> · </th:block></th:block></div>
  <span class="faint" th:if="${versions.isEmpty()}" th:text="${empty}">—</span>
</span>


<!--/*
  ─── 심각도 막대 ──────────────────────────────────────────────────────
  목록 한 줄에 `심각 3 · 높음 12 · 보통 61 · 낮음 111` 네 덩이를 쓰면
  자산 스무 대를 세로로 훑을 수 없다. 누적 막대 하나로 줄인다.

  **0 이 아닌 구간은 최소 2px.** 비율만으로 그리면 187건 중 심각 1건이
  폭 0 으로 사라진다 — 가장 급한 것이 안 보이는 셈이다. CSS 의
  `.sevbar i { min-width: 2px }` 가 그 일을 한다.

  색만으로 구분하지 않는다. title 에 숫자를 그대로 넣어 올리면 읽힌다.
*/-->
<span th:fragment="sevbar(critical, high, medium, low)" class="sevbar"
      th:with="total=${critical + high + medium + low}"
      th:title="'심각 ' + ${critical} + ' · 높음 ' + ${high} + ' · 보통 ' + ${medium} + ' · 낮음 ' + ${low}">
  <i class="critical" th:if="${critical > 0}" th:style="'width:' + ${critical * 100.0 / total} + '%'"></i>
  <i class="high"     th:if="${high > 0}"     th:style="'width:' + ${high * 100.0 / total} + '%'"></i>
  <i class="medium"   th:if="${medium > 0}"   th:style="'width:' + ${medium * 100.0 / total} + '%'"></i>
  <i class="low"      th:if="${low > 0}"      th:style="'width:' + ${low * 100.0 / total} + '%'"></i>
</span>


</body>
</html>
