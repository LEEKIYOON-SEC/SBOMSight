<!doctype html>
<!--/*
  구역 카드 격자 — 시안의 `구역 현황`.

  **왜 별도 화면이 아닌가.** 구역만 보여 주는 화면을 따로 두면, 카드를 눌러도
  결국 자산 목록으로 튕긴다. 그러면 그 화면은 자산 목록으로 가는 중간 정거장일
  뿐이고, 기둥에 구역 목록을 두었던 것과 같은 문제가 된다.

  그래서 **카드 안에 그 구역의 자산이 그대로 들어 있다.** 여기서 자산 이름을
  바로 누른다. 자산 화면의 보기 전환(표 ↔ 구역)으로 두는 이유도 같다 —
  같은 것을 다르게 보는 것이지 다른 화면이 아니다.
*/-->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="cards(groups)" class="row row-cards zone-cards">
  <div class="col-md-6 col-xl-4" th:each="g : ${groups}">
  <div class="card h-100">

    <div class="card-header d-flex align-items-center gap-2">
      <i class="zrail" th:style="'background:' + (${#strings.isEmpty(g.zone.color)}
                                 ? '#6f7e8d' : ${g.zone.color})" style="height:17px"></i>
      <b th:text="${g.zone.name}">DMZ</b>
      <span class="faint num" th:text="${g.serverCount()} + '대'">0대</span>
      <span class="spacer"></span>
      <!--/* 실제 악용이 있으면 그것부터. 그다음이 "아직 안 봤다" 다 —
           탐지 0건과 검사 없음은 완전히 다른 이야기다. */-->
      <span class="tag kev" th:if="${g.kevCount() > 0}"
            th:text="'실제 악용 ' + ${g.kevCount()}">실제 악용 0</span>
      <span class="tag nofix" th:if="${g.unscannedCount() > 0}"
            th:text="'검사 없음 ' + ${g.unscannedCount()}">검사 없음 0</span>
    </div>

    <!--/* 큰 수치 하나. 먼저 볼 것은 '심각 + 높음' 이다. */-->
    <div class="card-body pb-2">
      <div class="d-flex align-items-baseline gap-2 mb-2">
        <span class="h1 mb-0" th:text="${g.severityCount('critical') + g.severityCount('high')}">0</span>
        <span class="text-secondary">심각 · 높음</span>
      </div>

    <div th:if="${g.findingCount() > 0}">
      <span th:replace="~{fragments/ui :: sevbar(${g.severityCount('critical')},
                         ${g.severityCount('high')}, ${g.severityCount('medium')},
                         ${g.severityCount('low')})}"></span>
    </div>

    <!--/* 표 보기의 구역 머리줄과 같은 말·같은 색을 쓴다. 같은 것을 두
         화면에서 다르게 부르면 눈이 다시 자리를 찾아야 한다. */-->
    <div class="mt-2 d-flex flex-wrap" th:if="${g.findingCount() > 0}">
      <span class="pcount critical" th:if="${g.severityCount('critical') > 0}">
        <i class="mark critical"></i>심각 <span><b th:text="${g.severityCount('critical')}">0</b>건</span></span>
      <span class="pcount high" th:if="${g.severityCount('high') > 0}">
        <i class="mark high"></i>높음 <span><b th:text="${g.severityCount('high')}">0</b>건</span></span>
      <span class="pcount" th:if="${g.severityCount('medium') > 0}">
        <i class="mark medium"></i>보통 <span><b th:text="${g.severityCount('medium')}">0</b>건</span></span>
      <span class="pcount" th:if="${g.severityCount('low') > 0}">
        <i class="mark low"></i>낮음 <span><b th:text="${g.severityCount('low')}">0</b>건</span></span>
    </div>

    </div>

    <!--/* 카드의 요점. 자산이 여기 있으니 눌러서 다른 화면으로 튕기지 않는다. */-->
    <div class="list-group list-group-flush" th:unless="${g.isEmpty()}">
      <a class="list-group-item list-group-item-action d-flex align-items-center gap-2"
         th:each="row : ${g.rows}" th:href="@{'/assets/' + ${row.asset.id}}">
        <b th:text="${row.asset.name}">web-01</b>
        <span class="faint" th:unless="${row.hasScan()}">검사 없음</span>
        <span class="spacer"></span>
        <span class="num" th:if="${row.hasScan()}"
              th:text="${#numbers.formatInteger(row.latest.findingCount, 0, 'COMMA')}">0</span>
        <span class="num faint" th:unless="${row.hasScan()}">—</span>
      </a>
    </div>
    <div class="list-group list-group-flush" th:if="${g.isEmpty()}">
      <span class="list-group-item faint">이 구역에는 아직 자산이 없습니다.</span>
    </div>

    <div class="card-footer d-flex align-items-center gap-2 py-2">
      <span th:if="${g.oldestScan() != null}"
            th:text="'가장 오래된 검사 ' + ${#temporals.format(g.oldestScan(), 'yyyy-MM-dd')}">—</span>
      <span th:if="${g.oldestScan() == null}">검사 기록 없음</span>
      <span class="spacer"></span>
      <a th:unless="${g.isEmpty()}" th:href="@{/reports/zone(zone=${g.zone.id})}">보고서</a>
    </div>
  </div>
  </div>
</div>

</body>
</html>
