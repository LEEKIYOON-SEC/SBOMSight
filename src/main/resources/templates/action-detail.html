<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page(~{::main}, 'actions', ${remediation.packageName})}">
<body>
<main>

  <!--/*
    머리는 조각으로 그린다 (§5-12): 상위 라벨 → 제목 → 부제.

    이 화면만 `<div class="page-head">` 를 직접 쓰면서 자산 이름과 패키지
    이름을 한 `<h1>` 에 넣어 두었다. **제목은 이 화면이 무엇에 대한
    것인가**이고, 그것은 패키지다. 자산은 어디에 걸린 것인지를 말하는
    상위 라벨이라 위로 올린다.
  */-->
  <div th:replace="~{fragments/ui :: pagehead(${remediation.packageName}, null, ~{}, ~{::where})}"></div>
  <th:block th:remove="all">
    <div th:fragment="where">
      <a th:href="@{/actions}">대응</a>
      <span class="faint"> · </span>
      <a th:href="@{'/assets/' + ${remediation.asset.id}}"
         th:text="${remediation.asset.name}">web-01</a>
    </div>
  </th:block>

  <div class="page-body">
    <div class="container-xl">

  <!--/* 최신 검사에서 이 패키지가 아직 몇 건인가. **상태를 자동으로 바꾸지는
       않는다** — 검사 대상이 바뀌어 사라진 것인지 정말 올린 것인지는
       도구가 판단할 수 없다. 숫자만 보여 주고 판단은 담당자가 한다. */-->
  <div class="card" th:if="${latest != null}">
    <div class="card-body">
    <span th:if="${remaining == 0}" class="alert alert-success" style="margin:0;display:block">
      최신 검사(<span th:text="${#temporals.format(latest.createdAt, 'yyyy-MM-dd')}">—</span>)에서
      이 패키지 탐지 <b>0건</b> — 확인 후 완료로 넘기세요.
    </span>
    <span th:if="${remaining > 0}" class="muted">
      최신 검사(<span th:text="${#temporals.format(latest.createdAt, 'yyyy-MM-dd')}">—</span>)에서
      이 패키지 탐지 <b th:text="${remaining} + '건'">0건</b>.
    </span>
    <!--/*
      **완료로 닫았는데 해소 건수가 남았으면 보고서와 같은 말로 적는다.** 위의
      `탐지` 는 해당 없음 · 오탐까지 센 수이고, 이 줄의 `해소 건수` 는 보고서
      3 · 5장의 축(수정 버전 있음 · 해당 없음 · 오탐 제외)이다 — 둘을 섞지 않는다.
    */-->
    <div class="danger-text" th:if="${doneRemaining.containsKey(remediation.id)}"
         th:text="'완료 · 탐지 남음 — 해소 건수 ' + ${doneRemaining.get(remediation.id)} + '건'">완료 · 탐지 남음</div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
    <form method="post" th:action="@{'/actions/' + ${remediation.id}}"
          sec:authorize="hasRole('ADMIN')">
      <div class="d-flex align-items-end gap-2 flex-wrap">
        <label class="form-label">조치 상태
          <select class="form-select" name="status">
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label()}"
                    th:selected="${s == remediation.status}">대기</option>
          </select>
        </label>
        <label class="form-label">담당
          <input class="form-control" name="owner" th:value="${remediation.owner}" placeholder="이름 · 부서" autocomplete="off">
        </label>
        <label class="form-label">기한
          <input class="form-control" name="dueDate" type="date" th:value="${remediation.dueDate}">
        </label>
      </div>
      <label class="form-label">설명
        <input class="form-control" name="note" th:value="${remediation.note}" placeholder="조치 계획 · 제약 사항" autocomplete="off">
      </label>
      <label class="form-label">변경 사유
        <input class="form-control" name="comment" placeholder="예: 정기점검 창에서 적용 예정" autocomplete="off">
      </label>
      <button class="btn btn-dark" type="submit">저장</button>
    </form>

    <!--/*
      **잘못 등록한 것을 지우는 자리.** 보고서의 `조치 등록` 은 단추 한 번에
      확인 창도 없다 — 되돌릴 길이 없으면 잘못 누른 줄이 목록에 영영 남고,
      `미등록 15개` 가 `14개` 로 줄어 보고서의 수가 틀어진다.

      갱신 form **밖**에 둔다. 안에 두면 [저장] 옆에 [삭제] 가 서고, 저장하려다
      지우는 일이 생긴다.
    */-->
    <form method="post" th:action="@{'/actions/' + ${remediation.id} + '/delete'}"
          sec:authorize="hasRole('ADMIN')" style="margin-top:12px"
          data-confirm="이 조치를 지웁니다. 상태 변경 이력도 함께 사라집니다.\n되돌릴 수 없습니다.\n\n계속할까요?">
      <button type="submit" class="btn btn-sm btn-outline-danger">조치 삭제</button>
      <span class="faint ms-2">잘못 등록한 것을 지움 · 감사 로그에는 남음</span>
    </form>
    <!--/*
      **없앤 상태를 찾는 사람에게 어디로 가라고 말한다.** 앞서 상태에
      `하지 않고 닫음` 이 있었는데, 근거도 재검토일도 없이 아무나 눌러 닫을
      수 있어서 통제가 있는 것처럼 보이는 만큼 없느니만 못했다. 그 결정은
      검토 결과에 적는다 — 거기서는 재검토일을 반드시 받는다(V14).
    */-->
    <p class="footnote">
      ※ 안 고치기로 한 결정은 여기가 아니라 <b>취약점의 검토 결과</b>에.
      근거 · 재검토일 · 결재 문서 번호가 함께 남음.
    </p>
    <table class="table kv" sec:authorize="!hasRole('ADMIN')">
      <tr><th>조치 상태</th><td th:text="${doneRemaining.containsKey(remediation.id)} ? '완료 · 탐지 남음'
                                        : ${remediation.status.label()}">대기</td></tr>
      <tr><th>담당</th><td th:text="${#strings.isEmpty(remediation.owner)} ? '—' : ${remediation.owner}">—</td></tr>
      <tr><th>기한</th><td th:text="${remediation.dueDate != null} ? ${#temporals.format(remediation.dueDate, 'yyyy-MM-dd')} : '—'">—</td></tr>
      <tr><th>설명</th><td th:text="${#strings.isEmpty(remediation.note)} ? '—' : ${remediation.note}">—</td></tr>
    </table>
    </div>
  </div>

  <h2>대상</h2>
  <div class="card">
    <div class="card-body">
    <table class="table kv">
      <tr><th>패키지</th><td th:text="${remediation.packageName}">openssl</td></tr>
      <tr><th>현재 → 목표</th>
          <td class="mono"><th:block th:replace="~{fragments/ui :: curversions(${remediation.fromVersions}, '—')}"></th:block> →
              <th:block th:replace="~{fragments/ui :: fixversions(${remediation.toVersions}, '확인 필요')}"></th:block></td></tr>
      <tr><th>등록 당시 건수</th><td th:text="${remediation.openedCount} + '건'">0건</td></tr>
      <tr><th>등록</th>
          <td th:text="${#temporals.format(remediation.createdAt, 'yyyy-MM-dd HH:mm')} + ' · ' + ${remediation.createdBy}">—</td></tr>
    </table>
    </div>
  </div>

  <h2>이력</h2>
  <div class="card">
    <table class="table table-vcenter card-table">
      <!--/*
        '처리' 라는 열 이름 아래에 계정이 들어 있었다. 이름과 내용이 달랐다 —
        무엇을 처리했는지 적힌 줄 알고 보면 사람 이름이 있다.
      */-->
      <thead><tr><th class="tight">시각</th><th class="tight">변경</th>
                 <th class="tight">계정</th><th>변경 사유</th></tr></thead>
      <tbody>
      <tr th:each="e : ${remediation.events}">
        <td class="tight" th:text="${#temporals.format(e.at, 'yyyy-MM-dd HH:mm')}">—</td>
        <!--/* 등록 줄은 앞뒤가 같다(대기 → 대기). 바뀐 것이 없으니 지금 상태만 적는다. */-->
        <td class="tight" th:text="${e.fromLabel == e.toLabel} ? ${e.toLabel}
                                   : ${e.fromLabel} + ' → ' + ${e.toLabel}">—</td>
        <td class="tight" th:text="${e.actor}">admin</td>
        <td class="faint" th:text="${#strings.isEmpty(e.comment)} ? '—' : ${e.comment}">—</td>
      </tr>
      </tbody>
    </table>
  </div>
  </div>
    </div>

</main>
</body>
</html>
