<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page(~{::main}, 'vulns', '취약점')}">
<body>
<main>

  <div th:replace="~{fragments/ui :: pagehead('취약점', ${scope.label()}, ~{::actions}, ~{})}"></div>
  <!--/*
    버튼 묶음은 페이지 머리로 들어간다. **정의한 자리에서는 그리지 않는다** —
    `th:remove="tag"` 는 감싼 태그만 없애고 그 안의 단추는 문서에 그대로
    남긴다. 그래서 같은 단추가 머리에 한 번, 그 아래에 또 한 번 찍혀 있었다
    (모든 화면에서). 바깥을 `th:remove="all"` 로 통째로 지운다 —
    `~{::actions}` 는 템플릿을 다시 훑어 조각을 찾으므로 영향을 받지 않는다.
  */-->
  <th:block th:remove="all">
    <div th:fragment="actions">
      <a class="btn" th:href="@{${links.csv()}}">CSV 내려받기</a>
    </div>
  </th:block>

  <!--/*
    범위와 묶기.

    앞서는 `전사 조회`(검색어 필수)와 `/scans/{id}`(검사 하나)가 따로 있었고,
    둘 다 같은 질의를 불렀다. 그래서 "우리 전체에 심각이 몇 건인가" 를 물을
    자리가 없었다. 범위를 고르는 한 화면으로 합친다.
  */-->
  <div class="page-body">
    <div class="container-xl">
    <div class="card">
  <form method="get" class="card-body border-bottom py-2 d-flex flex-wrap align-items-center gap-2">
    <input type="hidden" name="scan" th:if="${selectedScan != null}" th:value="${selectedScan}">

    <!--/*
      라벨은 고르개를 **감싸지 않는다.** `form-label` 은 블록이라 감싸면 글자
      아래로 고르개가 내려가고, 그 한 칸만 두 줄이 되어 옆의 묶기 단추·검색
      칸과 밑선이 어긋난다. 나란히 두고 `for` 로 묶는다.
    */-->
    <label class="form-label mb-0" for="zone-filter">범위</label>
    <select class="form-select form-select-sm w-auto" id="zone-filter" name="zone"
            onchange="this.form.submit()" th:disabled="${selectedScan != null}">
      <option value="">전체</option>
      <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.name}"
              th:selected="${selectedZone != null and selectedZone == z.id}">DMZ</option>
    </select>

    <span class="btn-group">
      <a class="btn btn-sm" th:href="@{${links.group('item')}}"
         th:classappend="${group} == 'item' ? 'active' : ''">항목별</a>
      <a class="btn btn-sm" th:href="@{${links.group('cve')}}"
         th:classappend="${group} == 'cve' ? 'active' : ''">CVE별</a>
      <a class="btn btn-sm" th:href="@{${links.group('package')}}"
         th:classappend="${group} == 'package' ? 'active' : ''">패키지별</a>
    </span>

    <input type="hidden" name="group" th:value="${group}">

    <input class="form-control form-control-sm" type="search" name="q" th:value="${q}"
           style="flex:1; min-width:14rem" autocomplete="off"
           aria-label="CVE 번호 · 패키지 이름" placeholder="CVE 번호 · 패키지 이름">
    <select class="form-select form-select-sm w-auto" name="severity" aria-label="심각도">
      <option value="">심각도 전체</option>
      <option value="Critical" th:selected="${severity} == 'Critical'">심각</option>
      <option value="High" th:selected="${severity} == 'High'">높음</option>
      <option value="Medium" th:selected="${severity} == 'Medium'">보통</option>
      <option value="Low" th:selected="${severity} == 'Low'">낮음</option>
    </select>
    <!--/* 표의 칸 순서와 같게 둔다 — 실제 악용이 수정 버전보다 앞이다. */-->
    <select class="form-select form-select-sm w-auto" name="kev" aria-label="실제 악용">
      <option value="">실제 악용 전체</option>
      <option value="true" th:selected="${kev != null and kev}">확인됨</option>
    </select>
    <select class="form-select form-select-sm w-auto" name="fixable" aria-label="수정 버전">
      <option value="">수정 버전 전체</option>
      <option value="true" th:selected="${fixable != null and fixable}">있음</option>
      <option value="false" th:selected="${fixable != null and !fixable}">없음</option>
    </select>
    <button class="btn btn-sm btn-dark" type="submit">찾기</button>
  </form>

  <div>

    <!--/* ══ 항목별 ═══════════════════════════════════════════════════ */-->
    <th:block th:if="${group} == 'item'">
      <th:block th:if="${page.totalElements == 0}">
        <div th:replace="~{fragments/ui :: empty('조건에 맞는 취약점이 없습니다', null,
                          ${links.clear()}, '필터 지우기')}"></div>
      </th:block>

      <!--/*
        정렬 단추 묶음(`심각도 CVSS 악용확률 패키지 CVE`)을 뗐다. 방향이
        없어서 낮은 것부터는 볼 수 없었고, 같은 일을 하는 자리가 표 머리와
        단추 묶음 두 곳이 되었다. **표 머리를 누른다** — 자산 목록이 이미
        그렇게 돌고, 한 번 더 누르면 방향이 뒤집힌다.
      */-->
      <th:block th:if="${page.totalElements > 0}">
        <div th:replace="~{fragments/ui :: countline(${page}, ${links}, '건')}"></div>

        <div th:replace="~{fragments/finding-table :: items(${page.content},
                          ${selectedScan == null}, ${analyses}, ${actions},
                          ${links}, ${sort}, ${dir})}"></div>

        <div th:replace="~{fragments/ui :: pager(${page}, ${links})}"></div>
      </th:block>
    </th:block>

    <!--/*
      ══ CVE별 ════════════════════════════════════════════════════════
      "이 취약점이 몇 대에 있나". 긴급 상황에서 가장 먼저 묻는 것이고,
      항목별 목록은 같은 CVE 가 자산 수만큼 반복되어 그 답을 세기 어렵다.
    */-->
    <th:block th:if="${group} == 'cve'">
      <th:block th:if="${cvePage.totalElements == 0}">
        <div th:replace="~{fragments/ui :: empty('조건에 맞는 취약점이 없습니다', null,
                          ${links.clear()}, '필터 지우기')}"></div>
      </th:block>
      <th:block th:if="${cvePage.totalElements > 0}">
        <!--/*
          건수 줄·쪽 넘김은 항목별과 **같은 조각**이다. 앞서는 이 표에만
          둘 다 없어서, 취약점이 3천 가지면 3천 줄이 한 쪽에 쏟아졌다.
          `n 가지 취약점` 이라고 적던 자리를 조각이 대신한다 — 세는 단위는
          표 머리가 말한다.
        */-->
        <div th:replace="~{fragments/ui :: countline(${cvePage}, ${links}, '가지')}"></div>
        <div class="table-responsive">
          <table class="table table-vcenter card-table">
            <thead><tr>
              <th class="tight">취약점</th><th class="tight">심각도</th>
              <th class="num tight">CVSS</th><th class="num tight">악용 확률</th>
              <th class="num tight">영향 자산</th><th class="num tight">탐지</th>
              <th class="tight">패키지</th><th class="tight">수정 버전</th>
              <!--/*
                **한 줄에 검토 결과 하나를 붙일 수 없다.** 검토 결과는
                `(자산, CVE, 패키지)` 하나에 하나씩 붙는데 이 줄은 자산
                여러 대·패키지 여러 개를 묶은 줄이다. 그래서 붙이는 대신
                <b>몇 건 중 몇 건인지 센다.</b> 적는 것은 항목별에서 건마다
                한다 — 그 줄만 걸러 보내는 링크를 함께 둔다.
              */-->
              <th class="tight">검토</th>
            </tr></thead>
            <tbody>
            <tr th:each="g : ${cvePage.content}">
              <td class="tight mono"><a th:href="@{'/vulns/' + ${g.cve}}" th:text="${g.cve}">CVE-0000-0000</a></td>
              <td class="tight">
                <span class="sev" th:classappend="${#strings.toLowerCase(g.severity)}"><i></i>
                  <span th:switch="${#strings.toLowerCase(g.severity)}">
                    <th:block th:case="'critical'">심각</th:block>
                    <th:block th:case="'high'">높음</th:block>
                    <th:block th:case="'medium'">보통</th:block>
                    <th:block th:case="'low'">낮음</th:block>
                    <th:block th:case="*" th:text="${#strings.isEmpty(g.severity)} ? '미확인' : ${g.severity}">미확인</th:block>
                  </span></span>
                <span th:if="${g.kevCount > 0}" class="tag kev">실제 악용</span>
              </td>
              <td class="num tight" th:text="${g.maxCvss != null} ? ${g.maxCvss} : '—'">—</td>
              <td class="num tight"
                  th:text="${g.maxEpss != null} ? ${#numbers.formatDecimal(g.maxEpss * 100, 1, 2)} + '%' : '—'">—</td>
              <td class="num tight"><b th:text="${g.assetCount}">0</b>대</td>
              <td class="num tight" th:text="${g.total}">0</td>
              <td class="tight">
                <span th:text="${g.anyPackage}">openssl</span>
                <span class="faint" th:if="${g.packageCount > 1}"
                      th:text="'외 ' + ${g.packageCount - 1}">외 0</span>
              </td>
              <td class="tight">
                <span class="tag fix" th:if="${g.fixable == g.total}">전부 있음</span>
                <span class="tag nofix" th:if="${g.fixable == 0}">없음</span>
                <span class="faint" th:if="${g.fixable > 0 and g.fixable < g.total}"
                      th:text="${g.fixable} + ' / ' + ${g.total}">0 / 0</span>
              </td>
              <td class="tight" th:with="r=${reviewed.get(g.cve)}">
                <div th:replace="~{fragments/ui :: reviewmark(${r})}"></div>
                <!--/* 진행과 링크를 한 줄에 두면 `미검토 항목별로 보기` 가 한
                     구절로 읽힌다. 아래 줄로 내린다 — 패키지 칸의 유형·경로와
                     같은 꼴이다. */-->
                <div><a class="faint" style="font-size:12px"
                   th:href="@{${links.copy().with('group','item').with('q', g.cve).here()}}"
                   sec:authorize="hasRole('ADMIN')">항목별로 보기</a></div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
        <div th:replace="~{fragments/ui :: pager(${cvePage}, ${links})}"></div>
      </th:block>
    </th:block>

    <!--/*
      ══ 패키지별 ═════════════════════════════════════════════════════
      실무자가 실제로 실행하는 단위는 패키지 업데이트다. "무엇을 올리면
      몇 건이 사라지나" 에 답한다.
    */-->
    <th:block th:if="${group} == 'package'">
      <th:block th:if="${packagePage.totalElements == 0}">
        <div th:replace="~{fragments/ui :: empty('조건에 맞는 취약점이 없습니다', null,
                          ${links.clear()}, '필터 지우기')}"></div>
      </th:block>
      <th:block th:if="${packagePage.totalElements > 0}">
        <div th:replace="~{fragments/ui :: countline(${packagePage}, ${links}, '개')}"></div>
        <div class="table-responsive">
          <table class="table table-vcenter card-table">
            <thead><tr>
              <th class="tight">패키지</th><th class="tight">유형</th>
              <th class="num tight">영향 자산</th><th class="num tight">탐지</th>
              <th class="num tight">해소 가능</th><th class="tight">최고 심각도</th>
              <th class="tight">목표 버전</th>
              <!--/* CVE별과 같은 이유로 세기만 한다 — 위 주석. */-->
              <th class="tight">검토</th>
            </tr></thead>
            <tbody>
            <tr th:each="g : ${packagePage.content}">
              <td class="tight"><b th:text="${g.packageName}">openssl</b></td>
              <td class="tight faint" th:text="${g.packageType}">rpm</td>
              <td class="num tight"><b th:text="${g.assetCount}">0</b>대</td>
              <td class="num tight" th:text="${g.total}">0</td>
              <td class="num tight">
                <b th:if="${g.fixable > 0}" th:text="${g.fixable}">0</b>
                <span class="faint" th:if="${g.fixable == 0}">—</span>
              </td>
              <td class="tight">
                <span class="sev critical" th:if="${g.criticalCount > 0}"><i></i>심각</span>
                <span class="sev high" th:if="${g.criticalCount == 0 and g.highCount > 0}"><i></i>높음</span>
                <span class="faint" th:if="${g.criticalCount == 0 and g.highCount == 0}">—</span>
                <span th:if="${g.kevCount > 0}" class="tag kev">실제 악용</span>
              </td>
              <!--/*
                설치된 판이 자산마다 다르면 목표 버전을 단정하지 않는다.
                하나로 적으면 그 버전으로 올려도 안 되는 자산이 생긴다.
              */-->
              <td class="tight mono">
                <span th:if="${g.versionCount == 1}" th:text="${g.anyVersion}">3.0.7</span>
                <span class="faint" th:if="${g.versionCount != 1}"
                      th:text="'설치 판 ' + ${g.versionCount} + '가지'">설치 판 2가지</span>
              </td>
              <td class="tight" th:with="r=${reviewed.get(g.packageName)}">
                <div th:replace="~{fragments/ui :: reviewmark(${r})}"></div>
                <div><a class="faint" style="font-size:12px"
                   th:href="@{${links.copy().with('group','item').with('q', g.packageName).here()}}"
                   sec:authorize="hasRole('ADMIN')">항목별로 보기</a></div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
        <div th:replace="~{fragments/ui :: pager(${packagePage}, ${links})}"></div>
      </th:block>
    </th:block>
  </div>
    </div>
    </div>
  </div>

  <!--/*
    검토 결과를 적는 칸. 조각 하나를 자산 상세의 취약점 탭과 나눠 쓴다 —
    화면마다 베껴 두면 한쪽만 고치는 날이 오고, 실제로 그렇게 해서 이미
    없앤 말이 되살아난 적이 있다.
  */-->
  <div th:replace="~{fragments/analysis-dialog :: dialog(${links.here()})}"></div>

</main>
</body>
</html>
