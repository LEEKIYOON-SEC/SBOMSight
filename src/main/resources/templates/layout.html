<!doctype html>
<!--/*
  공통 껍데기. 각 화면은 이 조각을 부르고 자기 내용만 넘긴다.

      <html th:replace="~{layout :: page(~{::main}, 'assets', '자산')}">

  레이아웃 전용 라이브러리를 더하지 않고 타임리프 기본 기능만 쓴다 — 의존성
  하나가 늘면 폐쇄망에 반입할 것이 하나 더 는다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(content, active, title)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' — SBOMSight'">SBOMSight</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a href="/">SBOMSight</a>
    <small>SBOM 기반 취약점 대응 검토</small>
  </div>
  <div class="spacer"></div>
  <!-- 초기 비밀번호에 붙잡혀 있으면 메뉴를 감춘다. 어차피 눌러도 비밀번호
       화면으로 되돌아온다 — 되돌아오는 링크를 보여 주면 고장으로 읽힌다. -->
  <nav sec:authorize="isAuthenticated()" th:unless="${passwordLocked}">
    <a href="/" th:classappend="${active} == 'assets' ? 'current' : ''">자산</a>
    <a href="/lookup" th:classappend="${active} == 'lookup' ? 'current' : ''">전사 조회</a>
    <a href="/report/zone" th:classappend="${active} == 'zonereport' ? 'current' : ''">구역 보고서</a>
    <a href="/remediations" th:classappend="${active} == 'remediations' ? 'current' : ''">조치</a>
    <a href="/acceptances" th:classappend="${active} == 'acceptances' ? 'current' : ''">위험 수용</a>
    <a href="/audit" sec:authorize="hasRole('ADMIN')"
       th:classappend="${active} == 'audit' ? 'current' : ''">감사 로그</a>
    <a href="/settings" sec:authorize="hasRole('ADMIN')"
       th:classappend="${active} == 'settings' ? 'current' : ''">설정</a>
  </nav>
  <div class="whoami" sec:authorize="isAuthenticated()">
    <!-- 계정 이름이 곧 내 계정으로 가는 문이다. 앞서는 그냥 글자였고, 그래서
         비밀번호를 바꾸려면 주소창에 /password 를 직접 쳐야 했다. -->
    <a class="who" href="/password" title="비밀번호 변경" sec:authentication="name">—</a>
    <span class="role admin" sec:authorize="hasRole('ADMIN')">관리자</span>
    <span class="role" sec:authorize="!hasRole('ADMIN')">조회</span>
    <!-- 로그아웃은 POST 다. GET 이면 링크를 미리 읽는 도구가 세션을 끊는다.
         CSRF 토큰은 타임리프가 폼에 자동으로 넣는다. -->
    <form th:action="@{/logout}" method="post" class="inline">
      <button type="submit" class="btn small">로그아웃</button>
    </form>
  </div>
</header>

<div class="page">
  <div th:if="${message}" class="banner ok" th:text="${message}"></div>
  <div th:if="${error}" class="banner danger" th:text="${error}"></div>
  <th:block th:replace="${content}"></th:block>
</div>

</body>
</html>
