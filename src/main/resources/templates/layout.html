<!doctype html>
<!--/*
  공통 껍데기. 각 화면은 이 조각을 부르고 자기 내용만 넘긴다.

      <html th:replace="~{layout :: page(~{::main}, 'assets', '자산')}">

  레이아웃 전용 라이브러리를 더하지 않고 타임리프 기본 기능만 쓴다 — 의존성
  하나가 늘면 폐쇄망에 반입할 것이 하나 더 는다.

  메뉴는 위가 아니라 왼쪽에 세운다. 위에 눕히면 항목이 늘 때마다 제목 줄과
  자리를 다투고, 구역 목록처럼 길이를 모르는 것은 아예 올릴 수가 없다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(content, active, title)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' — SBOMSight'">SBOMSight</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div class="shell">

  <!-- 초기 비밀번호에 붙잡혀 있으면 기둥을 통째로 감춘다. 어차피 눌러도
       비밀번호 화면으로 되돌아온다 — 되돌아오는 링크를 보여 주면 고장으로
       읽힌다. -->
  <aside class="side" sec:authorize="isAuthenticated()" th:unless="${passwordLocked}">
    <div class="brand"><a href="/">SBOMSight</a></div>

    <nav>
      <a href="/" th:classappend="${active} == 'assets' ? 'current' : ''">자산
        <span class="badge" th:text="${navAssetCount}">0</span></a>
      <a href="/lookup" th:classappend="${active} == 'lookup' ? 'current' : ''">전사 조회</a>
      <a href="/report/zone" th:classappend="${active} == 'zonereport' ? 'current' : ''">구역 보고서</a>
      <a href="/remediations" th:classappend="${active} == 'remediations' ? 'current' : ''">조치
        <!-- 기한이 지난 것이 있으면 그 수를 붉게. 화면을 열기 전에 알아야 한다. -->
        <span class="badge" th:if="${navOverdue > 0}" th:classappend="'alert'"
              th:text="${navOverdue}">0</span>
        <span class="badge" th:if="${navOverdue == 0 && navOpenRemediations > 0}"
              th:text="${navOpenRemediations}">0</span></a>
      <a href="/acceptances" th:classappend="${active} == 'acceptances' ? 'current' : ''">위험 수용
        <span class="badge alert" th:if="${navAcceptanceOverdue > 0}"
              th:text="${navAcceptanceOverdue}">0</span></a>
      <a href="/audit" sec:authorize="hasRole('ADMIN')"
         th:classappend="${active} == 'audit' ? 'current' : ''">감사 로그</a>
      <a href="/settings" sec:authorize="hasRole('ADMIN')"
         th:classappend="${active} == 'settings' ? 'current' : ''">설정</a>
    </nav>

    <div class="rule"></div>

    <div class="grouphead">
      <span>ZONE</span>
      <a href="/settings#zones" sec:authorize="hasRole('ADMIN')">관리</a>
    </div>
    <nav class="zonenav">
      <!-- 식을 여러 줄로 쓰면 타임리프가 못 읽는다. 컴파일에 걸리지 않고 그
           화면을 열 때 500 으로 터진다. -->
      <a th:each="z : ${navZones}" th:href="@{/(zone=${z.zone.id})}"
         th:classappend="${selectedZone != null and selectedZone == z.zone.id} ? 'current' : ''">
        <i class="zrail" th:style="'background:' + (${#strings.isEmpty(z.zone.color)}
                                   ? '#6f7e8d' : ${z.zone.color})"></i>
        <span th:text="${z.zone.name}">DMZ</span>
        <span class="badge" th:text="${z.assetCount}">0</span>
      </a>
    </nav>

    <div class="spacer"></div>

    <div class="me">
      <span class="avatar" th:text="${navInitials}">KL</span>
      <div class="who">
        <!-- 계정 이름이 곧 내 계정으로 가는 문이다. 앞서는 그냥 글자였고,
             그래서 비밀번호를 바꾸려면 주소창에 /password 를 직접 쳐야 했다. -->
        <a href="/password" title="비밀번호 변경" sec:authentication="name">—</a>
        <div class="role" sec:authorize="hasRole('ADMIN')">관리자</div>
        <div class="role" sec:authorize="!hasRole('ADMIN')">조회</div>
      </div>
      <!-- 로그아웃은 POST 다. GET 이면 링크를 미리 읽는 도구가 세션을 끊는다.
           CSRF 토큰은 타임리프가 폼에 자동으로 넣는다. -->
      <form th:action="@{/logout}" method="post" class="inline">
        <button type="submit" class="btn small">로그아웃</button>
      </form>
    </div>
  </aside>

  <div class="main">
    <div th:if="${message}" class="banner ok" th:text="${message}"></div>
    <div th:if="${error}" class="banner danger" th:text="${error}"></div>
    <th:block th:replace="${content}"></th:block>
  </div>
</div>

</body>
</html>
