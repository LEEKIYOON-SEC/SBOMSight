<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::main}, 'reports', '보고서')}">
<body>
<main>

  <!--/*
    보고서 고르기.

    앞서 기둥의 `보고서` 가 곧바로 구역 보고서로 갔다. 자산 한 대짜리
    보고서는 자산 상세까지 들어가야 있었고, 두 가지가 한 이름 아래 있다는
    것을 화면 어디에서도 알 수 없었다.

    여기는 **뽑는 자리**다. 보고서 자체는 /reports/scan/{scanId} 와
    /reports/zone 이 그린다.
  */-->
  <div th:replace="~{fragments/ui :: pagehead('보고서', null, ~{}, ~{})}"></div>

  <div class="page-body">
    <div class="container-xl">

  <h2>구역 · 기간</h2>
  <div class="card">
    <div class="card-body">
    <!--/*
      **라벨을 칸에서 떼어 낸다.** 감싸 두면 `form-label` 의 아래 여백(8px)이
      칸 바깥에 남아, 아래로 맞춘 줄에서 칸 셋만 단추보다 8px 떠 있었다 —
      재서 찾았다(`scripts/check-rows.py`). 다른 화면의 거르개 줄과 같은
      꼴로 나란히 두고 `for` 로 묶는다.
    */-->
    <form method="get" th:action="@{/reports/zone}" class="report-picker" style="margin:0;border:0;padding:0">
      <label class="form-label mb-0" for="report-zone">구역</label>
      <select class="form-select w-auto" id="report-zone" name="zone">
        <option value="">전체</option>
        <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.name}">DMZ</option>
      </select>
      <label class="form-label mb-0" for="report-from">시작</label>
      <input class="form-control w-auto" id="report-from" type="date" name="from" th:value="${thisMonth}">
      <label class="form-label mb-0" for="report-to">종료</label>
      <input class="form-control w-auto" id="report-to" type="date" name="to" th:value="${today}">
      <button class="btn btn-dark" type="submit">보고서 보기</button>
      <span class="spacer"></span>
      <a class="btn btn-sm" th:href="@{/reports/zone(from=${thisMonth}, to=${today})}">이번 달</a>
      <a class="btn btn-sm" th:href="@{/reports/zone(from=${lastMonthFrom}, to=${lastMonthTo})}">지난 달</a>
      <a class="btn btn-sm" th:href="@{/reports/zone(from=${quarterFrom}, to=${today})}">최근 3개월</a>
    </form>
    </div>
  </div>

  <h2>자산</h2>
  <th:block th:if="${latest.isEmpty() and neverScanned.isEmpty()}">
    <div th:replace="~{fragments/ui :: empty('뽑을 보고서가 없습니다',
                      '자산을 등록하고 그 자산에서 추출한 SBOM 을 업로드',
                      '/assets', '자산 보기')}"></div>
  </th:block>

  <div class="card" th:if="${rows.totalElements > 0}">
    <div th:replace="~{fragments/ui :: countline(${rows}, ${links}, '대')}"></div>
    <table class="table table-vcenter card-table">
      <thead>
      <tr>
        <th class="tight">자산</th>
        <th class="tight">구역</th>
        <th class="tight">기준이 된 검사</th>
        <th class="num tight">탐지</th>
        <th class="actions"></th>
      </tr>
      </thead>
      <tbody>
      <!--/*
        검사가 없는 자산도 줄을 차지한다. 목록에서 빠지면 "안 본 것" 과
        "문제가 없는 것" 을 구분할 수 없다 — 이 도구에서 반복해 지키는 것이다.

        **반복은 한 벌이다.** 앞서 검사된 것과 안 된 것이 각자 반복을 돌았다.
        쪽으로 나누려면 두 목록이 한 줄씩 번갈아 세어져야 한다.
      */-->
      <tr th:each="r : ${rows.content}" th:style="${r.scanned()} ? '' : 'opacity:.6'">
        <td class="tight">
          <a th:href="@{'/assets/' + ${r.asset.id}}" th:text="${r.asset.name}">web-01</a>
        </td>
        <td class="tight faint" th:text="${r.asset.zone.name}">DMZ</td>
        <th:block th:if="${r.scanned()}">
          <td class="tight"
              th:text="${#temporals.format(r.scan.createdAt, 'yyyy-MM-dd HH:mm')}">—</td>
          <td class="num tight"
              th:text="${#numbers.formatInteger(r.scan.findingCount, 0, 'COMMA')}">0</td>
        </th:block>
        <td class="tight faint" colspan="2" th:unless="${r.scanned()}">완료된 검사가 없습니다</td>
        <td class="actions">
          <a class="btn btn-sm" th:if="${r.scanned()}"
             th:href="@{'/reports/scan/' + ${r.scan.id}}">보고서</a>
          <!--/* `?tab=scans` 라는 탭은 없다(이력 탭의 이름은 `history`). 모르는
               이름이 오면 개요로 되돌아가는데, 업로드 칸이 개요에 있어 우연히
               맞아 보였을 뿐이다. 개요를 그대로 가리킨다. */-->
          <a class="btn btn-sm" th:unless="${r.scanned()}"
             th:href="@{'/assets/' + ${r.asset.id}}">SBOM 업로드</a>
        </td>
      </tr>
      </tbody>
    </table>
    <div th:replace="~{fragments/ui :: pager(${rows}, ${links})}"></div>
  </div>

  <p class="footnote">
    ※ 자산 보고서의 기준 — 그 자산의 <b>마지막 완료 검사</b>.
    다른 시점은 자산 상세 · 검사 이력에서.
  </p>

  </div>
    </div>

</main>
</body>
</html>
