<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page(~{::main}, 'assets', '자산')}">
<body>
<main>

  <div class="page-head">
    <h1>자산</h1>
    <span class="meta">
      <span th:text="${assetCount}">0</span>대 ·
      <span th:text="${groups.size()}">0</span>개 구역
      <th:block th:if="${selectedZone != null}"> · <a th:href="@{/}">전체 보기</a></th:block>
    </span>
    <span class="spacer"></span>
    <!-- 기한이 지난 조치는 목록보다 먼저 보여야 한다. 표 어딘가에 섞여
         있으면 지났다는 사실 자체를 못 보고 지나간다. -->
    <a th:if="${!overdue.isEmpty()}" href="/remediations" class="chip"
       style="border-color:var(--critical-line); background:var(--critical-bg); color:var(--critical); font-weight:600">
      <i class="mark critical"></i>
      <span th:text="'기한 경과 ' + ${overdue.size()}">기한 경과 0</span>
    </a>
    <a class="btn" th:href="@{/assets/import}" sec:authorize="hasRole('ADMIN')">일괄 등록</a>
    <button type="button" class="btn primary" id="open-add"
            sec:authorize="hasRole('ADMIN')">자산 등록</button>
  </div>

  <div class="body flush">

    <!-- 처음 켠 화면이다. 여기서만은 다음에 할 일을 한 줄 남긴다 — 빈 화면에
         버튼만 있으면 무엇부터인지 알 수 없다. -->
    <div class="empty" th:if="${assetCount == 0}">
      <b>등록된 자산이 없습니다</b>
      서버를 등록하고 그 서버의 SBOM 을 올립니다.
    </div>

    <!-- 구역이 몇이든 표는 하나다. 구역마다 표를 따로 그리면 칸 너비가
         제각각이 되어 세로로 눈이 내려가지 않는다 — 자산이 하나뿐인 구역의
         '탐지' 칸과 열 대짜리 구역의 '탐지' 칸이 다른 자리에 선다.
         비어 있는 구역도 줄을 남긴다. 없는 것처럼 보이면 "왜 안 보이지"
         부터 물어야 한다. -->
    <div class="table-scroll" th:unless="${assetCount == 0}">
      <table class="asset-table">
        <thead>
        <tr>
          <th class="tight">서버</th>
          <th class="tight">운영체제</th>
          <th class="tight">마지막 검사</th>
          <th class="num tight">탐지</th>
          <th class="tight">심각도</th>
          <th class="num tight">조치</th>
          <th>비고</th>
        </tr>
        </thead>

        <tbody th:each="g : ${groups}">
        <tr class="zone-row">
          <td colspan="7">
            <div class="zone-head">
              <i class="zrail" th:style="'background:' + (${#strings.isEmpty(g.zone.color)} ? '#6f7e8d' : ${g.zone.color})"></i>
              <b th:text="${g.zone.name}">DMZ</b>
              <span class="faint num" th:text="${g.serverCount()} + '대'">0대</span>
              <span class="spacer"></span>
              <th:block th:unless="${g.isEmpty()}">
                <span class="pcount" th:if="${g.severityCount('critical') > 0}">
                  <i class="mark critical"></i>심각
                  <b class="num" style="color:var(--critical)" th:text="${g.severityCount('critical')}">0</b></span>
                <span class="pcount" th:if="${g.severityCount('high') > 0}">
                  <i class="mark high"></i>높음
                  <b class="num" style="color:var(--high)" th:text="${g.severityCount('high')}">0</b></span>
                <span class="sep"></span>
                <span class="num faint">탐지
                  <b style="color:var(--fg)" th:text="${#numbers.formatInteger(g.findingCount(), 0, 'COMMA')}">0</b></span>
                <span class="num faint" th:if="${g.openRemediations() > 0}">조치
                  <b style="color:var(--fg)" th:text="${g.openRemediations()}">0</b></span>
                <a class="btn small" th:href="@{/report/zone(zone=${g.zone.id})}">보고서</a>
              </th:block>
            </div>
          </td>
        </tr>

        <tr th:if="${g.isEmpty()}">
          <td colspan="7" class="faint">이 구역에는 아직 자산이 없습니다.</td>
        </tr>

        <tr th:each="row : ${g.rows}">
          <td class="tight">
            <a th:href="@{'/assets/' + ${row.asset.id}}"
               style="font-weight:600" th:text="${row.asset.name}">web-01</a>
          </td>
          <td class="tight faint" th:text="${#strings.isEmpty(row.asset.osName)} ? '—' : ${row.asset.osName}">Rocky 9.3</td>

          <td class="tight mono faint" th:if="${row.hasScan()}"
              th:text="${#temporals.format(row.latest.createdAt, 'yyyy-MM-dd HH:mm')}">—</td>
          <td class="tight faint" th:unless="${row.hasScan()}">검사 없음</td>

          <td class="num tight" style="font-weight:600"
              th:text="${row.hasScan()} ? ${#numbers.formatInteger(row.latest.findingCount, 0, 'COMMA')} : '—'">—</td>

          <td class="tight">
            <th:block th:if="${row.hasScan()}">
              <span class="pcount" th:if="${row.severityCount('critical') > 0}">
                <i class="mark critical"></i>심각 <b th:text="${row.severityCount('critical')}">0</b></span>
              <span class="pcount" th:if="${row.severityCount('high') > 0}">
                <i class="mark high"></i>높음 <b th:text="${row.severityCount('high')}">0</b></span>
              <span class="pcount" th:if="${row.severityCount('medium') > 0}">
                <i class="mark medium"></i>보통 <b th:text="${row.severityCount('medium')}">0</b></span>
              <span class="pcount" th:if="${row.severityCount('low') > 0}">
                <i class="mark low"></i>낮음 <b th:text="${row.severityCount('low')}">0</b></span>
            </th:block>
            <span class="faint" th:unless="${row.hasScan()}">—</span>
          </td>

          <td class="num tight">
            <a th:if="${row.openRemediations > 0}" th:href="@{'/assets/' + ${row.asset.id}}"
               th:text="${row.openRemediations}">0</a>
            <span class="faint" th:unless="${row.openRemediations > 0}">—</span>
          </td>

          <td class="faint" th:text="${#strings.isEmpty(row.asset.note)} ? '—' : ${row.asset.note}">—</td>
        </tr>
        </tbody>
      </table>
    </div>

    <dialog id="add-dialog" sec:authorize="hasRole('ADMIN')">
      <form method="post" th:action="@{/assets}" th:object="${newAsset}">
        <h2>자산 등록</h2>
        <label>서버 이름
          <input th:field="*{name}" placeholder="web-01" required autocomplete="off">
        </label>
        <label>구역
          <select name="zoneId">
            <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.name}">DMZ</option>
          </select>
        </label>
        <label>운영체제
          <input th:field="*{osName}" placeholder="Rocky Linux 9.3" autocomplete="off">
        </label>
        <label>비고
          <input th:field="*{note}" placeholder="용도 · 담당 부서 등" autocomplete="off">
        </label>
        <div class="dialog-actions">
          <button type="button" class="btn" id="add-cancel">취소</button>
          <button type="submit" class="btn primary">등록</button>
        </div>
      </form>
    </dialog>

    <script>
      const dialog = document.querySelector('#add-dialog');
      const open = document.querySelector('#open-add');
      if (open && dialog) {
        open.addEventListener('click', () => dialog.showModal());
        document.querySelector('#add-cancel').addEventListener('click', () => dialog.close());
      }
    </script>
  </div>

</main>
</body>
</html>
