<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::main}, 'assets', '취약점')}">
<body>
<main>

  <div class="page-head">
    <h1>
      <a th:href="@{'/assets/' + ${scan.asset.id}}" th:text="${scan.asset.name}">web-01</a>
      <span class="faint" th:text="' · ' + ${#temporals.format(scan.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
    </h1>
    <a class="btn" th:href="@{'/report/' + ${scan.id}}">보고서</a>
  </div>

  <!-- 무엇으로 판정했는지. 이 줄이 없으면 몇 달 뒤 같은 SBOM 의 결과가 달라진
       이유를 설명할 수 없다. -->
  <div class="card">
    <span class="faint">
      grype <span th:text="${#strings.isEmpty(scan.grypeVersion)} ? '판 미상' : ${scan.grypeVersion}">—</span>
      · 취약점 DB
      <span th:text="${scan.grypeDbBuilt != null} ? ${#temporals.format(scan.grypeDbBuilt, 'yyyy-MM-dd')} + ' 기준' : '기준일 미상'">—</span>
      <th:block th:if="${!#strings.isEmpty(scan.distroName)}">
        · <span th:text="${scan.distroName} + ' ' + ${scan.distroVersion}">rocky 9.3</span>
      </th:block>
      · 컴포넌트 <span th:text="${#numbers.formatInteger(scan.componentCount, 0, 'COMMA')}">0</span>개
      · 탐지 <span th:text="${#numbers.formatInteger(scan.findingCount, 0, 'COMMA')}">0</span>건
      <th:block th:if="${scan.mergedCount > 0 || scan.droppedCount > 0}">
        (grype match <span th:text="${scan.matchCount}">0</span>건 중
        중복 <span th:text="${scan.mergedCount}">0</span> ·
        제외 <span th:text="${scan.droppedCount}">0</span>)
      </th:block>
    </span>
  </div>

  <form method="get" class="card inline-form">
    <label>심각도
      <select name="severity">
        <option value="">전체</option>
        <option value="Critical" th:selected="${severity == 'Critical'}">심각</option>
        <option value="High" th:selected="${severity == 'High'}">높음</option>
        <option value="Medium" th:selected="${severity == 'Medium'}">보통</option>
        <option value="Low" th:selected="${severity == 'Low'}">낮음</option>
      </select>
    </label>
    <label>수정본
      <select name="fixable">
        <option value="">전체</option>
        <option value="true" th:selected="${fixable != null && fixable}">있음</option>
        <option value="false" th:selected="${fixable != null && !fixable}">없음</option>
      </select>
    </label>
    <label>실제 악용(KEV)
      <select name="kev">
        <option value="">전체</option>
        <option value="true" th:selected="${kev != null && kev}">확인됨</option>
      </select>
    </label>
    <label>정렬
      <select name="sort">
        <option value="cvss" th:selected="${sort == 'cvss'}">CVSS 높은 순</option>
        <option value="epss" th:selected="${sort == 'epss'}">악용 확률 높은 순</option>
        <option value="package" th:selected="${sort == 'package'}">패키지 이름</option>
        <option value="cve" th:selected="${sort == 'cve'}">CVE 번호</option>
      </select>
    </label>
    <label>검색
      <input name="q" th:value="${q}" placeholder="패키지 · CVE" autocomplete="off">
    </label>
    <button class="btn" type="submit">적용</button>
  </form>

  <div class="card">
    <p class="muted" style="margin-top:0">
      <span th:text="${#numbers.formatInteger(page.totalElements, 0, 'COMMA')}">0</span>건 중
      <span th:text="${page.number * page.size + 1}">1</span>–<span
        th:text="${page.number * page.size + page.numberOfElements}">100</span>번째
    </p>

    <div class="table-scroll">
      <table>
        <thead>
        <tr>
          <th class="tight">CVE</th>
          <th class="tight">심각도</th>
          <th class="num tight">CVSS</th>
          <th class="num tight">악용 확률</th>
          <th class="tight">패키지</th>
          <th class="tight">설치 → 수정</th>
          <th>근거</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="f : ${page.content}">
          <td class="tight">
            <a th:href="${f.dataSource}" th:text="${f.cve}" target="_blank" rel="noreferrer"
               th:if="${!#strings.isEmpty(f.dataSource)}">CVE-0000-0000</a>
            <span th:if="${#strings.isEmpty(f.dataSource)}" th:text="${f.cve}">CVE-0000-0000</span>
          </td>
          <td class="tight">
            <i class="mark" th:classappend="${#strings.toLowerCase(f.severity)}"></i>
            <span th:switch="${#strings.toLowerCase(f.severity)}">
              <th:block th:case="'critical'">심각</th:block>
              <th:block th:case="'high'">높음</th:block>
              <th:block th:case="'medium'">보통</th:block>
              <th:block th:case="'low'">낮음</th:block>
              <th:block th:case="*" th:text="${#strings.isEmpty(f.severity)} ? '미확인' : ${f.severity}">미확인</th:block>
            </span>
          </td>
          <!-- 값이 없으면 0 이 아니라 — 로 둔다. 없는 것을 낮은 것으로 보이게
               하면 화면이 거짓말을 한다. -->
          <td class="num tight" th:text="${f.cvssScore != null} ? ${f.cvssScore} : '—'">—</td>
          <td class="num tight"
              th:text="${f.epss != null} ? ${#numbers.formatDecimal(f.epss * 100, 1, 2)} + '%' : '—'">—</td>
          <td class="tight">
            <span th:text="${f.packageName}">openssl</span>
            <span class="faint" th:text="${f.packageType}">rpm</span>
          </td>
          <td class="tight">
            <span th:text="${f.packageVersion}">1.0.0</span> →
            <b th:if="${f.fixAvailable}" th:text="${f.fixedVersion}">2.0.0</b>
            <span th:if="${f.noFix}" class="tag nofix">수정본 없음</span>
            <span th:if="${!f.fixAvailable && !f.noFix}" class="faint">확인 필요</span>
          </td>
          <td>
            <span th:if="${f.kev != null && f.kev}" class="tag kev">실제 악용 확인</span>
            <span th:if="${f.kevRansomware != null && f.kevRansomware}" class="tag kev">랜섬웨어</span>
            <span class="faint" th:text="${f.matchType}">exact-direct-match</span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="pager" th:if="${page.totalPages > 1}">
      <a th:if="${page.hasPrevious()}"
         th:href="@{'/scans/' + ${scan.id}(page=${page.number - 1}, severity=${severity},
                    fixable=${fixable}, kev=${kev}, q=${q}, sort=${sort})}">이전</a>
      <span th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>
      <a th:if="${page.hasNext()}"
         th:href="@{'/scans/' + ${scan.id}(page=${page.number + 1}, severity=${severity},
                    fixable=${fixable}, kev=${kev}, q=${q}, sort=${sort})}">다음</a>
    </div>
  </div>

</main>
</body>
</html>
