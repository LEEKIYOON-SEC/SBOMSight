<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page(~{::main}, 'actions', '대응')}">
<body>
<main>

  <!--/*
    대응 — 내린 결정을 모아 보는 자리.

    앞서는 `조치` 와 `위험 수용` 이 각각 따로 화면이었고 기둥에서도 갈라져
    있었다. 둘 다 "이 건을 어떻게 할 것인가" 에 대한 답인데 갈라 놓으니
    어느 쪽이 급한지 알려면 두 번 봐야 했다.

    **여기서 새로 만들지 않는다.** 조치도 검토 결과도 취약점 화면에서 건을
    보면서 적는다 — 목록만 보고 무엇을 조치할지 고를 수는 없다.

    다만 **이미 적어 둔 검토 결과를 조치로 올리는 것은 여기서 한다.** 검토와
    조치는 같은 일의 앞뒤인데, 앞서는 그 길이 없어서 보고서를 새로 만들어
    3장까지 내려가야 했다.
  */-->
  <div th:replace="~{fragments/ui :: pagehead('대응', null, ~{::actions}, ~{})}"></div>
  <!--/*
    버튼 묶음은 페이지 머리로 들어간다. **정의한 자리에서는 그리지 않는다** —
    `th:remove="tag"` 는 감싼 태그만 없애고 그 안의 단추는 문서에 그대로
    남긴다. 그래서 같은 단추가 머리에 한 번, 그 아래에 또 한 번 찍혀 있었다
    (모든 화면에서). 바깥을 `th:remove="all"` 로 통째로 지운다 —
    `~{::actions}` 는 템플릿을 다시 훑어 조각을 찾으므로 영향을 받지 않는다.
  */-->
  <th:block th:remove="all">
    <div th:fragment="actions">
      <a class="btn" th:href="@{${csv.here()}}">CSV 내려받기</a>
    </div>
  </th:block>

  <!--/*
    탭 줄도 **본문과 같은 칸 안**에 둔다. 감싸는 칸이 없어 화면 맨 왼쪽에
    붙어 있었고, 그 아래 카드보다 16px 왼쪽에서 시작했다 — 설정·감사 로그와
    같은 꼴로 맞춘다.
  */-->
  <div class="page-header d-print-none pt-0">
    <div class="container-xl">
      <ul class="nav nav-tabs">
        <li th:replace="~{fragments/ui :: tab('/actions', '조치',
                         ${remediationCount}, ${tab} != 'analyses')}"></li>
        <li th:replace="~{fragments/ui :: tab('/actions?tab=analyses', '검토 결과',
                         ${analysisCount}, ${tab} == 'analyses')}"></li>
      </ul>
    </div>
  </div>

  <div class="page-body">
    <div class="container-xl">
    <div class="card">
  <form method="get" class="card-body border-bottom py-2 d-flex flex-wrap align-items-center gap-2">
    <input type="hidden" name="tab" th:value="${tab}">
    <!--/* 라벨은 고르개를 감싸지 않는다 — 취약점·패키지 화면과 같은 꼴이다. */-->
    <label class="form-label mb-0" for="action-zone">구역</label>
    <select class="form-select form-select-sm w-auto" id="action-zone" name="zone"
            data-autosubmit>
      <option value="">전체</option>
      <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.name}"
              th:selected="${selectedZone != null && selectedZone == z.id}">DMZ</option>
    </select>

    <!--/* 조치 탭의 거르개 */-->
    <label class="form-label mb-0" for="action-status" th:if="${tab} != 'analyses'">상태</label>
    <select class="form-select form-select-sm w-auto" id="action-status" name="status"
            th:if="${tab} != 'analyses'" data-autosubmit>
      <option value="">전체</option>
      <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label()}"
              th:selected="${status != null && status == s}">대기</option>
    </select>

    <!--/*
      검토 결과 탭의 거르개는 이것 하나다. 앞서 `목록에서 감추기` 체크박스를
      두려 했는데 없앴다 — 사람이 켜고 끄게 두면 같은 상태인데 어떤 건은
      보이고 어떤 건은 안 보인다. 볼 일이 끝난 상태가 자동으로 빠진다.
    */-->
    <!--/*
      이것은 거르기가 아니라 **보기를 넓히는 것**이라 체크박스로 둔다(자산
      목록의 `운영 종료 자산 포함` 과 같은 자리). 글자는 `form-check-label`
      로 감싼다 — 맨 글자로 두면 Tabler 가 이름표로 보지 않는다.
    */-->
    <!--/* 탐지 목록과 같은 조각·같은 이름이다 — 빠지는 것이 같은 두 상태다.
         `th:replace` 는 같은 태그의 `th:if` 보다 먼저 돌아 조건을 지우므로
         감싸서 건다. */-->
    <th:block th:if="${tab} == 'analyses'">
      <div th:replace="~{fragments/ui :: reviewedout(${includeDone}, ${reviewedOut})}"></div>
    </th:block>

    <button class="btn btn-sm btn-dark" type="submit">적용</button>
  </form>

  <div>

    <!--/* ══ 조치 ══════════════════════════════════════════════════════ */-->
    <th:block th:if="${tab} != 'analyses'">
      <div th:if="${!overdue.isEmpty()}" class="alert alert-warning">
        <b th:text="'기한이 지난 조치 ' + ${overdue.size()} + '건'">기한 경과</b>
        <span th:each="r, i : ${overdue}" th:if="${i.index < 5}">
          <span th:text="${r.asset.name} + ' · ' + ${r.packageName}">web-01 · openssl</span><th:block
            th:if="${!i.last && i.index < 4}"> · </th:block>
        </span>
      </div>

      <th:block th:if="${remediations.totalElements == 0}">
        <div th:replace="~{fragments/ui :: empty('조치 내역이 없습니다',
                          '취약점 화면의 표에서 조치 칸의 [조치 등록]',
                          '/vulns', '취약점 보기')}"></div>
      </th:block>

      <div th:if="${remediations.totalElements > 0}"
           th:replace="~{fragments/ui :: countline(${remediations}, ${links}, '건')}"></div>
      <div class="table-responsive" th:if="${remediations.totalElements > 0}">
        <table class="table table-vcenter card-table">
          <thead>
          <tr>
            <th class="tight">자산</th><th class="tight">구역</th>
            <th class="tight">패키지</th><th>현재 → 목표</th>
            <th class="tight">조치 상태</th><th class="tight">담당</th>
            <th class="tight">기한</th><th class="num tight">등록 당시 건수</th>
            <th>설명</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="r : ${remediations.content}"
              th:style="${r.status.isClosed()} ? 'opacity:.6' : ''">
            <td class="tight"><a th:href="@{'/assets/' + ${r.asset.id}}"
                                 th:text="${r.asset.name}">web-01</a></td>
            <td class="tight faint">
              <i class="zrail" th:style="'background:' + (${#strings.isEmpty(r.asset.zone.color)}
                                         ? '#6f7e8d' : ${r.asset.zone.color})"></i>
              <span th:text="${r.asset.zone.name}">DMZ</span></td>
            <td class="tight"><a th:href="@{'/actions/' + ${r.id}}"
                                 th:text="${r.packageName}">openssl</a></td>
            <!--/* 목표를 하나로 고르지 않는다 — 보고서 3장과 같은 규칙(fixversions).
                 줄바꿈을 막지 않는다: 스물다섯 가지를 한 줄로 두면 표가 화면을 넘는다. */-->
            <td class="faint mono">
              <span class="ver" th:text="${r.fromVersion}">3.0.1</span> →
              <th:block th:replace="~{fragments/ui :: fixversions(${r.toVersions}, '—')}"></th:block>
            </td>
            <td class="tight" th:text="${r.status.label()}">대기</td>
            <td class="tight" th:text="${#strings.isEmpty(r.owner)} ? '—' : ${r.owner}">—</td>
            <td class="tight num" th:classappend="${r.overdue} ? 'overdue' : ''"
                th:text="${r.dueDate != null} ? ${#temporals.format(r.dueDate, 'yyyy-MM-dd')} : '—'">—</td>
            <td class="num tight" th:text="${r.openedCount}">0</td>
            <td class="faint" th:text="${#strings.isEmpty(r.note)} ? '—' : ${r.note}">—</td>
          </tr>
          </tbody>
        </table>
      </div>
      <div th:if="${remediations.totalElements > 0}"
           th:replace="~{fragments/ui :: pager(${remediations}, ${links})}"></div>
    </th:block>

    <!--/* ══ 검토 결과 ══════════════════════════════════════════════════ */-->
    <th:block th:if="${tab} == 'analyses'">
      <div th:if="${!overdue.isEmpty()}" class="alert alert-danger">
        <b th:text="'재검토일이 지난 것 ' + ${overdue.size()} + '건'">재검토 기한 경과</b>
        <span th:each="r, i : ${overdue}" th:if="${i.index < 5}">
          <span th:text="${r.asset.name} + ' · ' + ${r.packageName}">web-01 · openssl</span><th:block
            th:if="${!i.last && i.index < 4}"> · </th:block>
        </span>
      </div>

      <th:block th:if="${analyses.totalElements == 0}">
        <div th:replace="~{fragments/ui :: empty('검토 결과가 없습니다',
                          '취약점 화면에서 건을 골라 검토 상태와 대응 방안을 작성',
                          '/vulns', '취약점 보기')}"></div>
      </th:block>

      <div th:if="${analyses.totalElements > 0}"
           th:replace="~{fragments/ui :: countline(${analyses}, ${links}, '건')}"></div>
      <div class="table-responsive" th:if="${analyses.totalElements > 0}">
        <table class="table table-vcenter card-table">
          <thead>
          <tr>
            <th class="tight">자산</th><th class="tight">구역</th>
            <th class="tight">취약점</th><th class="tight">패키지</th>
            <th class="tight">검토 상태</th><th>대응 방안</th>
            <!--/* 한 칸에 두 가지를 넣지 않는다. 고르는 것(근거)과 적는 것(설명)은
                 다른 것이라 열을 가른다.

                 근거에는 `tight` 를 주지 않는다 — 아홉 가지 중 긴 것
                 ("취약한 코드가 들어 있지 않음")이 줄바꿈 없이 들어가면 표가
                 칸을 넘고, 넘은 만큼 오른쪽 칸이 잘린다. */-->
            <th>근거</th><th>설명</th>
            <th class="tight">기록한 사람</th><th class="tight">재검토일</th>
            <!--/*
              **검토와 조치는 같은 일의 앞뒤다.** 앞서는 여기서 조치로 넘어갈
              길이 없어서, 검토를 적어 놓고도 보고서를 새로 만들어 3장까지
              내려가야 조치를 열 수 있었다.

              조치는 `(자산, 패키지)` 하나에 하나이고 검토 결과는
              `(자산, CVE, 패키지)` 하나에 하나다 — 같은 패키지의 검토 세 건이
              <b>같은 조치 하나</b>를 가리킨다. 이미 열려 있으면 `조치 등록`
              대신 그 조치의 상태를 찍는다.
            */-->
            <th class="tight">조치</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="a : ${analyses.content}" th:style="${a.open} ? '' : 'opacity:.6'">
            <td class="tight"><a th:href="@{'/assets/' + ${a.asset.id}(tab='vulns')}"
                                 th:text="${a.asset.name}">web-01</a></td>
            <td class="tight faint">
              <i class="zrail" th:style="'background:' + (${#strings.isEmpty(a.asset.zone.color)}
                                         ? '#6f7e8d' : ${a.asset.zone.color})"></i>
              <span th:text="${a.asset.zone.name}">DMZ</span></td>
            <td class="tight mono"><a th:href="@{'/vulns/' + ${a.cve}}"
                                      th:text="${a.cve}">CVE-0000-0000</a></td>
            <td class="tight" th:text="${a.packageName}">openssl</td>

            <td class="tight">
              <span class="sev" th:classappend="${a.state.name() == 'EXPLOITABLE'} ? 'high'
                                : (${a.open} ? 'medium' : 'low')"><i></i>
                <span th:text="${a.state.label()}">해당됨</span></span>
            </td>
            <!--/* 대응 이름 중 긴 것("우회 조치 (패치 미적용)")이 줄바꿈 없이
                 들어가면 표가 칸을 넘는다. 여기도 `tight` 를 주지 않는다. */-->
            <td>
              <span th:if="${a.response != null}"
                    th:text="${a.response.label()}">위험 수용</span>
              <span class="faint" th:if="${a.response == null}">—</span>
            </td>
            <td class="faint">
              <span th:if="${a.justification != null}"
                    th:text="${a.justification.label()}">취약한 코드가 들어 있지 않음</span>
              <span th:if="${a.justification == null}">—</span>
            </td>
            <td>
              <div th:if="${!#strings.isEmpty(a.note)}" th:text="${a.note}">설명</div>
              <div class="faint" th:if="${!#strings.isEmpty(a.otherControl)}"
                   th:text="'추가 보안 통제: ' + ${a.otherControl}"></div>
            </td>

            <!--/* 시스템이 아는 것만 적는다 — 로그인 계정과 시각. 결재 문서
                 번호는 사람이 적는 칸이라 비어 있을 수 있다. */-->
            <td class="tight">
              <div th:text="${a.updatedBy}">admin</div>
              <div class="faint num"
                   th:text="${#temporals.format(a.updatedAt, 'yyyy-MM-dd')}">—</div>
              <div class="faint" th:if="${!#strings.isEmpty(a.approvalDoc)}"
                   th:text="'결재 ' + ${a.approvalDoc}">결재 보안-2026-0143</div>
            </td>
            <td class="tight num" th:classappend="${a.reviewOverdue} ? 'overdue' : ''">
              <span th:if="${a.reviewBy != null}"
                    th:text="${#temporals.format(a.reviewBy, 'yyyy-MM-dd')}">—</span>
              <span class="faint" th:if="${a.reviewBy == null}">—</span>
            </td>

            <td class="tight" th:with="r=${actions.get(a.asset.id + '|' + a.packageName)}">
              <a th:if="${r != null}" th:href="@{'/actions/' + ${r.id}}"
                 th:text="${r.status.label()}">대기</a>
              <form th:if="${r == null}" method="post" sec:authorize="hasRole('ADMIN')"
                    th:action="@{'/assets/' + ${a.asset.id} + '/remediations'}">
                <input type="hidden" name="packageName" th:value="${a.packageName}">
                <button type="submit" class="btn btn-sm">조치 등록</button>
              </form>
              <span class="faint" th:if="${r == null}" sec:authorize="!hasRole('ADMIN')">미등록</span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
      <div th:if="${analyses.totalElements > 0}"
           th:replace="~{fragments/ui :: pager(${analyses}, ${links})}"></div>
    </th:block>
  </div>
    </div>
    </div>
  </div>

</main>
</body>
</html>
