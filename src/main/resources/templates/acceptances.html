<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page(~{::main}, 'acceptances', '위험 수용')}">
<body>
<main>

  <div class="page-head">
    <h1>위험 수용</h1>
    <span class="faint num" th:text="${rows.size()} + '건'">0건</span>
  </div>

  <div class="body flush">

  <!-- 다시 볼 날이 지난 것은 목록보다 먼저 보여야 한다. 표 어딘가에
       섞여 있으면 지났다는 사실 자체를 못 보고 지나간다. -->
  <div th:if="${!overdue.isEmpty()}" class="banner danger">
    <b th:text="'다시 볼 날이 지난 수용 ' + ${overdue.size()} + '건'">재검토 기한 경과</b>
    <span th:each="r, i : ${overdue}" th:if="${i.index < 5}">
      <span th:text="${r.asset.name} + ' · ' + ${r.packageName}">web-01 · openssl</span><th:block
        th:if="${!i.last && i.index < 4}"> · </th:block>
    </span>
  </div>

  <form method="get" class="filters">
    <label>구역
      <select name="zone">
        <option value="">전체</option>
        <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.name}"
                th:selected="${selectedZone != null && selectedZone == z.id}">DMZ</option>
      </select>
    </label>
    <label>철회된 것
      <select name="includeRevoked">
        <option value="false" th:selected="${!includeRevoked}">감추기</option>
        <option value="true" th:selected="${includeRevoked}">함께 보기</option>
      </select>
    </label>
    <button class="btn" type="submit">적용</button>
  </form>

  <div class="empty" th:if="${rows.isEmpty()}">수용 기록이 없습니다.</div>

  <div class="table-scroll" th:unless="${rows.isEmpty()}">
      <table>
        <thead>
        <tr>
          <th class="tight">자산</th>
          <th class="tight">구역</th>
          <th class="tight">취약점</th>
          <th class="tight">패키지</th>
          <th>사유 · 대신하는 통제</th>
          <th class="tight">승인</th>
          <th class="tight">다시 볼 날</th>
          <th class="tight"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${rows}" th:style="${r.active} ? '' : 'opacity:.55'">
          <td class="tight"><a th:href="@{'/assets/' + ${r.asset.id}}" th:text="${r.asset.name}">web-01</a></td>
          <td class="tight faint" th:text="${r.asset.zone.name}">DMZ</td>
          <td class="tight mono" th:text="${r.cve}">CVE-0000-0000</td>
          <td class="tight" th:text="${r.packageName}">openssl</td>
          <td>
            <div th:text="${r.reason}">사유</div>
            <div class="faint" th:if="${!#strings.isEmpty(r.compensating)}"
                 th:text="'대신: ' + ${r.compensating}"></div>
            <div class="faint" th:unless="${r.active}"
                 th:text="'철회 ' + ${#temporals.format(r.revokedAt, 'yyyy-MM-dd')}
                          + (${#strings.isEmpty(r.revokeNote)} ? '' : ' — ' + ${r.revokeNote})"></div>
          </td>
          <td class="tight">
            <div th:text="${r.approvedBy}">홍길동</div>
            <div class="faint num" th:text="${#temporals.format(r.acceptedAt, 'yyyy-MM-dd')}">—</div>
          </td>
          <td class="tight num" th:classappend="${r.reviewOverdue} ? 'overdue' : ''"
              th:text="${#temporals.format(r.reviewBy, 'yyyy-MM-dd')}">—</td>
          <td class="tight">
            <form method="post" th:action="@{'/acceptances/' + ${r.id} + '/revoke'}" class="inline"
                  th:if="${r.active}" sec:authorize="hasRole('ADMIN')">
              <input name="note" placeholder="철회 사유" style="width:9rem;min-width:0">
              <button type="submit" class="btn small">철회</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
  </div>

</main>
</body>
</html>
