<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 — SBOMSight</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="gate">

<main class="gate-box">
  <div class="brand">SBOMSight</div>

  <div th:if="${notice}" th:classappend="'banner ' + ${noticeKind}"
       th:text="${notice}" class="banner" style="margin:0 0 18px"></div>

  <form method="post" th:action="@{/login}">
    <label>계정 이름
      <input name="username" required autofocus autocomplete="username">
    </label>
    <label>비밀번호
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <button class="btn primary" type="submit">로그인</button>
  </form>
</main>

</body>
</html>
