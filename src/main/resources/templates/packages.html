<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::main}, 'packages', '패키지')}">
<body>
<main>

  <!--/*
    패키지 — 무엇이 어디에 몇 버전으로 깔려 있나.

    취약점 화면은 grype 이 매치를 낸 것만 답한다. 그래서 log4j 가 어디 깔려
    있는지는 CVE 가 터진 다음에야 찾게 됐다. SBOM 에는 처음부터 전부 들어
    있었고, 이 화면이 그것을 답한다.

    **가장 중요한 신호는 일부 자산만 업그레이드한 패키지다** — 걸린 것이 있는
    버전과 없는 버전이 함께 깔려 있으면 "이미 올린 자산이 있는데 안 올린
    자산이 남았다" 는 뜻이다.
  */-->
  <!--/*
    머리의 수는 **표에 실린 줄 수와 어긋나지 않아야 한다.** 거르개 전 이름
    수만 찍으면 `일부 자산만 업그레이드` 를 켜서 한 줄만 남은 화면 머리에
    `6개` 가 적힌다. 어느 숫자가 맞는지 물어볼 자리가 없다.
  */-->
  <div th:replace="~{fragments/ui :: pagehead('패키지', ${listing.label()}, ~{::actions}, ~{})}"></div>
  <!--/*
    버튼 묶음은 페이지 머리로 들어간다. 정의한 자리에서는 그리지 않는다 —
    `th:remove="tag"` 는 감싼 태그만 없애고 안의 단추는 문서에 남긴다(§5-12).

    **내려받기는 보고 있던 거르개를 그대로 들고 간다.** 다른 것이 떨어지면
    어느 쪽이 맞는지 물어볼 자리가 없다.
  */-->
  <th:block th:remove="all">
    <div th:fragment="actions">
      <a class="btn" th:href="@{${csv.here()}}">CSV 내려받기</a>
    </div>
  </th:block>

  <div class="page-body">
    <div class="container-xl">
    <div class="card">
  <form method="get" class="card-body border-bottom py-2 d-flex flex-wrap align-items-center gap-2">
    <!--/*
      라벨은 고르개를 **감싸지 않는다.** `form-label` 은 블록이라 감싸면 글자
      아래로 고르개가 내려가고, 그 칸만 두 줄이 되어 옆 칸과 밑선이 어긋난다.
      나란히 두고 `for` 로 묶는다 — 취약점 화면과 같은 꼴이다.
    */-->
    <label class="form-label mb-0" for="pkg-zone">구역</label>
    <select class="form-select form-select-sm w-auto" id="pkg-zone" name="zone"
            data-autosubmit>
      <option value="">전체</option>
      <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.name}"
              th:selected="${selectedZone != null and selectedZone == z.id}">DMZ</option>
    </select>

    <input class="form-control form-control-sm" name="q" th:value="${q}"
           style="flex:1; min-width:12rem" autocomplete="off"
           placeholder="패키지 이름" aria-label="패키지 이름">

    <!--/*
      **거르는 것은 고르개로, 보기를 넓히는 것만 체크박스로.**

      앞서 두 거르개가 체크박스였다. 하는 일은
      취약점 화면의 `심각도 전체`·`수정 버전 전체` 와 같은 거르기인데 모양만
      달라서, 한 줄 안에 두 가지 조작이 섞여 있었다 — 고르개는 값을 고르고
      체크박스는 켜고 끈다. 고르개로 맞춘다.

      값이 없을 때 `전체` 를 그 칸의 이름과 함께 적는다(`취약점 전체`) —
      닫힌 고르개만 보고도 무엇을 거르는 칸인지 읽혀야 한다. 취약점 화면과
      같은 꼴이다. 줄여서 뜻이 흐려지면 줄이지 않는다(§4.0.4).
    */-->
    <select class="form-select form-select-sm w-auto" name="type" aria-label="패키지 유형"
            data-autosubmit>
      <option value="">유형 전체</option>
      <option th:each="t : ${listing.types()}" th:value="${t}" th:text="${t}"
              th:selected="${type != null and type == t}">rpm</option>
    </select>

    <select class="form-select form-select-sm w-auto" name="vulnerable" aria-label="취약점"
            data-autosubmit>
      <option value="">취약점 전체</option>
      <option value="true" th:selected="${vulnerable}">취약점 있는 것만</option>
    </select>

    <!--/*
      `버전이 갈린 것만` 이라고 불렀다. **무엇이 왜 갈렸는지 그 말이
      말해 주지 않는다** — 쓰는 사람이 무엇을 거르는 단추인지 몰랐다.

      실제로 거르는 것은 <b>걸린 것이 있는 버전과 없는 버전이 함께 깔려 있는
      패키지</b>다. 그 뜻은 하나다: **일부 자산은 올렸고 일부는 안 올렸다.**
      그래서 그렇게 부른다. 주소의 이름(`mixed`)은 그대로 둔다 — 적어 둔
      주소와 즐겨찾기가 죽지 않게.
    */-->
    <select class="form-select form-select-sm w-auto" name="mixed"
            aria-label="업그레이드 상태" data-autosubmit
            title="걸린 것이 있는 버전과 없는 버전이 함께 깔려 있는 패키지 — 일부 자산만 업그레이드한 상태">
      <option value="">업그레이드 상태 전체</option>
      <option value="true" th:selected="${mixed}">일부 자산만 업그레이드</option>
    </select>

    <button class="btn btn-sm btn-dark" type="submit">찾기</button>
  </form>

  <div>

    <!--/*
      **빈 것과 안 본 것을 구분해서 말한다.** V13 은 이미 쌓인 SBOM 을 되읽지
      않으므로 다시 검사하기 전에는 인벤토리가 비어 있다. 그 상태를 "패키지가
      없습니다" 라고 말하면 거짓이다.
    */-->
    <th:block th:if="${inventoryEmpty}">
      <div th:replace="~{fragments/ui :: empty('아직 담긴 패키지가 없습니다',
                        '검사할 때 SBOM 에서 담김 · 자산을 다시 검사하면 채워짐',
                        '/', '자산 보기')}"></div>
    </th:block>

    <th:block th:if="${!inventoryEmpty and listing.rows().totalElements == 0}">
      <div th:replace="~{fragments/ui :: empty('조건에 맞는 패키지가 없습니다', null,
                        '/packages', '전체 보기')}"></div>
    </th:block>

    <div class="card" th:if="${listing.rows().totalElements > 0}">
      <div th:replace="~{fragments/ui :: countline(${listing.rows()}, ${links}, '개')}"></div>
      <div class="table-responsive">
        <table class="table table-vcenter card-table">
          <thead>
          <tr>
            <th>패키지</th>
            <th class="tight">유형</th>
            <th class="num tight">자산</th>
            <th>버전 분포</th>
            <th class="num tight">취약점</th>
            <th class="tight"></th>
          </tr>
          </thead>
          <tbody>
          <th:block th:each="p : ${listing.rows().content}">
          <tr>
            <td>
              <b th:text="${p.name()}">openssl-libs</b>
              <!--/*
                이 줄에 표시를 따로 단다 — 색이 아니라 글자로 단다(§5-15).
                이것이 이 화면의 핵심 신호다: 걸린 것이 있는 버전과 없는
                버전이 함께 깔려 있다 = 일부 자산은 올렸고 일부는 안 올렸다.
              */-->
              <div th:if="${p.mixed()}">
                <span class="tag nofix"
                      title="걸린 것이 있는 버전과 없는 버전이 함께 깔려 있음 — 안 올린 자산이 남았다는 뜻">일부만 업그레이드</span>
              </div>
            </td>
            <td class="tight faint" th:text="${#strings.isEmpty(p.type())} ? '—' : ${p.type()}">rpm</td>
            <td class="num tight" th:text="${p.assetCount()} + '대'">7대</td>

            <!--/*
              버전 조각. 취약한 버전은 **채운 사각형 + 그 등급 색**, 걸린 것이
              없는 버전은 **속 빈 동그라미 + 회색**이다. 색만으로 가르지
              않으려고 모양도 다르게 둔다(§5-15). 올리면 등급별 건수가 뜬다.
            */-->
            <td>
              <span class="vslice" th:each="v : ${p.versions()}" th:title="${v.title()}">
                <i class="vmark"
                   th:classappend="${v.worst() != null} ? ${v.worst().key()} : 'none'"></i>
                <span class="mono" th:classappend="${v.worst() != null} ? 'sevtext' : ''"
                      th:attrappend="data-sev=${v.worst() != null} ? ${v.worst().key()} : ''"
                      th:text="${v.label()}">3.0.7-24</span>
                <span class="faint" th:text="${v.assetCount()} + '대'">5대</span>
              </span>
            </td>

            <td class="num tight"
                th:text="${p.findingCount() > 0}
                         ? ${#numbers.formatInteger(p.findingCount(), 0, 'COMMA')} : '—'">—</td>

            <td class="tight actions">
              <a class="btn btn-sm"
                 th:href="@{${links.change('open', open == p.name() ? null : p.name())}}"
                 th:text="${open == p.name()} ? '접기' : '자산 보기'">자산 보기</a>
              <a class="btn btn-sm" th:href="@{${vulnLinks.change('q', p.name())}}"
                 th:if="${p.findingCount() > 0}">취약점</a>
            </td>
          </tr>

          <!--/*
            펼친 줄. 어느 자산에 어느 버전이 깔려 있나 — 설치 경로까지.
            주소(`?open=`)에 남는다: 새로고침하면 접히는 화면은 공유할 수 없다.

            **누른 줄 바로 아래에 있어야 한다.** 앞서는 이 줄이 반복 바깥에
            있어서 표의 맨 끝에 붙었다 — 이름이 200개인 화면에서 가운데 줄을
            펼치면 답이 화면 밖에 나타났다.
          */-->
          <tr th:if="${open == p.name() and openRows != null and !openRows.isEmpty()}" class="zone-row">
            <td colspan="6">
              <div class="table-responsive">
                <table class="table table-vcenter card-table">
                  <thead>
                  <tr>
                    <th class="tight">자산</th><th class="tight">구역</th>
                    <th class="tight">버전</th><th>설치 경로</th>
                    <th class="tight">기준이 된 검사</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr th:each="c : ${openRows}">
                    <td class="tight">
                      <a th:href="@{'/assets/' + ${c.asset.id}(tab='packages')}"
                         th:text="${c.asset.name}">web-01</a></td>
                    <td class="tight faint">
                      <i class="zrail" th:style="'background:' + (${#strings.isEmpty(c.asset.zone.color)}
                                                 ? '#6f7e8d' : ${c.asset.zone.color})"></i>
                      <span th:text="${c.asset.zone.name}">DMZ</span></td>
                    <td class="tight mono" th:text="${c.versionOrDash()}">3.0.7-24</td>
                    <!--/* 비어 있는 것은 "경로가 없는 패키지" 가 아니라 SBOM 이
                         안 담은 것이다. 그렇게 말한다. */-->
                    <td class="mono faint"
                        th:text="${#strings.isEmpty(c.location)} ? 'SBOM 에 없음' : ${c.location}">/usr/…</td>
                    <td class="tight faint"
                        th:text="${#temporals.format(c.scan.createdAt, 'yyyy-MM-dd')}">—</td>
                  </tr>
                  </tbody>
                </table>
              </div>
            </td>
          </tr>
          </th:block>
          </tbody>
        </table>
      </div>
      <div th:replace="~{fragments/ui :: pager(${listing.rows()}, ${links})}"></div>
    </div>

    <!--/*
      **잘림 각주가 없어졌다.** 앞서는 앞 200개만 싣고 "이름 3,908개 중 앞
      200개만 화면에" 라고 적어 두었다. 각주는 잘렸다는 말은 했지만, 그때
      거르개(`취약점 있는 것만`)가 잘리기 **전** 전부를 보지 못한다는 말은
      하지 않았다 — 201번째 이후의 취약한 패키지는 수에도 안 들어갔다.
      이제 거른 뒤에 쪽으로 나눈다.
    */-->
    <!--/*
      **무엇을 세는지 적는다.** 이 화면과 자산의 패키지 탭, 취약점의
      패키지별은 셋 다 `패키지` 를 세는데 단위가 다르다 — 여기는 이름,
      자산 탭은 설치 줄, 취약점은 탐지가 난 이름이다. 셋 다 맞는 수인데
      무엇을 세는지 안 적으면 어느 쪽이 맞는지 물어볼 자리가 없고, 그러면
      세 수가 다 못 미덥게 된다.
    */-->
    <p class="footnote" th:if="${listing.rows().totalElements > 0}">
      ※ 세는 단위 — <b>패키지 이름</b> · 여러 버전·여러 자산이어도 한 줄.
    </p>
    <p class="footnote" th:if="${listing.rows().totalElements > 0}">
      ※ 깔린 것 전부 · 탐지 난 것만은
      <a th:href="@{/vulns(group='package')}">취약점의 패키지별</a>.
    </p>
    <p class="footnote" th:if="${listing.rows().totalElements > 0}">
      ※ 자산마다 <b>최신 검사</b>의 SBOM 기준. 표시 = 그 버전에 걸린 최고 등급
      (▮ 있음 · ○ 없음). 취약점 수는 검사 결과 그대로.
    </p>

  </div>
    </div>
    </div>
  </div>

</main>
</body>
</html>
