<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::main}, 'settings', '감사 로그')}">
<body>
<main>

  <div th:replace="~{fragments/ui :: pagehead('감사 로그', null, ~{::actions}, ~{})}"></div>
  <!--/*
    버튼 묶음은 페이지 머리로 들어간다. **정의한 자리에서는 그리지 않는다** —
    `th:remove="tag"` 는 감싼 태그만 없애고 그 안의 단추는 문서에 그대로
    남긴다. 그래서 같은 단추가 머리에 한 번, 그 아래에 또 한 번 찍혀 있었다
    (모든 화면에서). 바깥을 `th:remove="all"` 로 통째로 지운다 —
    `~{::actions}` 는 템플릿을 다시 훑어 조각을 찾으므로 영향을 받지 않는다.
  */-->
  <th:block th:remove="all">
    <div th:fragment="actions">
      <a class="btn" th:href="@{${csv}}">CSV 내려받기</a>
    </div>
  </th:block>
  <div class="page-header d-print-none pt-0">
    <div class="container-xl">
    <!--/* 설정과 같은 탭 줄. 여기로 들어온 뒤 돌아갈 길이 있어야 한다. */-->
    <ul class="nav nav-tabs">
      <li th:replace="~{fragments/ui :: tab('/settings', '계정', null, false)}"></li>
      <li th:replace="~{fragments/ui :: tab('/settings?tab=ips', '접근 IP', null, false)}"></li>
      <li th:replace="~{fragments/ui :: tab('/settings?tab=tools', '도구', null, false)}"></li>
      <li th:replace="~{fragments/ui :: tab('/settings/audit', '감사 로그', null, true)}"></li>
    </ul>
    </div>
  </div>

  <div class="page-body">
    <div class="container-xl">
    <div class="card">
  <form method="get" class="card-body border-bottom py-2 d-flex flex-wrap align-items-center gap-2">
    <label class="form-label mb-0 me-1 d-flex align-items-center gap-1">계정
      <input class="form-control form-control-sm" name="actor" th:value="${actor}" autocomplete="off" placeholder="hong.gildong">
    </label>
    <label class="form-label mb-0 me-1 d-flex align-items-center gap-1">행위
      <select class="form-select form-select-sm w-auto" name="action">
        <option value="">전체</option>
        <option th:each="e : ${events}" th:value="${e}" th:text="${e.label()}"
                th:selected="${action != null && action == e}">로그인</option>
      </select>
    </label>
    <label class="form-label mb-0 me-1 d-flex align-items-center gap-1">부터
      <input class="form-control form-control-sm" type="date" name="from" th:value="${from}">
    </label>
    <label class="form-label mb-0 me-1 d-flex align-items-center gap-1">까지
      <input class="form-control form-control-sm" type="date" name="to" th:value="${to}">
    </label>
    <label class="form-label mb-0 me-1 d-flex align-items-center gap-1">검색
      <input class="form-control form-control-sm" name="q" th:value="${q}" autocomplete="off" placeholder="대상 · 내용">
    </label>
    <button class="btn" type="submit">적용</button>
  </form>

  <div>
    <div class="card-body py-2 border-bottom d-flex align-items-center gap-2 flex-wrap">
      <b th:text="${#numbers.formatInteger(page.totalElements, 0, 'COMMA')}">0</b><span>건</span>
    </div>

    <div class="table-responsive">
      <table class="table table-vcenter card-table">
        <thead>
        <tr>
          <th class="tight">시각</th>
          <th class="tight">계정</th>
          <th class="tight">행위</th>
          <th class="tight">대상</th>
          <th>내용</th>
          <th class="tight">접속 IP</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${page.content}">
          <!--/* 초까지 찍는다. 같은 분 안에 여러 일이 일어나고, 점검에서 순서를 묻는다. */-->
          <td class="tight num" th:text="${#temporals.format(a.at, 'yyyy-MM-dd HH:mm:ss')}">—</td>
          <td class="tight" th:text="${#strings.isEmpty(a.actor)} ? '—' : ${a.actor}">—</td>
          <td class="tight">
            <span class="tag" th:classappend="${a.action.name() == 'LOGIN_FAILURE'
                  or a.action.name() == 'LOGIN_BLOCKED'} ? 'kev' : ''"
                  th:text="${a.action.label()}">로그인</span>
          </td>
          <td class="tight" th:text="${#strings.isEmpty(a.target)} ? '—' : ${a.target}">—</td>
          <td class="faint" th:text="${#strings.isEmpty(a.detail)} ? '—' : ${a.detail}">—</td>
          <td class="tight faint num" th:text="${#strings.isEmpty(a.clientIp)} ? '—' : ${a.clientIp}">—</td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="card-footer d-flex justify-content-center gap-3" th:if="${page.totalPages > 1}">
      <a th:if="${prevLink != null}" th:href="@{${prevLink}}">이전</a>
      <span th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>
      <a th:if="${nextLink != null}" th:href="@{${nextLink}}">다음</a>
    </div>
  </div>
    </div>
    </div>
  </div>
  </div>

</main>
</body>
</html>
