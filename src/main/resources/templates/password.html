<!doctype html>
<!--/*
  비밀번호 변경.

  껍데기를 쓰지 않고 홀로 선다. 강제로 온 경우(최초 로그인·기한 만료·임시
  비밀번호)에는 다른 화면이 열리지 않으므로 메뉴를 그려도 누를 곳이 없고,
  누를 수 없는 메뉴가 있는 화면은 고장으로 읽힌다. 스스로 찾아온 경우에는
  아래에 돌아갈 길을 둔다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="(${reason != null} ? ${reason.title()} : '비밀번호 변경') + ' — SBOMSight'">비밀번호 변경</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="gate">

<main class="gate-box">
  <div class="brand">SBOMSight</div>

  <div th:if="${message}" class="banner ok" th:text="${message}" style="margin:0 0 18px"></div>
  <div th:if="${error}" class="banner danger" th:text="${error}" style="margin:0 0 18px"></div>

  <h1 th:text="${reason != null} ? ${reason.title()} : '비밀번호 변경'">비밀번호 변경</h1>

  <!-- 온 이유를 그대로 말한다. 하나의 문구로 뭉치면, 임시 비밀번호를 받아
       온 사람에게 "현재 비밀번호" 를 물어 무엇을 넣으라는 건지 한 번 더
       생각하게 만든다. -->
  <p class="why" th:if="${reason != null && !#strings.isEmpty(reason.lede())}">
    <span th:text="${reason.lede()}">최초 로그인입니다.</span>
    <span th:if="${reason.name() == 'EXPIRED' && maxAgeDays > 0}"
          th:text="${maxAgeDays} + '일마다 바꾸도록 되어 있고, ' + ${daysSinceChange} + '일이 지났습니다.'"></span>
  </p>

  <form method="post" th:action="@{/password}">
    <label th:text="${reason != null} ? ${reason.currentLabel()} : '현재 비밀번호'">현재 비밀번호</label>
    <input name="current" type="password" required autocomplete="current-password" autofocus>

    <label>새 비밀번호</label>
    <input name="password" type="password" required minlength="8" autocomplete="new-password">

    <label>새 비밀번호 확인</label>
    <input name="confirm" type="password" required minlength="8" autocomplete="new-password">

    <button class="btn primary" type="submit">변경</button>
  </form>

  <p class="center" style="margin:18px 0 0" th:unless="${passwordLocked}">
    <a href="/" style="font-size:13.5px">돌아가기</a>
  </p>
  <!-- 붙잡힌 상태에서 돌아갈 곳은 로그아웃뿐이다. 아무 길도 없으면 갇힌다. -->
  <form th:action="@{/logout}" method="post" class="center" style="margin-top:18px"
        th:if="${passwordLocked}">
    <button type="submit" class="btn link">로그아웃</button>
  </form>
</main>

</body>
</html>
