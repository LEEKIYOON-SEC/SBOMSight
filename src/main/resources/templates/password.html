<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::main}, '', ${reason != null} ? ${reason.title()} : '비밀번호 변경')}">
<body>
<main>

  <div class="page-head">
    <h1 th:text="${reason != null} ? ${reason.title()} : '비밀번호 변경'">비밀번호 변경</h1>
  </div>

  <!-- 온 이유를 그대로 말한다. 하나의 문구로 뭉치면, 임시 비밀번호를 받아
       온 사람에게 "현재 비밀번호" 를 물어 무엇을 넣으라는 건지 한 번 더
       생각하게 만든다. -->
  <p class="lede" th:if="${reason != null && !#strings.isEmpty(reason.lede())}"
     th:text="${reason.lede()}">최초 로그인입니다.</p>

  <p class="faint" th:if="${reason != null && reason.name() == 'EXPIRED' && maxAgeDays > 0}"
     th:text="${maxAgeDays} + '일마다 바꾸도록 되어 있고, ' + ${daysSinceChange} + '일이 지났습니다.'"></p>

  <div class="card" style="max-width:28rem">
    <form method="post" th:action="@{/password}">
      <label th:text="${reason != null} ? ${reason.currentLabel()} : '현재 비밀번호'">현재 비밀번호
      </label>
      <input name="current" type="password" required autocomplete="current-password">

      <label>새 비밀번호</label>
      <input name="password" type="password" required minlength="8" autocomplete="new-password">

      <label>새 비밀번호 확인</label>
      <input name="confirm" type="password" required minlength="8" autocomplete="new-password">

      <button class="btn primary" type="submit" style="margin-top:.75rem">변경</button>
    </form>
  </div>

</main>
</body>
</html>
