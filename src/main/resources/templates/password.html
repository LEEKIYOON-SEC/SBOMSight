<!doctype html>
<!--/*
  비밀번호 변경.

  껍데기를 쓰지 않고 홀로 선다. 강제로 온 경우(최초 로그인·기한 만료·임시
  비밀번호)에는 다른 화면이 열리지 않으므로 메뉴를 그려도 누를 곳이 없고,
  누를 수 없는 메뉴가 있는 화면은 고장으로 읽힌다. 스스로 찾아온 경우에는
  아래에 돌아갈 길을 둔다.
*/-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="(${reason != null} ? ${reason.title()} : '비밀번호 변경') + ' — SBOMSight'">비밀번호 변경</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/tabler/tabler.min.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="d-flex flex-column bg-surface-secondary">

<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4">
      <span class="navbar-brand fs-2 fw-bold">SBOMSight</span>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 mb-2" th:text="${reason != null} ? ${reason.title()} : '비밀번호 변경'">비밀번호 변경</h2>

        <!--/* 온 이유를 그대로 말한다. 하나의 문구로 뭉치면, 임시 비밀번호를 받아
             온 사람에게 "현재 비밀번호" 를 물어 무엇을 넣으라는 건지 한 번 더
             생각하게 만든다. */-->
        <p class="text-secondary mb-4" th:if="${reason != null && !#strings.isEmpty(reason.lede())}">
          <span th:text="${reason.lede()}">최초 로그인</span>
          <span th:if="${reason.name() == 'EXPIRED' && maxAgeDays > 0}"
                th:text="'변경 주기 ' + ${maxAgeDays} + '일 · 마지막 변경 후 ' + ${daysSinceChange} + '일'"></span>
        </p>

        <!--/*
          `for`/`id` 로 이름표를 칸에 묶는다. 앞서 이름표와 칸이 그냥 나란히
          놓여 있어 **이름표를 눌러도 칸에 초점이 가지 않았고**, 읽어 주는
          도구에도 이름 없는 비밀번호 칸 셋으로 들렸다.
        */-->
        <form method="post" th:action="@{/password}">
          <div class="mb-3">
            <label class="form-label" for="pw-current"
                   th:text="${reason != null} ? ${reason.currentLabel()} : '현재 비밀번호'">현재 비밀번호</label>
            <input class="form-control" id="pw-current" name="current" type="password" required
                   autocomplete="current-password" autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="pw-new">새 비밀번호</label>
            <input class="form-control" id="pw-new" name="password" type="password" required
                   minlength="8" autocomplete="new-password">
          </div>
          <div class="mb-3">
            <label class="form-label" for="pw-confirm">새 비밀번호 확인</label>
            <input class="form-control" id="pw-confirm" name="confirm" type="password" required
                   minlength="8" autocomplete="new-password">
          </div>
          <div class="form-footer">
            <button class="btn btn-dark w-100" type="submit">변경</button>
          </div>
        </form>
      </div>
    </div>

    <p class="text-center text-secondary mt-3" th:unless="${passwordLocked}">
      <a href="/">돌아가기</a>
    </p>
    <!--/* 붙잡힌 상태에서 돌아갈 곳은 로그아웃뿐이다. 아무 길도 없으면 갇힌다. */-->
    <form th:action="@{/logout}" method="post" class="text-center mt-3" th:if="${passwordLocked}">
      <button type="submit" class="btn btn-link">로그아웃</button>
    </form>
  </div>
</div>

</body>
</html>
