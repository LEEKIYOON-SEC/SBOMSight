<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::main}, '', '비밀번호 변경')}">
<body>
<main>

  <div class="page-head"><h1>비밀번호 변경</h1></div>

  <div th:if="${mustChange}" class="banner warn">
    <b>처음 받은 비밀번호를 쓰고 있습니다.</b>
    새 비밀번호를 정하기 전에는 다른 화면이 열리지 않습니다.
  </div>

  <div class="card" style="max-width:26rem">
    <form method="post" th:action="@{/password}">
      <label>현재 비밀번호
        <input name="current" type="password" required autocomplete="current-password">
      </label>
      <label>새 비밀번호
        <input name="password" type="password" required minlength="8" autocomplete="new-password">
      </label>
      <label>새 비밀번호 확인
        <input name="confirm" type="password" required minlength="8" autocomplete="new-password">
      </label>
      <button class="btn primary" type="submit">변경</button>
    </form>
  </div>

</main>
</body>
</html>
