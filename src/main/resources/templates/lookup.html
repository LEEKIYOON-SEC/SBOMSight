<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::main}, 'lookup', '전사 조회')}">
<body>
<main>

  <div class="page-head">
    <h1>전사 조회</h1>
    <a class="btn" th:if="${searched}"
       th:href="@{/lookup/export.csv(q=${q}, zone=${selectedZone},
                  severity=${severity}, fixable=${fixable})}">CSV 내려받기</a>
  </div>

  <div class="body flush">

  <form method="get" class="filters">
    <label style="flex:1; min-width:18rem">CVE · 패키지
      <input name="q" th:value="${q}" autocomplete="off" autofocus
             placeholder="log4j-core · CVE-2021-44228 · GHSA-jfh8">
    </label>
    <label>구역
      <select name="zone">
        <option value="">전체</option>
        <option th:each="z : ${zones}" th:value="${z.id}" th:text="${z.name}"
                th:selected="${selectedZone != null && selectedZone == z.id}">DMZ</option>
      </select>
    </label>
    <label>심각도
      <select name="severity">
        <option value="">전체</option>
        <option value="Critical" th:selected="${severity == 'Critical'}">심각</option>
        <option value="High" th:selected="${severity == 'High'}">높음</option>
        <option value="Medium" th:selected="${severity == 'Medium'}">보통</option>
        <option value="Low" th:selected="${severity == 'Low'}">낮음</option>
      </select>
    </label>
    <label>수정본
      <select name="fixable">
        <option value="">전체</option>
        <option value="true" th:selected="${fixable != null && fixable}">있음</option>
        <option value="false" th:selected="${fixable != null && !fixable}">없음</option>
      </select>
    </label>
    <button class="btn primary" type="submit">찾기</button>
  </form>

  <div class="empty" th:unless="${searched}">
    찾을 CVE 번호나 패키지 이름을 입력하세요.
  </div>

  <th:block th:if="${searched}">
    <div class="empty" th:if="${page.totalElements == 0}">
      <b>걸리는 것이 없습니다</b>
    </div>

    <th:block th:if="${page.totalElements > 0}">
      <!-- 이 한 줄이 "어디까지 번졌나" 에 답한다. -->
      <div class="resultcount">
        <span>
          자산 <b class="num" th:text="${assetCount}">0</b>대 ·
          탐지 <b class="num" th:text="${#numbers.formatInteger(page.totalElements, 0, 'COMMA')}">0</b>건
        </span>
        <span class="pcount" th:each="e : ${byZone}">
          <i class="zrail" style="background:var(--fg-faint)"></i>
          <span th:text="${e.key}">DMZ</span>
          <b class="num" th:text="${e.value} + '대'">0대</b>
        </span>
      </div>

      <div>
        <div class="table-scroll">
          <table>
            <thead>
            <tr>
              <th class="tight">자산</th>
              <th class="tight">구역</th>
              <th class="tight">취약점</th>
              <th class="tight">심각도</th>
              <th class="num tight">CVSS</th>
              <th class="tight">패키지</th>
              <th class="tight">설치 → 수정</th>
              <th class="tight">검사 시각</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="f : ${page.content}">
              <td class="tight">
                <a th:href="@{'/assets/' + ${f.scan.asset.id}}">
                  <b th:text="${f.scan.asset.name}">web-01</b></a>
              </td>
              <td class="tight faint" th:text="${f.scan.asset.zone.name}">DMZ</td>
              <td class="tight">
                <a th:href="@{'/scans/' + ${f.scan.id}(q=${f.displayId})}"
                   th:text="${f.displayId}">CVE-0000-0000</a>
                <div class="faint" th:if="${!#strings.isEmpty(f.secondaryId)}"
                     th:text="${f.secondaryId}">GHSA-…</div>
              </td>
              <td class="tight">
                <i class="mark" th:classappend="${#strings.toLowerCase(f.severity)}"></i>
                <span th:switch="${#strings.toLowerCase(f.severity)}">
                  <th:block th:case="'critical'">심각</th:block>
                  <th:block th:case="'high'">높음</th:block>
                  <th:block th:case="'medium'">보통</th:block>
                  <th:block th:case="'low'">낮음</th:block>
                  <th:block th:case="*" th:text="${#strings.isEmpty(f.severity)} ? '미확인' : ${f.severity}">미확인</th:block>
                </span>
              </td>
              <td class="num tight" th:text="${f.cvssScore != null} ? ${f.cvssScore} : '—'">—</td>
              <td class="tight">
                <span th:text="${f.packageName}">log4j-core</span>
                <span class="faint" th:text="${f.packageType}">java-archive</span>
              </td>
              <td class="tight">
                <span th:text="${f.packageVersion}">2.14.1</span> →
                <b th:if="${f.fixAvailable}" th:text="${f.fixedVersion}">2.15.0</b>
                <span th:if="${f.noFix}" class="tag nofix">수정본 없음</span>
                <span th:if="${!f.fixAvailable && !f.noFix}" class="faint">확인 필요</span>
              </td>
              <td class="tight faint num"
                  th:text="${#temporals.format(f.scan.createdAt, 'yyyy-MM-dd')}">—</td>
            </tr>
            </tbody>
          </table>
        </div>

        <div class="pager" th:if="${page.totalPages > 1}">
          <a th:if="${page.hasPrevious()}"
             th:href="@{/lookup(page=${page.number - 1}, q=${q}, zone=${selectedZone},
                        severity=${severity}, fixable=${fixable})}">이전</a>
          <span th:text="${page.number + 1} + ' / ' + ${page.totalPages}">1 / 1</span>
          <a th:if="${page.hasNext()}"
             th:href="@{/lookup(page=${page.number + 1}, q=${q}, zone=${selectedZone},
                        severity=${severity}, fixable=${fixable})}">다음</a>
        </div>
      </div>
    </th:block>
  </th:block>
  </div>

</main>
</body>
</html>
