<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page(~{::main}, 'vulns', ${cve})}">
<body>
<main>

  <!--/*
    CVE 하나 — 어디에 있고 무엇이 걸려 있나.

    앞서는 목록에서 CVE 번호를 눌러도 갈 곳이 없었다. 긴급 상황에서 번호
    하나를 받아 들고 "우리한테 있나, 몇 대에 있나" 를 묻는데, 그 답을 보려면
    자산을 하나씩 열어야 했다.
  */-->
  <div class="page-header d-print-none">
    <div class="container-xl">
    <div class="page-pretitle"><a th:href="@{/vulns(group='cve')}">취약점</a></div>
    <div class="d-flex align-items-center gap-2 flex-wrap">
      <h2 class="page-title mono" th:text="${cve}">CVE-0000-0000</h2>
      <span th:replace="~{fragments/ui :: sev(${first.severity})}"></span>
      <span th:if="${first.kev != null and first.kev}" class="tag kev">실제 악용 확인</span>
    </div>
    <div class="text-secondary mt-1">
      <!--/* **자른 쪽이 아니라 전부를 센다.** 한 쪽에 실린 줄 수를 찍으면
           `100건` 인데 쪽이 다섯인 화면이 된다. */-->
      영향 자산 <b th:text="${assetCount}">0</b>대 ·
      탐지 <b th:text="${rows.totalElements}">0</b>건
      <th:block th:each="s, i : ${spread}">
        <th:block th:if="${i.first}"> · </th:block>
        <span th:text="${s.zoneName} + ' ' + ${s.assetCount} + '대'">DMZ 2대</span><th:block
          th:unless="${i.last}"> · </th:block>
      </th:block>
    </div>
    </div>
  </div>

  <div class="page-body">
    <div class="container-xl">

    <div class="card">
      <!--/*
        `grype 이 준 값` 이라고 붙여 두었다. 쓰는 사람에게 이 화면은 그냥
        **취약점 정보**다 — 어느 도구가 냈는지는 각주 한 줄이면 된다.
        (누가 말한 것인지 구분하는 것은 `검토 결과` 칸이 따로 한다.)
      */-->
      <div class="card-header"><h2 class="card-title">취약점 정보</h2></div>
      <div class="card-body">
        <table class="table kv">
          <tr><th>CVSS</th>
              <td>
                <b th:if="${first.cvssScore != null}" th:text="${first.cvssScore}">10.0</b>
                <span class="faint" th:if="${first.cvssScore == null}">—</span>
                <span class="faint mono" th:if="${!#strings.isEmpty(first.cvssVector)}"
                      th:text="${first.cvssVector}">CVSS:3.1/…</span>
              </td></tr>
          <tr><th>악용 확률</th>
              <td th:text="${first.epss != null}
                           ? ${#numbers.formatDecimal(first.epss * 100, 1, 2)} + '%  (EPSS)' : '—'">—</td></tr>
          <tr><th>실제 악용</th>
              <td>
                <span class="tag kev" th:if="${first.kev != null and first.kev}">확인됨 (KEV)</span>
                <!--/* 값이 없는 것과 "아니다" 는 다르다. 둘 다 `확인` 을 기준으로
                     적되, 모르는 것을 아니라고 말하지 않는다. */-->
                <span class="faint" th:if="${first.kev == null}">확인되지 않음</span>
                <span class="faint" th:if="${first.kev != null and !first.kev}">확인된 바 없음</span>
              </td></tr>
          <tr th:if="${!#strings.isEmpty(first.secondaryId)}">
              <th>별칭</th><td class="mono faint" th:text="${first.secondaryId}">GHSA-…</td></tr>
          <!--/*
            grype 이 이 건을 어떤 방식으로 맞췄는가. 목록에서 내려왔다 —
            줄마다 같은 값(`exact-direct-match`)이 찍혀 아무것도 말해 주지
            않으면서 칸을 먹었고, 그만큼 오른쪽의 `검토 결과` 칸과 `적기`
            단추가 화면 밖으로 밀려 있었다. **지우지는 않는다** — grype 이
            낸 값이고 한 건을 따져 볼 때 필요한 자리가 여기다.
          */-->
          <tr th:if="${!#strings.isEmpty(first.matchType)}">
              <th>대조 방식</th><td class="mono faint" th:text="${first.matchType}">exact-direct-match</td></tr>
          <tr th:if="${!#strings.isEmpty(first.dataSource)}">
              <th>출처</th>
              <td><a th:href="${first.dataSource}" target="_blank" rel="noreferrer"
                     th:text="${first.dataSource}">https://…</a></td></tr>
        </table>
        <p class="footnote" style="margin-top:12px">
          ※ 검사 결과 그대로 · 재계산 없음
        </p>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h2 class="card-title">이 CVE가 있는 자산</h2>
        <span class="faint" style="font-size:13px" th:text="${assetCount} + '대'">0대</span></div>
      <!--/* 목록과 같은 규칙 — 해당 없음 · 오탐은 기본에서 뺀다. 빠진 것이
           있을 때만 줄을 세운다. 숨은 칸에 `includeDone` 을 싣지 않는다 —
           실으면 체크를 풀어도 켠 값이 함께 가서 끌 수 없다. */-->
      <form method="get" th:action="@{'/vulns/' + ${cve}}"
            class="card-body border-bottom py-2 d-flex align-items-center gap-2"
            th:if="${reviewedOut > 0 or includeDone}">
        <input type="hidden" name="zone" th:if="${param.zone != null}" th:value="${param.zone}">
        <div th:replace="~{fragments/ui :: reviewedout(${includeDone}, ${reviewedOut})}"></div>
      </form>
      <div th:replace="~{fragments/ui :: countline(${rows}, ${links}, '건')}"></div>
      <div class="table-responsive">
        <table class="table table-vcenter card-table">
          <thead><tr>
            <th class="tight">자산</th><th class="tight">구역</th>
            <th class="tight">패키지</th><th class="tight">현재 → 목표</th>
            <th class="tight">검사 시각</th><th class="tight"></th>
          </tr></thead>
          <tbody>
          <tr th:each="f : ${rows.content}">
            <td class="tight"><a th:href="@{'/assets/' + ${f.scan.asset.id}}"
                                 style="font-weight:600" th:text="${f.scan.asset.name}">web-01</a></td>
            <td class="tight faint">
              <i class="zrail" th:style="'background:' + (${#strings.isEmpty(f.scan.asset.zone.color)}
                                         ? '#6f7e8d' : ${f.scan.asset.zone.color})"></i>
              <span th:text="${f.scan.asset.zone.name}">DMZ</span></td>
            <td class="tight">
              <span th:text="${f.packageName}">openssl</span>
              <span class="faint" th:text="${f.packageType}">rpm</span></td>
            <td class="tight mono">
              <span th:text="${f.packageVersion}">1.0.0</span> →
              <b th:if="${f.fixAvailable}" th:text="${f.fixedVersion}">2.0.0</b>
              <span th:if="${f.noFix}" class="tag nofix">수정 버전 없음</span>
              <span th:if="${!f.fixAvailable && !f.noFix}" class="faint">확인 필요</span></td>
            <td class="tight faint mono"
                th:text="${#temporals.format(f.scan.createdAt, 'yyyy-MM-dd')}">—</td>
            <td class="tight actions">
              <a class="btn btn-sm" th:href="@{'/assets/' + ${f.scan.asset.id}(tab='vulns')}">열기</a></td>
          </tr>
          </tbody>
        </table>
      </div>
      <div th:replace="~{fragments/ui :: pager(${rows}, ${links})}"></div>
    </div>
  </div>
    </div>

</main>
</body>
</html>
