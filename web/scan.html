<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스캔 결과 — SBOMSight</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar"></header>

<main class="wide">
  <div class="page-head">
    <h1>스캔 결과</h1>
    <a class="btn" id="back-to-asset" hidden>← 자산으로</a>
  </div>

  <div id="banner"></div>

  <!-- 전시 모드: 실제 PC에서 뽑아 둔 결과 목록 -->
  <section class="card hidden" id="static-card">
    <h3 style="margin-top:0">전시 중인 실제 스캔 결과</h3>
    <p class="muted" style="margin-top:0">
      실제 PC에서 Syft·Grype로 수행한 결과입니다. 이 페이지에서는 새로 스캔하지 않습니다.
    </p>
    <div class="toolbar" style="margin-bottom:0">
      <select id="static-pick"></select>
      <div class="spacer"></div>
      <span class="faint" id="static-info"></span>
    </div>
  </section>

  <!-- 결과 -->
  <section class="hidden" id="result">
    <h2>결과</h2>
    <div class="grid cols-4" id="stats" style="margin-bottom:.75rem"></div>
    <div class="flow" id="summary-line" style="margin-bottom:1rem"></div>

    <div class="card">
      <div class="toolbar">
        <select id="filter-priority">
          <option value="">대응 검토 전체</option>
          <option value="P0">즉시 검토</option>
          <option value="P1">우선 검토</option>
          <option value="P2">계획 검토</option>
          <option value="P3">모니터링</option>
        </select>
        <select id="filter-ecosystem"><option value="">패키지 유형 전체</option></select>
        <select id="filter-fix">
          <option value="">상태 전체</option>
          <option value="update">업데이트 가능</option>
          <option value="nofix">수정 버전 없음</option>
          <option value="kev">실제 악용 확인 (CISA KEV)</option>
          <option value="exploit">공격코드 공개</option>
        </select>
        <input type="search" id="filter-text" placeholder="패키지 또는 CVE 검색">
        <div class="spacer"></div>
        <button id="csv-btn">CSV 내려받기</button>
        <span class="faint" id="count"></span>
      </div>

      <!-- 선택 막대 — 무엇을 고를지, 고른 것으로 무엇을 할지 -->
      <div class="toolbar selection-bar" id="selection-bar">
        <b id="selection-count">선택 없음</b>
        <span class="faint" id="selection-hint">보고서와 AI 전송의 범위입니다.</span>
        <button id="select-all">전체 선택</button>
        <button id="select-none">선택 해제</button>
        <div class="spacer"></div>
        <button id="egress-btn" disabled>AI에 전송될 내용 보기</button>
        <button class="primary" id="go-report" disabled>보고서 생성</button>
      </div>

      <div class="table-scroll">
        <table>
          <thead><tr>
            <th class="pick"><input type="checkbox" id="check-all" aria-label="이 쪽 전체 선택"></th>
            <th class="sortable" data-sort="priority">대응 검토</th>
            <th class="sortable" data-sort="package">패키지</th>
            <th>설치 <span class="arrow">→</span> 목표</th>
            <th class="num sortable" data-sort="count">취약점</th>
            <th class="num sortable" data-sort="cvss">최고 심각도</th>
            <th class="num sortable" data-sort="epss">최고 악용 예측</th>
            <th>근거</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="toolbar pager" id="pager">
        <button id="page-first" title="처음">«</button>
        <button id="page-prev">이전</button>
        <span id="page-label" class="faint"></span>
        <button id="page-next">다음</button>
        <button id="page-last" title="마지막">»</button>
        <label class="check">쪽당
          <select id="page-size">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
          </select>
        </label>
      </div>
    </div>
  </section>
</main>

<!-- 이그레스 미리보기 -->
<div class="drawer-backdrop" id="egress-backdrop"></div>
<aside class="drawer" id="egress-drawer" aria-hidden="true">
  <header>
    <h2>AI에게 전송될 내용 전체</h2>
    <button class="close" id="egress-close">닫기</button>
  </header>
  <div class="body" id="egress-body"></div>
</aside>

<div class="drawer-backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header>
    <h2 id="drawer-title"></h2>
    <button class="close" id="drawer-close">닫기</button>
  </header>
  <div class="body" id="drawer-body"></div>
</aside>

<footer class="site">
  대응 검토 우선순위는 정책 룰의 산출물이며, 내부 위험도와 최종 패치 여부는 보안담당자가 판단합니다.
</footer>

<script type="module">
import { getProvider } from './js/providers/index.js';
import { findingKey } from './js/core/model.js';
import {
  $, $$, esc, renderCveList, renderDetail, renderPackageTable,
  renderStats, renderSummaryLine,
} from './js/core/ui.js';
import { mountTopbar } from './js/core/nav.js';

await mountTopbar('scan.html');
const provider = await getProvider();
const canUpload = provider.capabilities?.upload !== false;
const canSelect = provider.capabilities?.select !== false;

const state = {
  scanId: null,
  page: [],                 // 지금 화면에 그린 한 쪽
  total: 0,                 // 필터를 적용한 뒤의 건수
  scanTotal: 0,             // 스캔 전체 건수
  offset: 0,
  limit: 100,
  selected: new Set(),
  sort: { key: 'priority', desc: false },
  ai: { ready: false, model: '' },
};

// --- 환경 안내 -------------------------------------------------------------
let health = {};
try {
  health = await provider.health();
  state.ai = health.ai || state.ai;
  if (health.mode === 'static') {
    $('#banner').innerHTML = `<div class="banner info">
      <b>전시 모드</b> — ${esc(health.note || '')}
      ${health.exported_at ? `<span class="faint">내보낸 시각 ${esc(health.exported_at)}</span>` : ''}</div>`;
  } else if (!health.ok) {
    $('#banner').innerHTML = `<div class="banner warn">
      <b>Grype를 찾을 수 없습니다.</b> 설치 후 <code>grype db update</code>로 DB를 준비하세요.
      설치 전에는 스캔이 실패합니다.</div>`;
  }
} catch (error) {
  $('#banner').innerHTML = `<div class="banner danger">상태를 확인하지 못했습니다: ${esc(error.message)}</div>`;
}

// 이 결과가 어느 서버의 것인지. 스캔은 자산 화면에서 시작하므로 돌아갈 길을 둔다.
function showAssetLink(assetId) {
  if (!assetId) return;
  const link = $('#back-to-asset');
  link.href = `asset.html?id=${encodeURIComponent(assetId)}`;
  link.hidden = false;
}

// --- 결과 ------------------------------------------------------------------
//
// **한 줄이 패키지 하나다.** 조치는 패키지당 한 번이고 — `openssl` 을 3.0.7로
// 올리면 CVE 5건이 한 번에 해소된다 — 고르는 단위도 보고서를 뽑는 단위도
// 그것과 같아야 한다. CVE 단위로 늘어놓으면 48,923줄이 되고 같은 패치를
// 여섯 번 읽게 된다. 여기서는 8,154줄이 되고, 그것도 100개씩 쪽을 넘긴다.
//
// 정렬·필터·페이징은 전부 서버(SQL)가 한다.

const FILTER_FIELDS = {
  priority: '#filter-priority',
  type: '#filter-ecosystem',
  status: '#filter-fix',
  q: '#filter-text',
};

/** 서버에 넘길 조회 조건. 주소창에 남는 것과 같은 이름을 쓴다. */
function queryParams() {
  return {
    priority: $('#filter-priority').value,
    package_type: $('#filter-ecosystem').value,
    status: $('#filter-fix').value,
    q: $('#filter-text').value.trim(),
  };
}

/**
 * 필터·정렬·쪽 번호를 주소창에 남긴다.
 *
 * 남기지 않으면 새로고침 한 번에 초기화되고, "이 조건으로 보이는 것" 을 남에게
 * 링크로 건넬 수도 없다. `replaceState` 라 뒤로 가기가 필터 조작 이력으로
 * 채워지지도 않는다.
 */
function writeFiltersToUrl() {
  const params = new URLSearchParams(window.location.search);
  for (const [name, selector] of Object.entries(FILTER_FIELDS)) {
    const value = $(selector).value.trim();
    if (value) params.set(name, value); else params.delete(name);
  }
  if (state.sort.key !== 'priority' || state.sort.desc) {
    params.set('sort', state.sort.key);
    params.set('order', state.sort.desc ? 'desc' : 'asc');
  } else {
    params.delete('sort');
    params.delete('order');
  }
  if (state.offset) params.set('offset', String(state.offset));
  else params.delete('offset');
  window.history.replaceState(null, '', `?${params}`);
}

function readFiltersFromUrl() {
  const params = new URLSearchParams(window.location.search);
  for (const [name, selector] of Object.entries(FILTER_FIELDS)) {
    const value = params.get(name);
    if (value !== null) $(selector).value = value;
  }
  if (params.get('sort')) {
    state.sort = { key: params.get('sort'), desc: params.get('order') === 'desc' };
  }
  state.offset = Number(params.get('offset') || 0) || 0;
}

async function loadResults(scanId) {
  state.scanId = scanId;
  state.selected = new Set();
  state.offset = 0;

  const summary = await provider.scanSummary(scanId);
  renderStats($('#stats'), summary);
  renderSummaryLine($('#summary-line'), summary);
  state.scanTotal = summary.total;

  // 그때 담당자가 실제로 고른 범위를 되살린다. 묶음 키만 받는다 — 되살리자고
  // 48,923건을 통째로 받으면 첫 화면이 12초가 된다.
  try {
    const saved = await provider.getSelection(scanId);
    for (const key of saved?.packages || []) state.selected.add(key);
  } catch { /* 선택 기록이 없으면 전체가 범위다 */ }

  readFiltersFromUrl();

  if (!canSelect) {
    $$('#selection-bar button').forEach((b) => { b.hidden = true; });
    $('#check-all').disabled = true;
    $('#selection-hint').textContent = '이 스캔에서 실제로 선택되었던 항목입니다.';
  }
  $('#egress-btn').hidden = !provider.egressPreview;

  $('#result').classList.remove('hidden');
  await refresh({ pushUrl: false });
}

/** 지금 조건으로 한 쪽을 받아 그린다. */
async function refresh({ pushUrl = true } = {}) {
  const rows = $('#rows');
  rows.innerHTML = '<tr><td colspan="8" class="muted" style="text-align:center;padding:1.5rem">불러오는 중…</td></tr>';

  let page;
  try {
    page = await provider.listPackages(state.scanId, {
      ...queryParams(),
      sort: state.sort.key,
      order: state.sort.desc ? 'desc' : 'asc',
      offset: state.offset,
      limit: state.limit,
    });
  } catch (error) {
    rows.innerHTML = `<tr><td colspan="8" class="muted" style="text-align:center;padding:1.5rem">
      불러오지 못했습니다: ${esc(error.message)}</td></tr>`;
    return;
  }

  state.page = page.packages;
  state.total = page.total;
  state.totals = page.totals || {};

  // 패키지 유형 목록은 스캔마다 고정이라 한 번만 채운다.
  const picker = $('#filter-ecosystem');
  if (picker.options.length <= 1 && page.package_types?.length) {
    const keep = picker.value;
    picker.innerHTML = '<option value="">패키지 유형 전체</option>'
      + page.package_types.map((t) => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
    picker.value = keep;
  }

  const allPackages = state.totals.packages ?? page.total;
  $('#count').textContent = page.total === allPackages
    ? `패키지 ${page.total.toLocaleString()}개 · 취약점 ${state.scanTotal.toLocaleString()}건`
    : `패키지 ${page.total.toLocaleString()} / ${allPackages.toLocaleString()}개`;
  $$('th.sortable').forEach((th) => {
    th.dataset.active = th.dataset.sort === state.sort.key ? (state.sort.desc ? 'desc' : 'asc') : '';
  });

  renderPackageTable(rows, page.packages, openPackage, {
    selected: state.selected,
    onToggle: toggleSelection,
    selectable: canSelect,
  });
  renderPager(page);
  syncSelectionUi();
  if (pushUrl) writeFiltersToUrl();
}

function renderPager(page) {
  const pages = Math.max(1, Math.ceil(page.total / state.limit));
  const current = Math.floor(page.offset / state.limit) + 1;
  const from = page.total ? page.offset + 1 : 0;
  const to = page.offset + page.packages.length;

  $('#page-label').textContent =
    `${from.toLocaleString()}–${to.toLocaleString()} / ${page.total.toLocaleString()}개 · ${current} / ${pages}쪽`;
  $('#page-first').disabled = page.offset === 0;
  $('#page-prev').disabled = page.offset === 0;
  $('#page-next').disabled = !page.has_more;
  $('#page-last').disabled = !page.has_more;
  $('#pager').hidden = page.total <= state.limit;
}

function goTo(offset) {
  state.offset = Math.max(0, offset);
  refresh();
}

$('#page-first').addEventListener('click', () => goTo(0));
$('#page-prev').addEventListener('click', () => goTo(state.offset - state.limit));
$('#page-next').addEventListener('click', () => goTo(state.offset + state.limit));
$('#page-last').addEventListener('click', () => {
  goTo(Math.max(0, (Math.ceil(state.total / state.limit) - 1) * state.limit));
});
$('#page-size').addEventListener('change', (event) => {
  state.limit = Number(event.target.value) || 100;
  goTo(0);
});

// --- 필터 · 정렬 ------------------------------------------------------------
Object.values(FILTER_FIELDS).forEach((selector) => {
  const el = $(selector);
  let timer = null;
  const fire = () => {
    // 검색은 타자마다 서버를 두드리지 않는다. 멈춘 뒤에 한 번 보낸다.
    window.clearTimeout(timer);
    timer = window.setTimeout(() => { state.offset = 0; refresh(); }, 250);
  };
  el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', fire);
});

$$('th.sortable').forEach((th) => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    // 같은 열을 다시 누르면 방향을 뒤집는다. 다른 열이면 그 열의 자연스러운
    // 방향에서 시작한다 — 점수와 건수는 높은 것부터, 이름은 가나다순부터.
    state.sort = state.sort.key === key
      ? { key, desc: !state.sort.desc }
      : { key, desc: key === 'cvss' || key === 'epss' || key === 'count' };
    state.offset = 0;
    refresh();
  });
});

// CSV 는 서버가 만든다. 표는 패키지로 묶어 보지만 CSV 는 취약점 한 줄씩이다 —
// 엑셀로 넘긴 뒤에 다시 묶거나 거르는 것은 담당자 몫이다.
$('#csv-btn').addEventListener('click', () => {
  window.location.href = provider.csvUrl(state.scanId, queryParams());
});

// --- 선택 ------------------------------------------------------------------
// 고른 것만 AI로 나가고, 고른 것만 보고서가 된다. 두 범위가 갈라지면
// "미리보기에서 본 것"과 "실제로 나간 것"이 달라지므로 한 집합으로 관리한다.
// 단위는 **패키지**다.
function toggleSelection(key, on) {
  if (on) state.selected.add(key); else state.selected.delete(key);
  syncSelectionUi();
}

function syncSelectionUi() {
  const n = state.selected.size;
  $('#selection-count').textContent = n ? `패키지 ${n.toLocaleString()}개 선택` : '선택 없음';
  $('#egress-btn').disabled = !provider.egressPreview || (canSelect && n === 0);

  // 보고서도 AI 전송과 같은 규칙이다 — 고른 것이 있어야 눌린다. 범위를 정하지
  // 않고 누르면 8,154개짜리 문서가 나오는데, 그것을 원한 사람은 없었다.
  const report = $('#go-report');
  report.disabled = canSelect && n === 0;
  report.textContent = n ? `보고서 생성 (${n.toLocaleString()}개)` : '보고서 생성';

  const visible = state.page.map((g) => g.key);
  const all = visible.length > 0 && visible.every((k) => state.selected.has(k));
  const checkAll = $('#check-all');
  checkAll.checked = all;
  checkAll.indeterminate = !all && visible.some((k) => state.selected.has(k));
}

$('#check-all').addEventListener('change', (event) => {
  for (const g of state.page) {
    if (event.target.checked) state.selected.add(g.key);
    else state.selected.delete(g.key);
  }
  refresh();
});

/**
 * 지금 조건에 맞는 **전부**를 고른다.
 *
 * 화면에는 한 쪽밖에 없으므로 "전부"는 서버만 안다. 상한은 두지 않는다 —
 * 담당자가 전체라고 했으면 전체여야 하고, 묶음 키는 짧은 문자열이라
 * 8,154개라도 한 번에 오간다.
 */
$('#select-all').addEventListener('click', async (event) => {
  const button = event.currentTarget;
  button.disabled = true;
  try {
    const result = await provider.packageKeys(state.scanId, queryParams());
    for (const key of result.keys) state.selected.add(key);
    $('#selection-hint').textContent = '보고서와 AI 전송의 범위입니다.';
  } catch (error) {
    $('#selection-hint').textContent = `선택하지 못했습니다: ${error.message}`;
  } finally {
    button.disabled = false;
  }
  await refresh();
});

$('#select-none').addEventListener('click', () => {
  state.selected.clear();
  $('#selection-hint').textContent = '보고서와 AI 전송의 범위입니다.';
  refresh();
});

/**
 * 보고서로 넘어가기 전에 선택을 **서버에 남긴다.**
 *
 * 예전에는 고른 키를 전부 주소창에 실어 보냈다. 5,000건을 고르면 URL 이
 * 250KB 가 되고, uvicorn 의 HTTP 파서가 요청 줄 길이 상한에 걸려
 * `Invalid HTTP request received` 로 끊었다. 선택은 어차피 기록해 두어야
 * 하는 것이므로(`export` 가 "이 보고서는 무엇을 대상으로 만들어졌는가"를
 * 옮긴다), 기록하고 그것을 가리키기만 한다.
 */
$('#go-report').addEventListener('click', async (event) => {
  if (!provider.saveSelection || !state.scanId) return;
  const button = event.currentTarget;
  const label = button.textContent;
  button.disabled = true;
  button.textContent = '보고서 생성 중…';
  try {
    await provider.saveSelection(state.scanId, { packages: [...state.selected] });
  } catch (error) {
    button.textContent = label;
    button.disabled = false;
    window.alert(`보고서를 만들지 못했습니다: ${error.message}`);
    return;
  }
  location.href = `report.html?scan=${encodeURIComponent(state.scanId)}`;
});

// --- 상세 패널 -------------------------------------------------------------
//
// **두 단이다.** 표에서 패키지를 누르면 그 패키지의 CVE 목록이 나오고, 거기서
// CVE 를 누르면 그 한 건의 상세가 나온다.
//
// 상세를 표 안에 펼치지 않는 이유가 있다. CVE 한 건의 상세는 145줄이고,
// 패키지 하나에 6건이면 그것만으로 화면 열 장이다. 눌러서 볼 것은 눌러서
// 보고, 표는 표로 남는다.
//
// 서술과 권고 절차는 **그 항목 하나만** 서버에서 조립해 온다. 예전에는 화면을
// 열 때 보고서 전체를 만들어 색인해 두었는데, 48,923건이면 그 한 번이 몇 분이다.

/** 지금 드로어가 무엇을 보여 주고 있는지. 늦게 도착한 응답이 덮어쓰지 못하게 한다. */
let drawerToken = 0;
let openGroup = null;

function showDrawer() {
  $('#drawer').classList.add('open');
  $('#drawer').setAttribute('aria-hidden', 'false');
  $('#backdrop').classList.add('open');
}

/** ① 패키지 하나 — 그 안의 CVE 목록. */
async function openPackage(group) {
  const token = ++drawerToken;
  openGroup = group;
  const target = group.target_version
    ? ` → ${group.target_version}`
    : ' (수정본 없음)';
  $('#drawer-title').textContent = `${group.package} ${group.installed_version}${target}`;
  $('#drawer-body').innerHTML = '<p class="muted">불러오는 중…</p>';
  showDrawer();

  let findings;
  try {
    findings = await provider.packageFindings(state.scanId, group.package, group.installed_version);
  } catch (error) {
    if (token === drawerToken) {
      $('#drawer-body').innerHTML = `<div class="banner danger">${esc(error.message)}</div>`;
    }
    return;
  }
  if (token !== drawerToken) return;

  const body = $('#drawer-body');
  body.innerHTML = `
    <p class="muted">이 패키지를 <b>${esc(group.target_version || '—')}</b> 로 올리면
      취약점 <b>${group.fixable_count.toLocaleString()}건</b>이 해소됩니다.
      ${group.no_fix_count
        ? `수정본이 없는 항목이 <b>${group.no_fix_count.toLocaleString()}건</b> 있습니다.` : ''}</p>
    <div class="toolbar">
      <a class="btn small primary" id="pkg-report">이 패키지 보고서</a>
      <span class="faint">CVE 를 누르면 그 한 건의 상세가 나옵니다</span>
    </div>
    <div id="cve-host"></div>`;
  $('#pkg-report').href = `report.html?scan=${encodeURIComponent(state.scanId)}`
    + `&package=${encodeURIComponent(group.package)}`
    + `&version=${encodeURIComponent(group.installed_version)}`;
  renderCveList($('#cve-host'), findings, (f) => openFinding(f, group));
}

/** ② CVE 한 건 — 상세. 위에 목록으로 돌아가는 길을 둔다. */
function openFinding(finding, group) {
  const token = ++drawerToken;
  $('#drawer-title').textContent = `${finding.intel?.cve} · ${finding.installed?.name}`;
  const body = $('#drawer-body');
  body.innerHTML = '<p class="muted">불러오는 중…</p>';
  showDrawer();

  const draw = (recommendation, narrative) => {
    if (token !== drawerToken) return;
    body.innerHTML = '<div class="toolbar"><button class="btn small" id="back-to-pkg">'
      + `← ${esc(group.package)} 취약점 목록</button></div><div id="detail-host"></div>`;
    $('#back-to-pkg').addEventListener('click', () => openPackage(group));
    renderDetail($('#detail-host'), finding, recommendation, narrative);
  };

  const key = findingKey(finding);
  (provider.findingDetail ? provider.findingDetail(state.scanId, key) : Promise.resolve(null))
    .then((item) => {
      const narrative = item?.technical_risk
        ? {
            source: item.narrative_source,
            technical_risk: item.technical_risk.narrative,
            preconditions: item.technical_risk.preconditions,
            impact_types: item.technical_risk.impact_types,
            exploitability_note: item.exploitability.narrative,
            response_rationale: item.response_rationale.narrative,
          }
        : null;
      draw(item?.recommendation, narrative);
    })
    .catch((error) => {
      // 서술을 못 받아도 숫자와 판정 근거는 이미 손에 있다. 그것만이라도 보여 준다.
      console.warn('상세를 불러오지 못했습니다:', error);
      draw(null, null);
    });
}

function closeDrawer() {
  drawerToken += 1;
  openGroup = null;
  $('#drawer').classList.remove('open');
  $('#drawer').setAttribute('aria-hidden', 'true');
  $('#backdrop').classList.remove('open');
}
$('#drawer-close').addEventListener('click', closeDrawer);
$('#backdrop').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape') closeDrawer();
});

// --- 이그레스 미리보기 -------------------------------------------------------
// "공개 데이터만 보냅니다"라는 주장은 검증할 수 있어야 의미가 있다.
// 실제 전송에 쓰이는 것과 같은 조립기·같은 가드를 통과시킨 결과를 그대로 보여 준다.
$('#egress-btn').addEventListener('click', async () => {
  if (!state.scanId || !provider.egressPreview) return;
  const body = $('#egress-body');
  body.innerHTML = '<p class="muted">조립하고 검증하는 중…</p>';
  openEgress();

  try {
    // 고른 범위를 먼저 서버에 기록하고 그것을 가리킨다. 키를 전부 주소창에
    // 실으면 URL 이 수백 KB 가 되어 HTTP 파서가 요청을 끊는다.
    await provider.saveSelection(state.scanId, { packages: [...state.selected] });
    const preview = await provider.egressPreview(state.scanId, { saved: true });
    body.innerHTML = renderEgress(preview);
    wireGenerate();
  } catch (error) {
    body.innerHTML = `<div class="banner danger">미리보기를 불러오지 못했습니다: ${esc(error.message)}</div>`;
  }
});

function renderEgress(preview) {
  // "검증 통과" 만으로는 무엇을 확인했다는 것인지 알 수 없다. 확인한 내용을
  // 그대로 평문으로 쓴다 — 이 화면의 존재 이유가 그 확인이다.
  const verdict = preview.ok
    ? `<div class="banner info"><b>전송 항목 확인됨</b> —
         전송 대상 ${preview.fact_count}건을 확인했습니다.
         자산명·호스트명·IP·파일 경로·설치 버전·판정 결과는 포함되지 않았습니다.
         <span class="faint">AI 전송 허용 항목 ${esc(preview.policy.label)}</span></div>`
    : `<div class="banner danger"><b>전송 차단</b> — 허용 항목에 없는 값이 발견되어
         이 상태로는 전송되지 않습니다.</div>`;

  const violations = (preview.violations || []).length
    ? `<div class="callout"><ul>${preview.violations
        .map((v) => `<li><code>${esc(v.rule)}</code> @ <span class="mono">${esc(v.path)}</span>
           — ${esc(v.reason)}${v.sample ? ` <span class="mono">(${esc(v.sample)})</span>` : ''}</li>`)
        .join('')}</ul></div>`
    : '';

  const scope = preview.selection?.scope === 'selection'
    ? `선택한 ${preview.finding_count.toLocaleString()}건`
    : `전체 ${preview.finding_count.toLocaleString()}건`;

  // 상한에 걸렸으면 그렇다고 말한다. 조용히 자르면 "확인한 것"과 "나가는 것"이
  // 달라지고, 그러면 이 화면이 하는 확인에 의미가 없다.
  const capped = preview.capped
    ? `<div class="banner warn"><b>범위가 넓습니다.</b>
         고른 ${preview.finding_count.toLocaleString()}건 중
         <b>${preview.cap.toLocaleString()}건</b>까지만 한 번에 전송합니다.
         즉시·우선 검토로 좁히거나 패키지를 몇 개만 골라 주세요.</div>`
    : '';

  // 전시 모드에서는 여기서 새로 조립하지 않는다 — 기록을 그대로 보여 준다.
  const action = preview.recorded
    ? `<div class="callout">이 내용은 실제 PC에서 <b>이미 전송된 기록</b>입니다.
         이 페이지에서는 AI를 호출하지 않습니다.</div>`
    : sendButton(preview);

  return `
    ${capped}
    ${verdict}
    ${violations}
    <table class="kv">
      <tr><th>전송 범위</th><td>${esc(scope)}</td></tr>
      <tr><th>전송 대상</th><td>${preview.fact_count}건
        ${preview.deduplicated > 0
          ? `<span class="faint">(중복 ${preview.deduplicated}건 제외 — 중복 수는 곧 자산 규모라 내보내지 않습니다)</span>`
          : ''}</td></tr>
      <tr><th>AI 사용 설정</th><td>${preview.would_send
        ? `사용 가능${preview.model ? ` <span class="mono">${esc(preview.model)}</span>` : ''}`
        : '미사용 (기본값)'}</td></tr>
    </table>
    <div class="callout">${esc(preview.note || '')}</div>
    ${action}

    <div class="section">
      <h3>전송될 데이터 (VulnFact)</h3>
      <pre class="step-cmd" style="max-height:22rem;overflow:auto">${esc(JSON.stringify(preview.facts, null, 2))}</pre>
    </div>

    <div class="section">
      <h3>프롬프트 원문</h3>
      <p class="muted">시스템 지시와 요청 본문 전체입니다. 여기 없는 것은 전송되지 않습니다.</p>
      <pre class="step-cmd" style="max-height:26rem;overflow:auto">${esc(preview.prompt || '')}</pre>
    </div>`;
}

function sendButton(preview) {
  if (!preview.ok) {
    return '<div class="callout">가드가 막았으므로 전송할 수 없는 상태입니다.</div>';
  }
  if (!preview.would_send) {
    return `<div class="callout">
      AI 사용이 꺼져 있거나 키가 설정되지 않았습니다. <code>.env</code> 에
      <code>SBOMSIGHT_AI_ENABLED=1</code> 과 <code>GEMINI_API_KEY</code> 를 넣고 서버를
      다시 시작하세요. <b>AI 없이도 보고서는 룰 기반으로 완결됩니다.</b>
    </div>`;
  }
  // 생성은 보고서에서 **패키지 하나씩** 한다. 한 번에 몰아 보내면 분당 토큰
  // 한도를 첫 요청에서 넘겨 그 뒤가 전부 실패한다.
  return `<div class="callout">이 화면은 무엇이 나가는지 확인하는 자리입니다.
    해설 생성은 보고서에서 패키지마다 <b>AI 해설 생성</b>을 눌러 진행합니다.</div>`;
}

function wireGenerate() {
  // 여기서는 보내지 않는다. 이 화면은 **무엇이 나가는지 확인하는 자리**이고,
  // 생성은 보고서에서 패키지 하나씩 한다 — 한 번에 몰아 보내면 분당 토큰
  // 한도를 첫 요청에서 넘겨 그 뒤가 전부 실패한다.
}

function openEgress() {
  $('#egress-drawer').classList.add('open');
  $('#egress-drawer').setAttribute('aria-hidden', 'false');
  $('#egress-backdrop').classList.add('open');
}
function closeEgress() {
  $('#egress-drawer').classList.remove('open');
  $('#egress-drawer').setAttribute('aria-hidden', 'true');
  $('#egress-backdrop').classList.remove('open');
}
$('#egress-close').addEventListener('click', closeEgress);
$('#egress-backdrop').addEventListener('click', closeEgress);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  closeEgress();
  closeDrawer();
});

// --- 전시 모드 목록 / 링크로 들어온 경우 -------------------------------------
const requested = new URLSearchParams(location.search).get('scan');

if (!canUpload) {
  try {
    const { scans } = await provider.listScans();
    if (!scans.length) {
      $('#banner').innerHTML = `<div class="banner warn">
        전시할 결과가 아직 없습니다. 실제 PC에서
        <code>python -m core.cli export --out results</code> 로 결과를 내보내 주세요.</div>`;
    } else {
      $('#static-card').classList.remove('hidden');
      $('#static-pick').innerHTML = scans
        .map((s) => `<option value="${esc(s.scan_id)}">${esc(s.label || s.metadata?.sbom_filename || s.scan_id)}
          · 탐지 ${s.finding_count}건${s.selected_count ? ` · 선택 ${s.selected_count}건` : ''}</option>`)
        .join('');
      const pick = $('#static-pick');
      pick.value = requested && scans.some((s) => s.scan_id === requested) ? requested : scans[0].scan_id;
      const show = async () => {
        const scan = scans.find((s) => s.scan_id === pick.value) || {};
        $('#static-info').textContent = [
          scan.created_at ? `스캔 ${scan.created_at}` : '',
          scan.metadata?.grype_version ? `grype ${scan.metadata.grype_version}` : '',
          scan.ai_used ? 'AI 서술 사용' : 'AI 미사용 (룰 기반)',
        ].filter(Boolean).join(' · ');
        await loadResults(pick.value);
      };
      pick.addEventListener('change', () => show().catch((error) => {
        $('#banner').innerHTML = `<div class="banner danger">${esc(error.message)}</div>`;
      }));
      await show();
    }
  } catch (error) {
    $('#banner').innerHTML = `<div class="banner danger">전시 결과를 불러오지 못했습니다: ${esc(error.message)}</div>`;
  }
} else if (requested) {
  try {
    const meta = await provider.getScanMeta(requested);
    showAssetLink(meta.asset_id);
    await loadResults(requested);
  } catch (error) {
    $('#banner').innerHTML = `<div class="banner danger">스캔 ${esc(requested)}을(를) 불러오지 못했습니다: ${esc(error.message)}</div>`;
  }
} else {
  // 스캔은 자산 화면에서 시작한다. 여기로 곧장 들어올 일은 없지만, 들어왔다면
  // 어디로 가야 하는지 말해 준다.
  $('#banner').innerHTML = `<div class="banner info">
    볼 스캔이 지정되지 않았습니다. <a href="index.html">자산 화면</a>에서 서버를 고르고
    SBOM 을 올리거나, 그 서버의 스캔 이력에서 결과를 열어 주세요.</div>`;
}
</script>
</body>
</html>
