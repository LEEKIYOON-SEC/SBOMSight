<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자산 상세 — SBOMSight</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar"></header>

<main class="wide">
  <div class="page-head">
    <h1 id="title">—</h1>
    <button class="btn primary" id="open-upload" hidden>SBOM 올리기</button>
  </div>

  <div id="banner"></div>

  <!-- SBOM 은 **이 자산에** 올린다. 별도 탭으로 두면 "어느 서버 것인지 나중에
       정하는" 길이 열리고, 실제로 그래서 어디에도 속하지 않는 결과가 쌓였다. -->
  <section class="card hidden" id="upload-card">
    <div class="dropzone" id="dropzone">
      <div class="big">SBOM JSON 파일을 여기에 놓거나 클릭해 선택하세요</div>
      <div class="sub">CycloneDX JSON · SPDX JSON · Syft JSON</div>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
    <div class="toolbar" style="margin-bottom:0">
      <label class="check"><input type="checkbox" id="enrich" checked>
        위협정보 보강 (EPSS · CISA KEV · 공개 Exploit)</label>
      <div class="spacer"></div>
      <span id="file-info" class="faint"></span>
      <button class="btn" id="upload-cancel">닫기</button>
      <button class="btn primary" id="run" disabled>스캔 시작</button>
    </div>
  </section>

  <!-- 진행. 단계 목록이 아니라 **게이지**다 — 담당자가 알고 싶은 것은
       "지금 어디쯤이고 끝났는가" 하나다. -->
  <section class="card hidden" id="progress-card">
    <div class="toolbar" style="margin:0 0 .6rem">
      <b id="progress-step">준비 중…</b>
      <div class="spacer"></div>
      <span class="faint" id="progress-detail"></span>
    </div>
    <div class="gauge"><div class="gauge-fill" id="gauge"></div></div>
    <div class="toolbar" style="margin:.6rem 0 0" id="progress-done" hidden>
      <div class="spacer"></div>
      <a class="btn primary" id="see-result">결과 보기 →</a>
    </div>
    <div id="job-error"></div>
  </section>

  <!-- 이 서버가 무엇인지가 먼저다. 이력과 변화는 그다음에 읽는다. -->
  <h2>자산 정보</h2>
  <div class="card">
    <dl class="asset-info" id="meta"></dl>

    <form id="edit" class="field-grid" hidden>
      <label>서버 이름 <input name="name" required autocomplete="off"></label>
      <label>그룹 <input name="group_name" placeholder="DMZ · 내부업무" autocomplete="off"></label>
      <label>운영체제 <input name="os" placeholder="Rocky Linux 9.3" autocomplete="off"></label>
      <label>비고 <input name="note" placeholder="용도 · 담당 부서 등" autocomplete="off"></label>
      <div class="form-actions">
        <button class="btn primary" type="submit">저장</button>
        <button class="btn danger" type="button" id="remove">자산 삭제</button>
      </div>
    </form>
    <div id="edit-msg"></div>
  </div>

  <h2>스캔 이력</h2>
  <div class="card">
    <div id="scans" class="muted">불러오는 중…</div>
  </div>

  <h2>변화</h2>
  <div class="card">
    <div class="toolbar" id="compare-bar" hidden>
      <label class="check">이전 <select id="base"></select></label>
      <span class="arrow">→</span>
      <label class="check">이후 <select id="head"></select></label>
      <button class="btn" id="compare">비교</button>
    </div>
    <div id="diff" class="muted">불러오는 중…</div>
  </div>
</main>

<!-- 삭제는 되돌릴 수 없고 스캔까지 함께 간다. 무엇이 사라지는지 먼저 말한다. -->
<dialog id="remove-dialog">
  <h2>자산 삭제</h2>
  <p id="remove-note"></p>
  <p class="muted">되돌릴 수 없습니다. 같은 서버를 다시 보려면 자산을 새로
    등록하고 SBOM 을 다시 올려 스캔해야 합니다.</p>
  <div id="remove-msg"></div>
  <div class="dialog-actions">
    <button type="button" class="btn" id="remove-cancel">취소</button>
    <button type="button" class="btn danger" id="remove-confirm">삭제</button>
  </div>
</dialog>

<script type="module">
import { getProvider } from './js/providers/index.js';
import { $, esc } from './js/core/ui.js';
import { mountTopbar } from './js/core/nav.js';
import { formatWhen } from './js/core/format.js';

const state = await mountTopbar('index.html');
const isAdmin = state?.role === 'admin';
const assetId = new URLSearchParams(window.location.search).get('id') || '';

async function call(path, options = {}) {
  const response = await fetch(path, {
    headers: options.body ? { 'Content-Type': 'application/json' } : {},
    ...options,
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.detail || `${response.status} ${response.statusText}`);
  return payload;
}

function fail(message) {
  $('#banner').innerHTML = `<div class="banner danger">${esc(message)}</div>`;
}

let asset;
try {
  asset = await call(`api/assets/${encodeURIComponent(assetId)}`);
} catch (error) {
  fail(error.message);
  throw error;
}

document.title = `${asset.name} — SBOMSight`;
$('#title').textContent = asset.name;

// 조회 권한에게는 편집 폼 대신 읽기용 목록을 보여 준다.
$('#meta').innerHTML = [
  ['서버 이름', asset.name],
  ['그룹', asset.group_name],
  ['운영체제', asset.os],
  ['비고', asset.note],
  ['스캔', `${asset.scans.length}건`],
  ['등록', formatWhen(asset.created_at)],
].map(([key, value]) =>
  `<dt>${esc(key)}</dt><dd>${value ? esc(value) : '<span class="faint">—</span>'}</dd>`).join('');

// --- 스캔 이력 --------------------------------------------------------------
if (!asset.scans.length) {
  $('#scans').innerHTML = '<span class="muted">아직 이 자산의 스캔이 없습니다.</span>';
} else {
  $('#scans').innerHTML = `<div class="table-scroll"><table>
    <thead><tr><th>시각</th><th>SBOM</th><th class="num">컴포넌트</th>
      <th class="num">탐지</th><th></th></tr></thead>
    <tbody>${asset.scans.map((s) => `<tr>
      <td>${esc(formatWhen(s.created_at))}</td>
      <td>${esc(s.metadata?.sbom_filename || '—')}</td>
      <td class="num">${s.metadata?.component_count ?? '—'}</td>
      <td class="num">${s.finding_count}</td>
      <td><a href="scan.html?scan=${encodeURIComponent(s.scan_id)}">열기</a></td>
    </tr>`).join('')}</tbody></table></div>`;
}

// --- SBOM 올리기 ------------------------------------------------------------
//
// 진행은 **게이지 하나**다. 일곱 칸짜리 스테퍼는 무엇이 도는지는 보여 주지만
// 담당자가 알고 싶은 것은 "지금 어디쯤이고 끝났는가" 하나다. 끝나면 결과
// 화면으로 넘어간다.

const provider = await getProvider();
let upload = null;

if (isAdmin) {
  $('#open-upload').hidden = false;
  $('#open-upload').addEventListener('click', () => {
    $('#upload-card').classList.remove('hidden');
    $('#open-upload').hidden = true;
    $('#dropzone').scrollIntoView({ block: 'center' });
  });
  $('#upload-cancel').addEventListener('click', () => {
    $('#upload-card').classList.add('hidden');
    $('#open-upload').hidden = false;
  });

  const dropzone = $('#dropzone');
  const fileInput = $('#file');
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('over'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('over');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
  });
  $('#run').addEventListener('click', startScan);
}

function formatBytes(n) {
  if (!n && n !== 0) return '';
  const units = ['B', 'KB', 'MB', 'GB'];
  let value = n, unit = 0;
  while (value >= 1024 && unit < units.length - 1) { value /= 1024; unit += 1; }
  return `${value >= 100 || unit === 0 ? Math.round(value) : value.toFixed(1)}${units[unit]}`;
}

async function handleFile(file) {
  const info = $('#file-info');
  $('#run').disabled = true;
  info.textContent = `${file.name} (${formatBytes(file.size)}) 업로드 중…`;

  try {
    upload = await provider.upload(file, {
      onProgress: (loaded, total) => {
        const pct = total ? Math.round((loaded / total) * 100) : 0;
        info.textContent = `${file.name} 업로드 중… ${pct}% (${formatBytes(loaded)} / ${formatBytes(total)})`;
      },
    });
    const fmt = upload.format === 'unknown' ? '형식 미상' : upload.format;
    // 셀 수 없었으면 0이 아니라 미상이다. 0은 "컴포넌트가 없다"는 거짓말이 된다.
    const count = upload.component_count === null || upload.component_count === undefined
      ? '컴포넌트 수 미상'
      : `컴포넌트 ${upload.component_count.toLocaleString()}개`;
    info.innerHTML = `<b>${esc(upload.filename)}</b> · ${esc(fmt)} · ${esc(count)}`;
    $('#run').disabled = false;
  } catch (error) {
    info.innerHTML = `<span class="bad">업로드 실패: ${esc(error.message)}</span>`;
  }
}

function setGauge(percent, step, detail = '') {
  $('#gauge').style.width = `${Math.max(2, Math.min(100, percent))}%`;
  $('#progress-step').textContent = step;
  $('#progress-detail').textContent = detail;
}

async function startScan() {
  if (!upload) return;
  $('#run').disabled = true;
  $('#upload-card').classList.add('hidden');
  $('#progress-card').classList.remove('hidden');
  $('#progress-done').hidden = true;
  $('#job-error').innerHTML = '';
  setGauge(3, '스캔을 시작하는 중…');

  let job;
  try {
    job = await provider.startScan({
      uploadId: upload.upload_id,
      filename: upload.filename,
      enrich: $('#enrich').checked,
      assetId: asset.asset_id,
    });
  } catch (error) {
    $('#job-error').innerHTML = `<div class="banner danger">스캔을 시작하지 못했습니다: ${esc(error.message)}</div>`;
    $('#run').disabled = false;
    $('#open-upload').hidden = false;
    return;
  }

  while (true) {
    const status = await provider.pollScan(job.job_id);
    const steps = status.steps || [];
    const done = steps.filter((s) => s.state === 'done').length;
    const running = steps.find((s) => s.state === 'running');
    setGauge(
      steps.length ? Math.round((done / steps.length) * 100) : 5,
      running?.label || (status.state === 'done' ? '완료' : '처리 중…'),
      running?.detail || steps.find((s) => s.state === 'done' && s.metric)?.metric || '',
    );

    if (status.state === 'done') {
      setGauge(100, '완료', `탐지 ${(status.summary?.total ?? 0).toLocaleString()}건`);
      $('#see-result').href = `scan.html?scan=${encodeURIComponent(status.scan_id)}`;
      $('#progress-done').hidden = false;
      // 결과가 이 화면의 목적이다. 다 됐다고만 하고 멈추면 한 번 더 눌러야 한다.
      window.location.href = $('#see-result').href;
      return;
    }
    if (status.state === 'failed') {
      const failed = steps.find((s) => s.state === 'failed');
      $('#job-error').innerHTML = `<div class="banner danger">
        ${esc(failed?.label || '스캔')} 단계에서 실패했습니다: ${esc(failed?.detail || status.error || '')}</div>`;
      setGauge(100, '실패');
      $('#open-upload').hidden = false;
      return;
    }
    await new Promise((resolve) => setTimeout(resolve, 600));
  }
}

// --- 변화 -------------------------------------------------------------------
//
// 세 갈래로 낸다 — 신규 · 해소 · 유지.
//
// "187건에서 184건이 됐다"만으로는 같은 수라도 내용이 완전히 바뀐 경우를
// 구분할 수 없다. 지난달에 없던 것이 무엇인지가 실제로 봐야 하는 값이다.
//
// **갈래마다 쪽을 넘긴다.** 예전에는 세 갈래를 통째로 그렸는데, 스캔 하나가
// 48,923건이면 유지만 수만 줄이라 스크롤조차 되지 않았다.

const CHANGE_PAGE = 50;
const KINDS = [
  { key: 'added', label: '신규', cls: 'added' },
  { key: 'resolved', label: '해소', cls: 'resolved' },
  { key: 'remaining', label: '유지', cls: '' },
];
const offsets = { added: 0, resolved: 0, remaining: 0 };
let scope = null;

function changeRows(rows, kind) {
  if (!rows.length) return '<p class="muted">없음</p>';
  const previous = kind === 'remaining';
  return `<div class="table-scroll"><table>
    <thead><tr><th>CVE</th><th>패키지</th><th>설치 버전</th>
      ${previous ? '<th>이전 버전</th>' : ''}<th>수정 버전</th></tr></thead>
    <tbody>${rows.map((c) => `<tr>
      <td class="mono">${esc(c.cve)}</td>
      <td>${esc(c.package_name)}</td>
      <td class="mono">${esc(c.installed_version || '—')}</td>
      ${previous ? `<td class="mono ${
        c.previous_version && c.previous_version !== c.installed_version ? 'changed' : 'faint'
      }">${esc(c.previous_version || '—')}</td>` : ''}
      <td class="mono">${c.fixed_version
        ? esc(c.fixed_version) : '<span class="none">없음</span>'}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

async function renderKind(kind) {
  const host = $(`#changes-${kind}`);
  if (!host) return;
  host.innerHTML = '<p class="muted">불러오는 중…</p>';

  const params = new URLSearchParams({
    kind, base: $('#base').value, head: $('#head').value,
    offset: String(offsets[kind]), limit: String(CHANGE_PAGE),
  });
  let page;
  try {
    page = await call(`api/assets/${encodeURIComponent(assetId)}/history/changes?${params}`);
  } catch (error) {
    host.innerHTML = `<div class="banner danger">${esc(error.message)}</div>`;
    return;
  }

  const from = page.total ? page.offset + 1 : 0;
  const to = page.offset + page.changes.length;
  host.innerHTML = changeRows(page.changes, kind)
    + (page.total > CHANGE_PAGE ? `
      <div class="toolbar pager">
        <button type="button" data-page="${kind}:prev" ${page.offset === 0 ? 'disabled' : ''}>이전</button>
        <span class="faint">${from.toLocaleString()}–${to.toLocaleString()} / ${page.total.toLocaleString()}건</span>
        <button type="button" data-page="${kind}:next" ${page.has_more ? '' : 'disabled'}>다음</button>
      </div>` : '');
}

function fillSelect(select, scans, selected) {
  select.innerHTML = scans.map((s) =>
    `<option value="${esc(s.scan_id)}"${s.scan_id === selected ? ' selected' : ''}>
      ${esc(formatWhen(s.created_at))} · 탐지 ${s.finding_count}건</option>`).join('');
}

async function renderDiff(base = '', head = '') {
  const params = new URLSearchParams();
  if (base) params.set('base', base);
  if (head) params.set('head', head);
  const query = params.toString();

  let result;
  try {
    result = await call(
      `api/assets/${encodeURIComponent(assetId)}/history${query ? `?${query}` : ''}`,
    );
  } catch (error) {
    $('#diff').innerHTML = `<div class="banner danger">${esc(error.message)}</div>`;
    return;
  }

  if (!result.comparable) {
    $('#diff').innerHTML = `<p class="muted">${esc(result.detail)}</p>`;
    return;
  }

  scope = result;
  $('#compare-bar').hidden = false;
  fillSelect($('#base'), result.scans, result.base_scan_id);
  fillSelect($('#head'), result.scans, result.head_scan_id);

  $('#diff').innerHTML = `
    <p class="muted">${esc(formatWhen(result.base_created_at))}
      <span class="arrow">→</span> ${esc(formatWhen(result.head_created_at))}</p>
    <div class="grid cols-4" style="margin-bottom:1rem">
      ${KINDS.map((k) => `<div class="stat ${k.cls}">
        <div class="n">${(result.counts[k.key] ?? 0).toLocaleString()}</div>
        <div class="k">${k.label}</div></div>`).join('')}
    </div>
    ${KINDS.map((k) => `<h3>${k.label} ${(result.counts[k.key] ?? 0).toLocaleString()}건</h3>
      <div id="changes-${k.key}"></div>`).join('')}`;

  for (const k of KINDS) offsets[k.key] = 0;
  await Promise.all(KINDS.map((k) => renderKind(k.key)));
}

$('#diff').addEventListener('click', (event) => {
  const action = event.target.dataset?.page;
  if (!action) return;
  const [kind, direction] = action.split(':');
  offsets[kind] = Math.max(0, offsets[kind] + (direction === 'next' ? CHANGE_PAGE : -CHANGE_PAGE));
  renderKind(kind);
});

$('#compare').addEventListener('click', () => renderDiff($('#base').value, $('#head').value));
await renderDiff();

// --- 자산 정보 편집 ---------------------------------------------------------
if (isAdmin) {
  // 관리자에게는 읽기용 목록 대신 편집 폼을 준다. 두 벌을 같이 두면 어느 쪽이
  // 지금 값인지 알 수 없다.
  $('#meta').hidden = true;
  const form = $('#edit');
  form.hidden = false;
  form.name.value = asset.name;
  form.group_name.value = asset.group_name;
  form.os.value = asset.os;
  form.note.value = asset.note;

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = new FormData(form);
    try {
      await call(`api/assets/${encodeURIComponent(assetId)}`, {
        method: 'PUT',
        body: JSON.stringify({
          name: data.get('name'), group_name: data.get('group_name'),
          os: data.get('os'), note: data.get('note'),
        }),
      });
      window.location.reload();
    } catch (error) {
      $('#edit-msg').innerHTML = `<div class="banner danger">${esc(error.message)}</div>`;
    }
  });

  // --- 삭제 -----------------------------------------------------------------
  //
  // 되돌릴 수 없고 스캔까지 함께 간다. 무엇이 사라지는지 먼저 말하고, 두 번째
  // 클릭에서 실제로 지운다.
  const removeDialog = $('#remove-dialog');
  $('#remove-note').innerHTML = asset.scans.length
    ? `<b>${esc(asset.name)}</b> 자산과 이 자산의 스캔
       <b>${asset.scans.length}건</b>, 보관된 SBOM · Grype 결과 파일이 모두 지워집니다.`
    : `<b>${esc(asset.name)}</b> 자산을 지웁니다. 이 자산에는 스캔이 없습니다.`;

  $('#remove').addEventListener('click', () => {
    $('#remove-msg').innerHTML = '';
    removeDialog.showModal();
  });
  $('#remove-cancel').addEventListener('click', () => removeDialog.close());

  $('#remove-confirm').addEventListener('click', async (event) => {
    event.currentTarget.disabled = true;
    try {
      await call(`api/assets/${encodeURIComponent(assetId)}`, { method: 'DELETE' });
      window.location.href = 'index.html';
    } catch (error) {
      $('#remove-msg').innerHTML = `<div class="banner danger">${esc(error.message)}</div>`;
      event.currentTarget.disabled = false;
    }
  });
}
</script>
</body>
</html>
