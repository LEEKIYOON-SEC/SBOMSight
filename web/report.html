<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보고서 — SBOMSight</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
<style>
  .report-meta { display: grid; gap: .35rem .9rem; grid-template-columns: auto 1fr;
    font-size: .87rem; align-items: baseline; }
  .report-meta dt { color: var(--fg-muted); white-space: nowrap; }
  .report-meta dd { margin: 0; }
</style>
</head>
<body>
<header class="topbar"></header>

<main class="wrap">
  <h1>취약점 대응 검토 보고서</h1>
  <div id="banner"></div>

  <section class="card" id="meta-card">
    <dl class="report-meta" id="meta"></dl>
    <div class="toolbar" style="margin-bottom:0">
      <select id="pick-scan"></select>
      <label class="check" id="ai-wrap" hidden>
        <input type="checkbox" id="use-ai"> AI 해설 포함
      </label>
      <div class="spacer"></div>
      <a class="btn" id="back-to-scan">선택 다시 하기</a>
      <button id="print" title="펼쳐 둔 패키지만 인쇄됩니다.">펼친 항목 인쇄 · PDF</button>
      <a class="btn" id="dl-md" download>전체 Markdown</a>
      <a class="btn" id="dl-html" download>전체 HTML</a>
    </div>
  </section>

  <div id="disclaimer"></div>

  <section id="summary" class="hidden">
    <h2>요약</h2>
    <div class="grid cols-4" id="stats" style="margin-bottom:.75rem"></div>
    <div class="flow" id="summary-line" style="margin-bottom:1rem"></div>
    <div class="card" id="snapshot-card"></div>
  </section>

  <!-- AI 분석. **따로 세운다.** 룰 문장과 같은 자리에 같은 모양으로 섞어 두면
       켜도 달라지는 것이 없어 보인다 — 실제로 그렇게 읽혔다. -->
  <section id="ai-section" class="hidden">
    <h2>AI 연계 분석</h2>
    <div class="card ai-card">
      <div class="toolbar" style="margin-top:0">
        <span class="ai-badge">AI</span>
        <b id="ai-headline">저위험 조합이 고위험으로 올라서는 경로</b>
        <div class="spacer"></div>
        <span class="faint" id="ai-model"></span>
        <button type="button" class="btn small" id="ai-preview">전송될 내용 보기</button>
        <button type="button" class="btn small primary" id="ai-run">연계 분석 생성</button>
      </div>
      <div id="ai-body"></div>
    </div>
  </section>

  <section id="actions" class="hidden">
    <h2>조치 대상</h2>
    <p id="action-summary" class="muted"></p>

    <div class="toolbar">
      <select id="pkg-priority">
        <option value="">대응 검토 전체</option>
        <option value="P0">즉시 검토</option>
        <option value="P1">우선 검토</option>
        <option value="P2">계획 검토</option>
        <option value="P3">모니터링</option>
      </select>
      <input type="search" id="pkg-search" placeholder="패키지 또는 CVE 검색">
      <div class="spacer"></div>
    </div>

    <div id="packages"></div>

    <div class="toolbar pager" id="pkg-pager" hidden>
      <button id="pkg-prev">이전</button>
      <span id="pkg-label" class="faint"></span>
      <button id="pkg-next">다음</button>
    </div>
  </section>
</main>

<!-- CVE 근거. 한 건이 145줄이라 표 안에 펼치면 문서가 아니라 두루마리가 된다. -->
<dialog id="cve-dialog" class="wide-dialog">
  <div class="toolbar" style="margin:0 0 .8rem">
    <b id="cve-title"></b>
    <div class="spacer"></div>
    <a class="btn small" id="cve-dl-md" download>Markdown</a>
    <a class="btn small" id="cve-dl-html" download>HTML</a>
    <button type="button" class="btn small" id="cve-print">인쇄 · PDF</button>
    <button type="button" class="btn small primary" id="cve-ai" hidden>AI 해설 생성</button>
    <span class="faint" id="cve-ai-status"></span>
    <button type="button" class="btn small" id="cve-close">닫기</button>
  </div>
  <div id="cve-body"></div>
</dialog>

<footer class="site">
  대응 검토 우선순위는 정책 룰의 산출물이며, 내부 위험도와 최종 패치 여부는 보안담당자가 판단합니다.
</footer>

<script type="module">
import { getProvider } from './js/providers/index.js';
import { $, esc, priorityPill, renderStats, renderSummaryLine } from './js/core/ui.js';
import { EXPLOIT_SOURCE_LABEL, FIX_STATE_LABEL, TERNARY_LABEL } from './js/core/model.js';
import { mountTopbar } from './js/core/nav.js';
import { formatWhen } from './js/core/format.js';

await mountTopbar('report.html');
const provider = await getProvider();
const params = new URLSearchParams(location.search);

// 보고서 머리말. 서버 보고서의 것과 같은 문장이다.
const DISCLAIMER = '대응 검토 우선순위는 공개 데이터에 판정 기준을 적용한 결과이며, '
  + '내부 실제 위험도와 최종 패치 여부는 보안담당자가 판단합니다.';

/**
 * 범위는 **서버에 기록된 선택**이다. 주소창에 싣지 않는다.
 *
 * 예전에는 고른 키를 전부 `?select=` 로 넘겼다. 5,000건을 고르면 URL 이
 * 250KB 가 되고, uvicorn 의 HTTP 파서가 요청 줄 길이 상한에 걸려
 * `Invalid HTTP request received` 로 끊었다.
 */
let scopedPackages = [];

/**
 * AI 해설을 넣을지 **생성 시점에** 고른다.
 *
 * 기본은 미포함이다. 결재 문서를 AI 없이 내야 하는 경우가 있고, 그때는 AI
 * 관련 문구가 한 줄도 없어야 한다. 켜면 이미 만들어 둔 서술과 연계 분석이
 * 얹히고, 없으면 생성 버튼이 뜬다.
 */
let useAi = params.get('ai') === '1';

/** AI 를 실제로 호출할 수 있는가. 못 하면 생성 버튼을 내지 않는다. */
let aiReady = false;
try {
  aiReady = Boolean((await provider.health()).ai?.ready);
} catch { /* 상태를 모르면 없는 것으로 둔다 */ }

function stepList(items, ordered = false) {
  if (!items?.length) return '';
  const tag = ordered ? 'ol' : 'ul';
  const body = items.map((raw) => {
    const [head, ...rest] = String(raw).split('\n');
    const cmd = rest.join('\n').trim();
    return `<li>${esc(head)}${cmd ? `<pre class="step-cmd">${esc(cmd)}</pre>` : ''}</li>`;
  }).join('');
  return `<${tag} class="steps">${body}</${tag}>`;
}

function renderFinding(item, index) {
  const o = item.overview;
  const t = item.technical_risk;
  const e = item.exploitability;
  const r = item.response_rationale;
  const rec = item.recommendation;
  const local = item.local_analysis;
  const fa = local.fix_analysis;
  const src = item.narrative_source === 'ai' ? 'AI 생성 서술' : '룰 기반 서술';

  return `
  <section class="card" id="f-${index}" style="margin-bottom:1rem">
    <h2 style="margin-top:0">${priorityPill(item.priority)} ${index}. ${esc(item.cve)}
      ${item.aliases?.length ? `<small class="faint">별칭 ${esc(item.aliases.join(', '))}</small>` : ''}</h2>

    <table class="kv">
      <tr><th>CVSS</th><td>${esc(item.badge.cvss)}</td></tr>
      <tr><th>EPSS</th><td>${esc(item.badge.epss)}</td></tr>
      <tr><th>CISA KEV</th><td>${esc(item.badge.kev)}</td></tr>
      <tr><th>공개 Exploit</th><td>${esc(item.badge.exploit)}</td></tr>
      <tr><th>수정 버전</th><td class="mono">${esc(item.badge.fixed_version)}</td></tr>
      <tr><th>대응 검토</th><td>${esc(item.badge.verdict)}</td></tr>
    </table>

    ${item.flags?.length ? `<div class="callout"><ul>${item.flags
      .map((f) => `<li><b>${esc(f.label)}</b> — ${esc(f.note)}</li>`).join('')}</ul></div>` : ''}

    <div class="section">
      <h3>① 취약점 개요</h3>
      <table class="kv">
        <tr><th>취약 제품</th><td>${esc(o.advisory_package)} (${esc(o.advisory_ecosystem || '패키지 유형 미상')})</td></tr>
        <tr><th>취약 버전</th><td class="mono">${esc(o.affected_version_range)}</td></tr>
        <tr><th>수정 버전</th><td class="mono">${esc(o.fixed_version)}</td></tr>
        <tr><th>취약점 유형 (CWE)</th><td>${esc(o.cwe?.join(', ') || '미확인')}</td></tr>
        <tr><th>CVSS 벡터</th><td class="mono">${esc(o.cvss_vector || '미확인')}</td></tr>
        <tr><th>공개일</th><td>${esc(o.published || '미확인')}</td></tr>
      </table>
      ${o.description ? `<p class="muted">${esc(o.description)}</p>` : ''}
    </div>

    <div class="section">
      <h3>② 기술적 위험성 <span class="src-badge">${esc(src)}</span></h3>
      <p>${esc(t.narrative)}</p>
      ${t.preconditions?.length ? `<p class="faint">공격 조건</p>${stepList(t.preconditions)}` : ''}
      ${t.impact_types?.length ? `<p class="faint">공격 성공 시 영향 유형</p>${stepList(t.impact_types)}` : ''}
    </div>

    <div class="section">
      <h3>③ 악용 가능성</h3>
      <p>${esc(e.narrative)}</p>
      ${e.exploit_sources?.length
        ? `<p class="faint">Exploit 출처</p><ul class="steps">${e.exploit_sources
            .map((s) => `<li>${esc(EXPLOIT_SOURCE_LABEL[s.source] || s.label || s.source)}: <code>${esc(s.ref)}</code>${
              s.note ? ` — ${esc(s.note)}` : ''}</li>`).join('')}</ul>`
        : ''}
    </div>

    <div class="section">
      <h3>④ 대응 필요성 분석 <span class="src-badge">${esc(src)}</span></h3>
      <p>${esc(r.narrative)}</p>
      ${r.fired_rules?.length
        ? `<p class="faint">판정 근거 (발화 룰)</p><ul class="steps">${r.fired_rules
            .map((fr) => `<li><code>${esc(fr.name)}</code> — ${esc(fr.explain)}</li>`).join('')}</ul>`
        : ''}
      <p class="callout">권고 대응 우선순위: <b>${esc(r.priority)} ${esc(r.priority_label)}</b>
        ${r.priority_description ? `— ${esc(r.priority_description)}` : ''}</p>
    </div>

    <div class="section">
      <h3>⑤ 권고사항</h3>
      <p><b>${esc(rec.action)}</b></p>
      ${rec.precheck?.length ? `<p class="faint">패치 전 확인사항</p>${stepList(rec.precheck)}` : ''}
      ${rec.online_steps?.length ? `<p class="faint">${esc(rec.online_title)}</p>${stepList(rec.online_steps, true)}` : ''}
      ${rec.airgapped_steps?.length ? `<p class="faint">${esc(rec.airgapped_title)}</p>${
        rec.airgapped_note ? `<p class="muted">${esc(rec.airgapped_note)}</p>` : ''
      }${stepList(rec.airgapped_steps, true)}` : ''}
      ${rec.verification?.length ? `<p class="faint">적용 후 검증</p>${stepList(rec.verification)}` : ''}
      ${rec.mitigations?.length ? `<p class="faint">임시 완화 방안 (수정 버전 부재)</p>${stepList(rec.mitigations)}` : ''}
    </div>

    <div class="section">
      <h3>⑥ 근거 및 Reference</h3>
      <ul class="steps">${(item.references || []).map((ref) => ref.url
        ? `<li>${esc(ref.source)}: <a href="${esc(ref.url)}" target="_blank" rel="noopener">${esc(ref.title)}</a></li>`
        : `<li>${esc(ref.source)}: ${esc(ref.title)}</li>`).join('')}</ul>
    </div>

    <div class="section">
      <h3>⑦ 이 자산에서</h3>
      <table class="kv">
        <tr><th>설치 패키지</th><td>${esc(local.installed_package)} (${esc(local.package_type)})</td></tr>
        <tr><th>현재 설치 버전</th><td class="mono">${esc(local.installed_version)}</td></tr>
        <tr><th>업데이트 가능</th><td>${esc(TERNARY_LABEL[fa.update_available] || '미확인')}</td></tr>
        <tr><th>수정 상태 · 버전 격차</th><td>${esc(FIX_STATE_LABEL[fa.fix_state] || '미확인')} ·
          ${esc(fa.version_gap)} <span class="faint">(비교자: ${esc(fa.comparator)})</span></td></tr>
        ${local.locations?.length ? `<tr><th>발견 위치</th><td class="mono">${esc(local.locations.join(', '))}</td></tr>` : ''}
        <tr><th>Grype 탐지</th><td class="mono">${esc(local.detection.matcher)} /
          ${esc(local.detection.match_type)} / ${esc(local.detection.namespace)}</td></tr>
        ${fa.reason ? `<tr><th>판정 사유</th><td>${esc(fa.reason)}</td></tr>` : ''}
      </table>
    </div>
  </section>`;
}

/**
 * 2장 조치 대상 · 3장 패키지별 상세.
 *
 * 둘 다 **패키지 단위로 쪽을 넘긴다.** 48,923건은 패키지 8,154개가 되는데,
 * 그것을 한 화면에 평평하게 늘어놓으면 스크롤조차 되지 않는다. 상세는 펼친
 * 묶음만 서버에서 조립해 온다 — 전체 보고서를 만들면 20초에 수십 MB 다.
 */

const PACKAGE_PAGE = 25;
let pkgOffset = 0;
let pkgTotal = 0;

function packageParams(extra = {}) {
  return {
    priority: $('#pkg-priority').value,
    q: $('#pkg-search').value.trim(),
    // 고른 범위가 있으면 서버가 걸러 준다. 쪽 수와 건수가 범위와 맞아야
    // 하는데, 받아 온 한 쪽에서 걸러 내면 "25개 중 3개"가 되어 어긋난다.
    scoped: scopedPackages.length ? 'true' : '',
    ...extra,
  };
}

async function renderPackages({ pushUrl = true } = {}) {
  const host = $('#packages');
  host.innerHTML = '<p class="muted">불러오는 중…</p>';

  let page;
  try {
    page = await provider.listPackages(scanId(), {
      ...packageParams(),
      offset: pkgOffset,
      limit: PACKAGE_PAGE,
    });
  } catch (error) {
    host.innerHTML = `<div class="banner danger">${esc(error.message)}</div>`;
    return;
  }

  pkgTotal = page.total;
  const t = page.totals || {};
  $('#action-summary').innerHTML = t.fixable_packages
    ? `패키지 <b>${t.fixable_packages.toLocaleString()}개</b>를 업데이트하면 취약점
       <b>${t.fixable.toLocaleString()}건</b>이 해소됩니다.
       ${t.no_fix ? `수정 버전이 없는 항목이 <b>${t.no_fix.toLocaleString()}건</b> 있습니다.` : ''}`
    : '패치로 해소할 수 있는 항목이 없습니다.';

  host.innerHTML = page.packages.length
    ? page.packages.map(packageBlock).join('')
    : '<p class="muted">조건에 맞는 패키지가 없습니다.</p>';

  const pages = Math.max(1, Math.ceil(page.total / PACKAGE_PAGE));
  const current = Math.floor(page.offset / PACKAGE_PAGE) + 1;
  $('#pkg-label').textContent =
    `${(page.total ? page.offset + 1 : 0).toLocaleString()}–${(page.offset + page.packages.length).toLocaleString()}`
    + ` / ${page.total.toLocaleString()}개 · ${current} / ${pages}쪽`;
  $('#pkg-prev').disabled = page.offset === 0;
  $('#pkg-next').disabled = !page.has_more;
  $('#pkg-pager').hidden = page.total <= PACKAGE_PAGE;

  if (pushUrl) {
    const params = new URLSearchParams(window.location.search);
    if (pkgOffset) params.set('pkg', String(pkgOffset)); else params.delete('pkg');
    window.history.replaceState(null, '', `?${params}`);
  }
}

/**
 * 묶음 하나. **접힌 채로 나온다.**
 *
 * 펼칠 때 그 묶음만 서버에서 받아 그린다. 미리 다 그려 두면 패키지 25개만
 * 있어도 CVE 카드가 수백 장이고, 8,154개면 화면이 서지 않는다.
 */
function packageBlock(group) {
  const target = group.target_version
    ? `<span class="mono">${esc(group.installed_version)}</span> <span class="arrow">→</span>
       <b class="mono">${esc(group.target_version)}</b>`
    : `<span class="mono">${esc(group.installed_version)}</span>
       <span class="arrow">→</span> <span class="none">없음</span>`;

  return `
  <details class="pkg" data-priority="${esc(group.priority || '')}"
           data-key="${esc(group.key || '')}"
           data-package="${esc(group.package)}" data-version="${esc(group.installed_version)}">
    <summary>
      <span class="pkg-name"><b>${esc(group.package)}</b>
        <span class="faint">${esc(group.package_type)}</span></span>
      <span class="pkg-review">${esc(group.priority_label || '')}</span>
      <span class="pkg-target">${target}</span>
      <span class="pkg-count">취약점 ${group.cve_count}건${
        group.no_fix_count ? ` · 수정본 없음 ${group.no_fix_count}` : ''}</span>
    </summary>
    <div class="pkg-body"><p class="muted">펼치는 중…</p></div>
  </details>`;
}

/**
 * 펼칠 때 그 묶음만 받아 그린다. 한 번 받으면 다시 받지 않는다.
 *
 * **CVE 상세는 여기에 펼치지 않는다.** 한 건이 145줄이라 6건짜리 패키지
 * 하나만 열어도 열 장이고, 25개를 열면 인쇄가 9,473쪽이 됐다. 여기에는 조치
 * 한 줄과 CVE 표만 두고, 근거는 눌렀을 때 팝업으로 낸다.
 */
async function expandPackage(details) {
  const body = details.querySelector('.pkg-body');
  if (details.dataset.loaded === '1') return;

  const pkg = details.dataset.package;
  const version = details.dataset.version;
  try {
    const group = await provider.packageDetail(scanId(), pkg, { version, ai: useAi });
    // 묶음 상세 응답에는 key 가 없다(보고서 절이라). 표에서 쓰던 키를 얹어 둔다.
    group.key = details.dataset.key;
    loaded.set(group.key, group);

    body.innerHTML = `
      <div class="toolbar pkg-actions">
        <span class="faint">이 패키지만</span>
        <a class="btn small" data-dl="markdown">Markdown</a>
        <a class="btn small" data-dl="html">HTML</a>
        <button type="button" class="btn small" data-print>인쇄 · PDF</button>
        <div class="spacer"></div>
        <span class="faint" data-ai-status></span>
        <button type="button" class="btn small" data-ai hidden>AI 해설 생성</button>
      </div>
      <p><b>${esc(group.recommendation?.action || '')}</b></p>
      ${group.chained_analysis ? `
        <div class="callout" style="margin:.6rem 0">
          <b>연계 분석</b> — 공개 데이터(CVSS 벡터 · CWE)만으로 세운 기술적 연계
          가능성입니다. 우리 환경의 실제 위험도는 노출 경로와 보상 통제를 함께
          보아야 합니다.<br>${esc(group.chained_analysis)}
        </div>` : ''}
      <div class="cve-host"></div>`;

    const params = { package: pkg, version, ai: useAi };
    for (const format of ['markdown', 'html']) {
      const link = body.querySelector(`[data-dl="${format}"]`);
      link.href = provider.reportUrl(scanId(), format, params);
      link.download = `sbomsight-${pkg}.${format === 'markdown' ? 'md' : 'html'}`;
    }
    body.querySelector('[data-print]').addEventListener('click', () => printOnly(details));
    wireAi(body, details, group);
    renderCveRows(body.querySelector('.cve-host'), group, details.dataset.key);

    details.dataset.loaded = '1';
  } catch (error) {
    body.innerHTML = `<div class="banner danger">${esc(error.message)}</div>`;
  }
}

// --- AI 연계 분석 ------------------------------------------------------------
//
// 이 도구에서 AI 가 실제로 값을 더하는 자리다. CVE 하나를 풀어 설명하는 것은
// 룰 문장으로도 되고, 그래서 켜도 달라지는 것이 없어 보였다. 여기서 묻는 것은
// 다르다: **각각으로는 중간 등급인 것이 이어지면 어디에 도달하는가.**
//
//     정보 노출(PR:N, C:H)  →  권한 상승(PR:L, C:H/I:H/A:H)
//
// 앞의 것이 뒤의 것이 요구하는 자격을 만들어 준다. 그 관계는 벡터를 읽고
// 세워야 나오는 판단이라 룰로는 쓸 수 없다.
//
// 후보 선정은 우리가 한다 — CVSS 벡터에서 발판과 상승을 갈라 40건 남짓만
// 보낸다. 48,923건을 보내지 않으므로 분당 토큰 한도 안에서 한 번에 끝난다.

const CONFIDENCE_CLASS = { '높음': 'ok', '보통': 'warn', '낮음': '' };

function chainCard(chain, index) {
  const conf = CONFIDENCE_CLASS[chain.confidence] ?? '';
  return `
  <article class="chain">
    <div class="chain-head">
      <span class="chain-no">${index}</span>
      <b>${esc(chain.title)}</b>
      <span class="spacer"></span>
      <span class="tag ${conf}">확신도 ${esc(chain.confidence)}</span>
    </div>

    <ol class="chain-steps">${(chain.steps || []).map((step) => `
      <li>
        <div class="chain-step-head">
          <span class="chain-role">${esc(step.role)}</span>
          <b class="mono">${esc(step.cve)}</b>
        </div>
        <p>${esc(step.why)}</p>
      </li>`).join('')}</ol>

    <dl class="chain-out">
      <dt>이어졌을 때</dt><dd>${esc(chain.outcome)}</dd>
      <dt>단독과의 차이</dt><dd>${esc(chain.escalation)}</dd>
      ${chain.confidence_reason
        ? `<dt>확신도 근거</dt><dd class="faint">${esc(chain.confidence_reason)}</dd>` : ''}
    </dl>
  </article>`;
}

function candidateNote(candidates) {
  const counts = candidates?.counts || {};
  const labels = candidates?.labels || {};
  return `<p class="muted">CVSS 벡터에서 두 갈래를 갈라 보냈습니다 —
    <b>발판 ${counts.foothold ?? 0}건</b> (${esc(labels.foothold || '')}),
    <b>상승 ${counts.escalation ?? 0}건</b> (${esc(labels.escalation || '')}).
    고르는 기준은 우리 코드이며, AI 는 그 사이의 연쇄 논리만 서술합니다.</p>`;
}

async function renderEscalation() {
  const section = $('#ai-section');
  const body = $('#ai-body');
  const run = $('#ai-run');
  const preview = $('#ai-preview');

  let state;
  try {
    state = await provider.escalation(scanId());
  } catch (error) {
    section.classList.add('hidden');
    console.warn('연계 분석 상태를 읽지 못했습니다:', error);
    return;
  }

  section.classList.remove('hidden');
  $('#ai-model').textContent = state.model || '';
  const counts = state.candidates?.counts || {};
  const pairable = (counts.foothold ?? 0) > 0 && (counts.escalation ?? 0) > 0;

  run.hidden = !state.ai_ready;
  preview.hidden = !pairable;
  run.disabled = !pairable;
  run.textContent = state.generated ? '다시 생성' : '연계 분석 생성';

  // **이미 만들어 둔 것이 있으면 그것부터 그린다.** 지금 AI 가 꺼져 있어도
  // 그때 만든 분석은 유효한 기록이다 — 키를 내린 뒤 보고서를 다시 여는 일이
  // 흔하고, 그때 빈 화면이 나오면 만든 적이 없는 것처럼 보인다.
  if (state.generated) {
    drawEscalation(state.result, state.candidates);
    if (!state.ai_ready) {
      body.insertAdjacentHTML('beforeend',
        '<div class="callout">지금은 AI 사용이 꺼져 있어 다시 생성할 수 없습니다. '
        + '위 내용은 이전에 생성해 둔 것입니다.</div>');
    }
    return;
  }

  if (!state.ai_ready) {
    body.innerHTML = `${candidateNote(state.candidates)}
      <div class="callout">AI 사용이 꺼져 있거나 키가 설정되지 않았습니다.
        <code>.env</code> 에 <code>SBOMSIGHT_AI_ENABLED=1</code> 과
        <code>GEMINI_API_KEY</code> 를 넣고 서버를 다시 시작하면 이 절이 채워집니다.
        <b>AI 없이도 보고서는 룰 기반으로 완결됩니다.</b></div>`;
    return;
  }

  if (!pairable) {
    body.innerHTML = `${candidateNote(state.candidates)}
      <div class="callout">연쇄를 이루려면 자격 없이 성립하는 취약점과 자격을
        요구하는 취약점이 모두 있어야 하는데, 이 범위에서는 한쪽만 확인되었습니다.
        범위를 넓혀 다시 보시겠습니까?</div>`;
    return;
  }

  body.innerHTML = `${candidateNote(state.candidates)}
    <p class="muted">아직 만들지 않았습니다. <b>연계 분석 생성</b>을 누르면
      위 ${(counts.foothold ?? 0) + (counts.escalation ?? 0)}건의 공개 데이터를
      한 번 전송해 연쇄 가능성을 서술합니다.</p>`;
}

function drawEscalation(result, candidates) {
  const body = $('#ai-body');
  const chains = result?.chains || [];
  $('#ai-model').textContent = result?.model || '';

  body.innerHTML = `
    ${candidateNote(candidates)}
    ${result?.note ? `<p class="chain-note">${esc(result.note)}</p>` : ''}
    ${chains.length
      ? chains.map((chain, i) => chainCard(chain, i + 1)).join('')
      : '<div class="callout">제시된 데이터로는 연쇄 가능성이 확인되지 않았습니다.</div>'}
    ${(result?.rejected || []).length
      ? `<div class="callout"><b>표현 정책에 걸린 서술 ${result.rejected.length}건은
           반영하지 않았습니다.</b></div>` : ''}
    ${(result?.errors || []).length
      ? `<div class="banner danger">${esc(result.errors.join(' · '))}</div>` : ''}
    <p class="faint">공개 데이터(CVSS 벡터 · CWE)만으로 세운 기술적 연계 가능성입니다.
      실제 성립 여부는 노출 경로와 보상 통제를 함께 보아야 합니다.
      ${result?.created_at ? `생성 ${esc(formatWhen(result.created_at))}` : ''}</p>`;
}

$('#ai-run').addEventListener('click', async (event) => {
  const button = event.currentTarget;
  const label = button.textContent;
  button.disabled = true;
  button.textContent = '분석 중…';
  try {
    const result = await provider.generateEscalation(scanId());
    drawEscalation(result, result.scope);
    button.textContent = '다시 생성';
  } catch (error) {
    $('#ai-body').insertAdjacentHTML('afterbegin',
      `<div class="banner danger">${esc(error.message)}</div>`);
    button.textContent = label;
  } finally {
    button.disabled = false;
  }
});

$('#ai-preview').addEventListener('click', async () => {
  const body = $('#ai-body');
  body.insertAdjacentHTML('afterbegin', '<p class="muted" id="ai-loading">조립하는 중…</p>');
  try {
    const preview = await provider.escalationPreview(scanId());
    $('#ai-loading')?.remove();
    body.insertAdjacentHTML('afterbegin', `
      <div class="callout" id="ai-preview-box">
        <div class="toolbar" style="margin:0 0 .5rem">
          <b>${preview.ok ? '전송 항목 확인됨' : '전송 차단'}</b>
          <div class="spacer"></div>
          <button type="button" class="btn small" id="ai-preview-close">닫기</button>
        </div>
        <p class="muted">${esc(preview.note || '')}</p>
        <pre class="step-cmd" style="max-height:22rem;overflow:auto">${esc(preview.prompt || '')}</pre>
      </div>`);
    $('#ai-preview-close').addEventListener('click', () => $('#ai-preview-box').remove());
  } catch (error) {
    $('#ai-loading')?.remove();
    body.insertAdjacentHTML('afterbegin',
      `<div class="banner danger">${esc(error.message)}</div>`);

});

/**
 * AI 해설은 **패키지 하나씩** 만든다.
 *
 * 한 번에 몰아 보내면 분당 토큰(TPM) 한도를 첫 요청에서 넘겨 그 뒤가 전부
 * 실패한다 — 켜 두고도 달라지는 것이 없었던 이유가 그것이다. 조치 단위가
 * 패키지이므로 생성 단위도 패키지로 맞춘다. 담당자가 필요한 것부터 하나씩
 * 누르면 호출 속도도 사람 손에 맞춰진다.
 */
function wireAi(body, details, group) {
  const button = body.querySelector('[data-ai]');
  const status = body.querySelector('[data-ai-status]');
  if (!button || !aiReady) return;

  const done = (group.findings || []).filter((f) => f.narrative_source === 'ai').length;
  const total = (group.findings || []).length;
  if (done >= total && total > 0) {
    status.textContent = `AI 해설 ${total}건 적용됨`;
    return;
  }
  button.hidden = false;
  if (done) status.textContent = `${done}/${total}건 적용됨`;

  button.addEventListener('click', async () => {
    button.disabled = true;
    status.textContent = `${total}건 생성 중…`;
    try {
      const result = await provider.generateNarratives(scanId(), {
        package: group.package, version: group.installed_version,
      });
      status.textContent = `${result.applied}/${result.requested}건 적용했습니다`
        + (result.model ? ` (${result.model})` : '');
      // 다시 받아 그린다. 적용된 서술이 화면에 반영되어야 확인할 수 있다.
      useAi = true;
      $('#use-ai').checked = true;
      details.dataset.loaded = '';
      await expandPackage(details);
    } catch (error) {
      status.textContent = '';
      body.querySelector('.pkg-actions').insertAdjacentHTML('afterend',
        `<div class="banner danger">${esc(error.message)}</div>`);
      button.disabled = false;
    }
  });
}

/** `9.4 / Critical (CVSS:3.1/...)` → `9.4`. 벡터는 팝업 안에 그대로 있다. */
function scoreOnly(badge) {
  if (!badge || badge === '미확인') return '—';
  return String(badge).split('/')[0].trim();
}

/** 묶음 안의 CVE — **표 한 줄씩**. 근거는 눌렀을 때 팝업으로 낸다. */
function renderCveRows(host, group, key) {
  const items = group.findings || [];
  host.innerHTML = `<table class="cve-list"><thead><tr>
      <th>대응 검토</th><th>CVE</th><th class="num">심각도</th>
      <th class="num">악용 예측</th><th>수정 버전</th><th>근거 보기</th>
    </tr></thead><tbody>${items.map((item, index) => `
      <tr class="clickable" data-index="${index}">
        <td>${priorityPill(item.priority)}</td>
        <td><b class="mono">${esc(item.cve)}</b></td>
        <td class="num">${esc(scoreOnly(item.badge?.cvss))}</td>
        <td class="num">${esc(item.badge?.epss === '미확인' ? '—' : (item.badge?.epss ?? '—'))}</td>
        <td class="mono">${esc(item.badge?.fixed_version ?? '—')}</td>
        <td class="faint">펼쳐 보기 →</td>
      </tr>`).join('')}</tbody></table>`;

  host.querySelectorAll('tr.clickable').forEach((row) => {
    row.addEventListener('click', () => openFinding(key, Number(row.dataset.index)));
  });
}

// --- CVE 근거 팝업 -----------------------------------------------------------
//
// 한 건의 근거가 145줄이다. 표 안에 펼치면 문서가 아니라 두루마리가 된다.
// 여기서는 한 건만 보고, 인쇄도 그 한 건만 한다.

/** 펼쳐 받아 둔 묶음. 팝업이 다시 서버를 두드리지 않게 한다. */
const loaded = new Map();

function openFinding(key, index) {
  const group = loaded.get(key);
  const item = group?.findings?.[index];
  if (!item) return;
  group.key = key;

  $('#cve-title').textContent = `${item.cve} · ${group.package}`;
  $('#cve-body').innerHTML = renderFinding(item, index + 1);

  const params = {
    package: group.package, version: group.installed_version, ai: useAi, cve: item.cve,
  };
  for (const format of ['markdown', 'html']) {
    const link = $(`#cve-dl-${format === 'markdown' ? 'md' : 'html'}`);
    link.href = provider.reportUrl(scanId(), format, params);
    link.download = `sbomsight-${item.cve}.${format === 'markdown' ? 'md' : 'html'}`;
  }
  wireCveAi(group, item);
  $('#cve-dialog').showModal();
}

/**
 * 팝업 안의 **단건** AI 해설 생성.
 *
 * 가장 잘게 부르는 길이다. 패키지 단위도 CVE 가 많으면 한 번에 열 건이
 * 넘는데, 여기서는 한 건이다 — 분당 토큰이 빠듯할 때 이것부터 쓰면 된다.
 * 서버는 패키지 단위로 받으므로 그 묶음을 만들고, 이미 만들어진 것은
 * 다시 만들지 않는다.
 */
function wireCveAi(group, item) {
  const button = $('#cve-ai');
  const status = $('#cve-ai-status');
  const fresh = button.cloneNode(true);          // 이전 리스너를 떼어 낸다
  button.replaceWith(fresh);

  if (!aiReady) {
    fresh.hidden = true;
    status.textContent = '';
    return;
  }
  if (item.narrative_source === 'ai') {
    fresh.hidden = true;
    status.textContent = 'AI 해설 적용됨';
    return;
  }

  fresh.hidden = false;
  status.textContent = '';
  fresh.addEventListener('click', async () => {
    fresh.disabled = true;
    status.textContent = '생성 중…';
    try {
      const result = await provider.generateNarratives(scanId(), {
        package: group.package, version: group.installed_version,
      });
      status.textContent = `${result.applied}/${result.requested}건 적용했습니다`;
      useAi = true;
      $('#use-ai').checked = true;
      // 이 묶음을 다시 받아 팝업과 표를 새 서술로 바꾼다.
      const details = $(`details.pkg[data-key="${CSS.escape(group.key || '')}"]`);
      if (details) {
        details.dataset.loaded = '';
        await expandPackage(details);
        const refreshed = loaded.get(group.key);
        const again = (refreshed?.findings || []).findIndex((f) => f.cve === item.cve);
        if (again >= 0) openFinding(group.key, again);
      }
    } catch (error) {
      status.textContent = '';
      $('#cve-body').insertAdjacentHTML('afterbegin',
        `<div class="banner danger">${esc(error.message)}</div>`);
      fresh.disabled = false;
    }
  });
}

$('#cve-close').addEventListener('click', () => $('#cve-dialog').close());
$('#cve-print').addEventListener('click', () => {
  // 팝업 안의 내용만 인쇄한다. `<dialog>` 는 열려 있으면 그것만 인쇄된다.
  document.body.classList.add('printing-dialog');
  const cleanup = () => {
    document.body.classList.remove('printing-dialog');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  window.print();
});

/** 이 묶음만 인쇄한다. 8,154개를 통째로 인쇄할 사람은 없다. */
function printOnly(details) {
  document.body.classList.add('printing-one');
  details.classList.add('print-target');
  const cleanup = () => {
    document.body.classList.remove('printing-one');
    details.classList.remove('print-target');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  window.print();
}

$('#packages').addEventListener('toggle', (event) => {
  if (event.target.tagName === 'DETAILS' && event.target.open) expandPackage(event.target);
}, true);

$('#pkg-prev').addEventListener('click', () => {
  pkgOffset = Math.max(0, pkgOffset - PACKAGE_PAGE);
  renderPackages();
});
$('#pkg-next').addEventListener('click', () => {
  pkgOffset += PACKAGE_PAGE;
  renderPackages();
});
for (const selector of ['#pkg-priority', '#pkg-search']) {
  const el = $(selector);
  let timer = null;
  el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
    window.clearTimeout(timer);
    timer = window.setTimeout(() => { pkgOffset = 0; renderPackages(); }, 250);
  });
}

function scanId() {
  return picker.value || params.get('scan') || '';
}

/** 이 스캔의 전체 탐지 건수. "전체 내려받기" 가 얼마나 큰지 판단하는 데 쓴다. */
let scanTotal = 0;

async function load(id) {
  const summary = await provider.scanSummary(id);
  scanTotal = summary.total;

  // 범위는 서버에 기록된 선택이다. 주소창에 싣지 않는다 — 5,000건이면 URL 이
  // 250KB 가 되고 HTTP 파서가 요청을 끊는다.
  try {
    const saved = await provider.getSelection(id);
    scopedPackages = saved?.packages || [];
  } catch {
    scopedPackages = [];
  }
  const meta = await provider.getScanMeta(id);
  const scan = meta.metadata || {};

  $('#meta').innerHTML = `
    <dt>스캔 시각</dt><dd>${esc(formatWhen(meta.created_at))}</dd>
    <dt>스캔 ID</dt><dd class="mono">${esc(id)}</dd>
    <dt>대상 SBOM</dt><dd>${esc(scan.sbom_filename || '(미상)')}
      <span class="faint">${esc(scan.sbom_format || '')}</span></dd>
    <dt>컴포넌트</dt><dd>${(scan.component_count ?? 0).toLocaleString()}개</dd>
    <dt>탐지</dt><dd>${summary.total.toLocaleString()}건 · 패키지 ${summary.affected_packages.toLocaleString()}개</dd>
    <dt>범위</dt><dd>${scopedPackages.length
      ? `고른 패키지 <b>${scopedPackages.length.toLocaleString()}개</b>`
      : '이 스캔 전체'}</dd>`;

  // AI 서술이 실제로 저장되어 있을 때만 선택지를 보여 준다. 만들어 둔 것이
  // 없는데 체크박스만 있으면, 켜도 아무것도 달라지지 않아 고장으로 읽힌다.
  // 만드는 것은 패키지마다 따로 한다 — 한 번에 몰아 보내면 분당 토큰 한도를
  // 첫 요청에서 넘긴다.
  $('#ai-wrap').hidden = (meta.narratives?.count || 0) === 0 && !useAi;

  $('#back-to-scan').href = `scan.html?scan=${encodeURIComponent(id)}`;
  $('#disclaimer').innerHTML = `<div class="banner info">${esc(DISCLAIMER)}</div>`;

  renderStats($('#stats'), summary);
  renderSummaryLine($('#summary-line'), summary);

  const enrichment = meta.enrichment || {};
  $('#snapshot-card').innerHTML = Object.keys(enrichment).length
    ? `<h3 style="margin-top:0">사용한 위협정보 스냅샷</h3>
       <table><thead><tr><th>소스</th><th>상태</th><th class="num">수록</th>
         <th class="num">해당</th><th>기준일</th></tr></thead><tbody>${
        Object.entries(enrichment).map(([name, s]) => `<tr>
          <td>${esc(name)}</td><td>${esc(s.state)}</td>
          <td class="num">${s.entries ?? 0}</td><td class="num">${s.matched ?? 0}</td>
          <td>${esc(s.snapshot_date || '-')}</td></tr>`).join('')}</tbody></table>`
    : '<p class="muted">위협정보 보강 없이 생성된 보고서입니다. EPSS·KEV·Exploit이 미확인으로 남아 있습니다.</p>';
  $('#summary').classList.remove('hidden');
  $('#actions').classList.remove('hidden');

  // 표에서 "이 패키지 보고서" 로 들어온 경우. 조치 단위 하나가 문서 하나다 —
  // 이것이 이 화면의 기본 쓰임이고, 8,154개짜리 문서는 예외 쪽이다.
  const onePackage = params.get('package');
  if (onePackage) {
    $('#pkg-search').value = onePackage;
    scopedPackages = [];
  }

  pkgOffset = Number(params.get('pkg') || 0) || 0;
  await Promise.all([renderPackages({ pushUrl: false }), renderEscalation()]);

  if (onePackage) {
    const only = $('#packages').querySelector('details.pkg');
    if (only) only.open = true;
  }

  const scoped = scopedPackages.length > 0;
  $('#dl-md').href = provider.reportUrl(id, 'markdown', { saved: scoped, ai: useAi });
  $('#dl-md').download = `sbomsight-${id}.md`;
  $('#dl-html').href = provider.reportUrl(id, 'html', { saved: scoped, ai: useAi });
  $('#dl-html').download = `sbomsight-${id}.html`;
}

/**
 * 전체 내려받기는 큰 스캔에서 **정말로 크다** — 48,923건이면 62MB에 26초다.
 * 눌러 놓고 브라우저가 멈춘 줄 아는 일이 없도록 먼저 말해 준다. 선택 범위가
 * 있으면 그만큼만 나가므로 묻지 않는다.
 */
const HEAVY = 2000;
for (const [id, label] of [['#dl-md', 'Markdown'], ['#dl-html', 'HTML']]) {
  $(id).addEventListener('click', (event) => {
    if (scopedPackages.length || scanTotal < HEAVY) return;
    const ok = window.confirm(
      `이 스캔은 ${scanTotal.toLocaleString()}건 전체를 담습니다. 파일이 수십 MB가 되고 `
      + '만드는 데 수십 초가 걸립니다.\n\n'
      + '패키지 하나만 필요하면 취소하고, 그 패키지를 펼쳐 "이 패키지만" 버튼을 눌러 주세요.\n\n'
      + `전체 ${label} 를 계속 내려받을까요?`);
    if (!ok) event.preventDefault();
  });
}

// 8,154개를 통째로 인쇄할 수는 없다 — 접힌 `<details>` 는 내용이 렌더되지도
// 않으므로, 아무것도 펼치지 않고 누르면 빈 목록만 나온다. 그 상태를 말해 준다.
$('#print').addEventListener('click', () => {
  if (!document.querySelector('details.pkg[open]')) {
    window.alert('인쇄할 패키지를 먼저 펼쳐 주세요. 펼친 항목만 인쇄됩니다.\n'
      + '전체가 필요하면 "전체 Markdown" 또는 "전체 HTML" 을 내려받아 주세요.');
    return;
  }
  window.print();
});

// --- AI 해설 포함 여부 ------------------------------------------------------
$('#use-ai').checked = useAi;
$('#use-ai').addEventListener('change', (event) => {
  useAi = event.target.checked;
  const query = new URLSearchParams({ scan: picker.value });
  if (useAi) query.set('ai', '1');
  history.replaceState(null, '', `?${query}`);
  load(picker.value).catch((error) => {
    $('#banner').innerHTML = `<div class="banner danger">${esc(error.message)}</div>`;
  });
});

// --- 스캔 선택 --------------------------------------------------------------
const picker = $('#pick-scan');
let scans = [];
try {
  scans = (await provider.listScans()).scans || [];
} catch (error) {
  $('#banner').innerHTML = `<div class="banner danger">스캔 목록을 불러오지 못했습니다: ${esc(error.message)}</div>`;
}

if (!scans.length) {
  $('#banner').innerHTML = provider.readonly
    ? `<div class="banner warn">전시할 결과가 아직 없습니다.</div>`
    : `<div class="banner warn">아직 스캔 기록이 없습니다.
        <a href="scan.html">스캔 페이지</a>에서 SBOM을 올려 주세요.</div>`;
  $('#meta-card').classList.add('hidden');
} else {
  picker.innerHTML = scans.map((s) =>
    `<option value="${esc(s.scan_id)}">${esc(formatWhen(s.created_at))} · ${esc(s.metadata?.sbom_filename || s.scan_id)}
      (${s.finding_count.toLocaleString()}건)</option>`).join('');
  const requested = params.get('scan');
  picker.value = requested && scans.some((s) => s.scan_id === requested) ? requested : scans[0].scan_id;
  picker.addEventListener('change', () => {
    // 스캔을 바꾸면 이전 스캔의 선택은 의미가 없다. 범위를 전체로 되돌린다.
    scopedPackages = [];
    history.replaceState(null, '', `?scan=${encodeURIComponent(picker.value)}`);
    load(picker.value).catch((error) => {
      $('#banner').innerHTML = `<div class="banner danger">${esc(error.message)}</div>`;
    });
  });
  try {
    await load(picker.value);
  } catch (error) {
    $('#banner').innerHTML = `<div class="banner danger">보고서를 불러오지 못했습니다: ${esc(error.message)}</div>`;
  }
}
</script>
</body>
</html>
