<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBOMSight</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar"></header>

<main class="wide">
  <div class="page-head">
    <h1>스캔 기록</h1>
    <a class="btn primary" href="scan.html">SBOM 올리기</a>
  </div>

  <div id="banner"></div>

  <div class="card">
    <div id="recent" class="muted">불러오는 중…</div>
  </div>
</main>

<script type="module">
import { getProvider } from './js/providers/index.js';
import { $, esc } from './js/core/ui.js';
import { mountTopbar } from './js/core/nav.js';

await mountTopbar('index.html');
const provider = await getProvider();

// --- 도구 상태 --------------------------------------------------------------
const banner = $('#banner');
try {
  const health = await provider.health();
  if (health.mode === 'static') {
    banner.innerHTML = `<div class="banner info">
      <b>전시 모드</b> — ${esc(health.note || '')}
      ${health.tools?.grype ? `<span class="faint">grype ${esc(health.tools.grype)}</span>` : ''}
      ${health.exported_at ? `<span class="faint">· 내보낸 시각 ${esc(health.exported_at)}</span>` : ''}</div>`;
  } else if (!health.ok) {
    banner.innerHTML = `<div class="banner warn">
      <b>Grype를 찾을 수 없습니다.</b> <code>scripts/install-tools.ps1</code> (Windows) 또는
      <code>scripts/install-tools.sh</code> (Linux)로 설치한 뒤
      <code>grype db update</code>로 취약점 DB를 준비하세요.</div>`;
  } else {
    const db = health.tools.grype_db?.built || health.tools.grype_db?.schemaVersion || '';
    banner.innerHTML = `<div class="banner info">
      grype <b>${esc(health.tools.grype)}</b>${db ? ` · DB ${esc(db)}` : ''}
      · 판정 기준 <b>${esc(health.policy.label)}</b>
      · AI ${health.ai.ready ? '<b>사용 가능</b>' : '<b>미사용</b>'}</div>`;
  }
} catch (error) {
  banner.innerHTML = `<div class="banner danger">서버 상태를 확인하지 못했습니다: ${esc(error.message)}</div>`;
}

// --- 스캔 목록 --------------------------------------------------------------
const recent = $('#recent');
try {
  const { scans } = await provider.listScans();
  if (!scans.length) {
    recent.innerHTML = provider.readonly
      ? '<span class="muted">전시할 결과가 아직 없습니다.</span>'
      : '<span class="muted">아직 스캔 기록이 없습니다. <a href="scan.html">SBOM을 올려</a> 시작하세요.</span>';
  } else {
    recent.innerHTML = `<div class="table-scroll"><table>
      <thead><tr><th>시각</th><th>SBOM</th><th class="num">컴포넌트</th>
        <th class="num">탐지</th><th>스캔 ID</th><th></th></tr></thead>
      <tbody>${scans.map((s) => `
        <tr>
          <td>${esc(s.created_at)}</td>
          <td>${esc(s.metadata?.sbom_filename || '—')}</td>
          <td class="num">${s.metadata?.component_count ?? '—'}</td>
          <td class="num">${s.finding_count}</td>
          <td class="mono faint">${esc(s.scan_id)}</td>
          <td><a href="scan.html?scan=${encodeURIComponent(s.scan_id)}">열기</a></td>
        </tr>`).join('')}</tbody></table></div>`;
  }
} catch (error) {
  recent.innerHTML = `<span class="muted">스캔 목록을 불러오지 못했습니다: ${esc(error.message)}</span>`;
}
</script>
</body>
</html>
