<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — SBOMSight</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="gate">

<main class="gate-box">
  <div class="brand"><a href="index.html">SBOMSight</a><small>SBOM 기반 취약점 대응 검토</small></div>

  <div class="card" id="panel">
    <p class="muted">확인 중…</p>
  </div>

  <p class="faint" id="foot"></p>
</main>

<script type="module">
import { $, esc } from './js/core/ui.js';

const panel = $('#panel');
const foot = $('#foot');

/** ?next= 로 돌아갈 곳. 외부 주소로 튕기지 않도록 사이트 안 경로만 받는다. */
function nextPath() {
  const raw = new URLSearchParams(window.location.search).get('next') || 'index.html';
  // `//evil.example` 은 프로토콜 상대 URL 이라 사이트 밖으로 나간다.
  if (raw.startsWith('//') || /^[a-z]+:/i.test(raw)) return 'index.html';
  return raw.startsWith('/') ? raw.slice(1) || 'index.html' : raw;
}

async function post(path, body) {
  const response = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.detail || `${response.status} ${response.statusText}`);
  return payload;
}

function form({ title, note, submit, extra = '' }) {
  panel.innerHTML = `
    <h1>${esc(title)}</h1>
    ${note ? `<p class="muted">${note}</p>` : ''}
    <form id="form" autocomplete="on">
      <label>계정 이름
        <input name="username" required autocomplete="username" autofocus>
      </label>
      <label>비밀번호
        <input name="password" type="password" required autocomplete="current-password">
      </label>
      ${extra}
      <div id="error" class="banner danger" hidden></div>
      <button class="btn primary" type="submit">${esc(submit)}</button>
    </form>`;
  return $('#form');
}

function showError(message) {
  const box = $('#error');
  box.hidden = false;
  box.textContent = message;
}

let state;
try {
  state = await (await fetch('api/auth/state')).json();
} catch (error) {
  panel.innerHTML = `<div class="banner danger">서버에 연결하지 못했습니다: ${esc(error.message)}</div>`;
  throw error;
}

if (state.authenticated) {
  window.location.replace(nextPath());
} else if (state.needs_setup) {
  // 최초 1회. 계정이 하나도 없을 때만 이 화면이 나온다.
  const el = form({
    title: '관리자 계정 만들기',
    note: '이 도구에는 아직 계정이 없습니다. 처음 만드는 계정이 관리자가 되며, '
        + '이후 계정 추가·삭제는 웹의 <b>설정 → 계정</b>에서 합니다.',
    submit: '관리자 계정 만들기',
    extra: `<label>비밀번호 확인
        <input name="confirm" type="password" required autocomplete="new-password">
      </label>`,
  });
  el.querySelector('[name=password]').autocomplete = 'new-password';
  foot.textContent = `접속 주소 ${state.client_ip} · 비밀번호는 8자 이상`;

  el.addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = new FormData(el);
    if (data.get('password') !== data.get('confirm')) {
      showError('두 번 입력한 비밀번호가 다릅니다.');
      return;
    }
    try {
      await post('api/auth/setup', {
        username: data.get('username'),
        password: data.get('password'),
      });
      window.location.replace(nextPath());
    } catch (error) {
      showError(error.message);
    }
  });
} else {
  const el = form({ title: '로그인', submit: '로그인' });
  foot.textContent = `접속 주소 ${state.client_ip}`;

  el.addEventListener('submit', async (event) => {
    event.preventDefault();
    const data = new FormData(el);
    try {
      await post('api/auth/login', {
        username: data.get('username'),
        password: data.get('password'),
      });
      window.location.replace(nextPath());
    } catch (error) {
      showError(error.message);
    }
  });
}
</script>
</body>
</html>
